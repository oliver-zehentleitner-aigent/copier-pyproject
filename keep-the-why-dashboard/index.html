ll\nrequests and never in `check`.\n\n**Reason:** nothing checked the RST sources for markup Sphinx tolerates\nsilently, nothing caught link rot, and nothing caught two filenames differing\nonly in case — fine on Linux, a collision on the Windows and macOS matrix\ncells. All three are account-free, so always-on fits. Link checking hits the\nnetwork and is inherently flaky; a dead external link must never block an\nunrelated merge.", "reason": "nothing checked the RST sources for markup Sphinx tolerates\nsilently, nothing caught link rot, and nothing caught two filenames differing\nonly in case — fine on Linux, a collision on the Windows and macOS matrix\ncells. All three are account-free, so always-on fits. Link checking hits the\nnetwork and is inherently flaky; a dead external link must never block an\nunrelated merge.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": ["architecture-contracts.md", "ci-topology.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-stack.md#sphinx-warnings-use-an-exact-reviewable-allowlist", "uuid": "2a555902-38e7-47d4-a231-445a8e6caa0f", "file": "docs-stack.md", "line": 96, "end_line": 126, "title": "Sphinx warnings use an exact, reviewable allowlist", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "[issue #187](https://github.com/hasansezertasan/copier-pyproject/issues/187), [PR #242](https://github.com/hasansezertasan/copier-pyproject/pull/242); commit [ab6a857](https://github.com/hasansezertasan/copier-pyproject/commit/ab6a8575d401f41fb35ab98a1bf50a2a1ff29fe7); `docs/template-architecture.md`, Sphinx warning gate", "verification": "corroborated — the rendered warning checker compares normalized sets in both directions, and the docs-build environment invokes it", "revisit_when": "Sphinx changes warning formatting or a previously unavoidable warning disappears", "see": [{"locator": "docs-versioning.md#the-sphinx-warning-gate-runs-in-a-job-the-required-check-context-aggregates", "uuid": "bc382803-5aa9-4582-9bad-1c9efef8fc49", "date": "2026-10-11", "file": "docs-versioning.md", "anchor": "the-sphinx-warning-gate-runs-in-a-job-the-required-check-context-aggregates", "remote": null}], "superseded_by": null, "body": {"text": "The docs-build gate captures Sphinx warnings and compares them with a committed\nallowlist. It rejects both new unexpected warnings and expected warnings that\nare no longer emitted. The default allowlist is empty. Normalization removes\nmachine-specific path prefixes and folds Windows separators, while preserving\nline numbers. Sphinx's `nitpicky` mode remains off.\n\n**Reason:** an individually justified upstream warning should not force a choice\nbetween permanently red documentation builds and broad warning suppression.\nExact entries make exceptions reviewable; the reverse comparison prevents\nobsolete exceptions from accumulating silently.\n\n**Rejected alternative:** make every warning fatal directly through Sphinx's\nwarning-as-error mode. It was superseded by the allowlist so unavoidable\nexceptions can coexist with a regression gate.\n\n**Alternative deferred:** enable `nitpicky` immediately. The issue anticipated\na noisy initial cross-reference cleanup and left this for a separate pass.\nRemoving line numbers was also considered but not selected; no further reason\nfor that choice was established in the reviewed sources.", "reason": "an individually justified upstream warning should not force a choice\nbetween permanently red documentation builds and broad warning suppression.\nExact entries make exceptions reviewable; the reverse comparison prevents\nobsolete exceptions from accumulating silently.", "rejected": ["make every warning fatal directly through Sphinx's\nwarning-as-error mode. It was superseded by the allowlist so unavoidable\nexceptions can coexist with a regression gate."], "consequence": null, "considered": null, "why_open": null}, "refs": ["docs-versioning.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-stack.md#the-sphinx-subsystem-is-toggleable-include-docs-default-on-the-maintainer-guide-is-not", "uuid": "e983d1e7-421f-4926-9415-a3da4626f220", "file": "docs-stack.md", "line": 127, "end_line": 153, "title": "The Sphinx subsystem is toggleable (`include_docs`, default on); the maintainer guide is not", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-025 (`docs/adr/025-optional-docs-subsystem.md`); issue #252", "verification": null, "revisit_when": "the six files that hard-reference `docs/maintaining/setup.rst` move, or a preset wants docs off by default", "see": [{"locator": "repo-setup.md#maintainer-repository-setup-has-one-actor-tagged-home-in-the-docs-tree", "uuid": "4e0fcdab-d3b9-4f96-b61d-8e34927af98d", "date": "2026-10-11", "file": "repo-setup.md", "anchor": "maintainer-repository-setup-has-one-actor-tagged-home-in-the-docs-tree", "remote": null}], "superseded_by": null, "body": {"text": "One boolean gates the whole Sphinx site: the `docs/` pages, the `docs`\ndependency group, the `docs-*` tox envs, sphinx-lint in style and prek, the\ndocs workflows, the `deploy-docs` release job and the related README, support\nand contributing links. It defaults on in every preset. `docs/maintaining/`\nships regardless; only its GitHub Pages step is conditional.\n\n**Reason:** docs was the only substantial subsystem with no toggle, and a small\nlibrary or internal tool often wants a README and nothing more. Default-on keeps\n`copier update` non-breaking and the published-site baseline. The maintainer\nsetup guide is read as plain text by the `repo-setup` skill and hard-referenced\nfrom six other files, so relocating it would break all of them; a `docs/`\ndirectory holding just the guide is preferable.\n\n**Consequence:** a README-only project is a supported shape; the later\ndocs-dependent features (tested examples, CLI reference, versioned docs) are\ngated by construction.", "reason": "docs was the only substantial subsystem with no toggle, and a small\nlibrary or internal tool often wants a README and nothing more. Default-on keeps\n`copier update` non-breaking and the published-site baseline. The maintainer\nsetup guide is read as plain text by the `repo-setup` skill and hard-referenced\nfrom six other files, so relocating it would break all of them; a `docs/`\ndirectory holding just the guide is preferable.", "rejected": [], "consequence": "a README-only project is a supported shape; the later\ndocs-dependent features (tested examples, CLI reference, versioned docs) are\ngated by construction.", "considered": null, "why_open": null}, "refs": ["repo-setup.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-stack.md#documentation-code-examples-are-executed-not-pasted", "uuid": "2a95e867-8cca-44e9-9844-a7109e5f6a7b", "file": "docs-stack.md", "line": 154, "end_line": 188, "title": "Documentation code examples are executed, not pasted", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-028 (`docs/adr/028-tested-documentation-examples.md`)", "verification": null, "revisit_when": "another Markdown file is adopted as a doctest surface, or the per-component CI jobs stop replacing tox's default env list", "see": [{"locator": "docs-stack.md#the-sphinx-subsystem-is-toggleable-include_docs-default-on-the-maintainer-guide-is-not", "uuid": "e983d1e7-421f-4926-9415-a3da4626f220", "date": "2026-10-11", "file": "docs-stack.md", "anchor": "the-sphinx-subsystem-is-toggleable-include_docs-default-on-the-maintainer-guide-is-not", "remote": null}], "superseded_by": null, "body": {"text": "Complete Python examples live in `docs/examples/`, rendered into Sphinx pages\nwith `literalinclude` and imported or called by the regular pytest suite. The\ndirectory is in scope for ruff, every type checker and pylint, but outside the\npackage and coverage source set. The Sphinx `doctest` extension runs inline\n`>>>` snippets through a `docs-doctest` tox env and a dedicated CI job in the\n`check` gate. The top-level `README.md` is a pytest `testpaths` entry collected\nwith a doctest glob for that basename only; `tests/conftest.py` ignores `*.md`\nso no future `tests/**/README.md` is swept in, and the prek pytest hook runs\nbare `pytest` so `testpaths` is honoured. README examples leave a blank line\nbefore the closing fence because doctest ends expected output at the first\nblank line.\n\n**Reason:** pasted fences drift silently from the API; neither the suite nor the\nstatic gates execute them, which the template's high coverage bar otherwise\nmakes easy to miss. The dedicated doctest job exists because the per-component\ntest jobs pass marker arguments that replace tox's default env list, so\ndoctests would never run otherwise. Examples are documentation, not product\ncode, hence outside coverage.\n\n**Rejected alternative:** an explicit `pytest tests` target in the hook — would\nlet a broken README doctest pass locally and surface only in CI.\n\n**Consequence:** the Sphinx builder owns `.rst` prose and pytest owns the one\ncurated Markdown surface; neither collector overlaps the other.", "reason": "pasted fences drift silently from the API; neither the suite nor the\nstatic gates execute them, which the template's high coverage bar otherwise\nmakes easy to miss. The dedicated doctest job exists because the per-component\ntest jobs pass marker arguments that replace tox's default env list, so\ndoctests would never run otherwise. Examples are documentation, not product\ncode, hence outside coverage.", "rejected": ["an explicit `pytest tests` target in the hook — would\nlet a broken README doctest pass locally and surface only in CI."], "consequence": "the Sphinx builder owns `.rst` prose and pytest owns the one\ncurated Markdown surface; neither collector overlaps the other.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-stack.md#the-four-auto-generated-reference-pages-keep-their-current-generators", "uuid": "aa157658-027b-42c3-8a2b-1e6b40b6b739", "file": "docs-stack.md", "line": 189, "end_line": 220, "title": "The four auto-generated reference pages keep their current generators", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-038 (`docs/adr/038-sphinx-api-reference-rendering-strategy.md`), refreshed 2026-10-05", "verification": null, "revisit_when": "a `sphinxcontrib-openapi` pilot confirms OpenAPI 3.1 rendering, an AsyncAPI Sphinx renderer appears, or argparse CLIs are judged to need a reference page", "see": [{"locator": "docs-stack.md#sphinx-with-the-bare-shibuya-theme-replaces-mkdocs", "uuid": "5133caa8-3231-4d4d-877b-041b315cb87a", "date": "2026-10-11", "file": "docs-stack.md", "anchor": "sphinx-with-the-bare-shibuya-theme-replaces-mkdocs", "remote": null}], "superseded_by": null, "body": {"text": "The CLI (Typer), config (autodoc-pydantic), OpenAPI and AsyncAPI references are\nall derived from the live app at build time, nothing committed. The OpenAPI and\nAsyncAPI pages are raw spec dumps via `literalinclude`; none of the surveyed\nextensions is adopted now. `sphinxcontrib-openapi` is the designated future\nupgrade for OpenAPI; `sphinx-argparse-cli` the candidate if argparse CLIs get a\npage; an AsyncAPI renderer does not exist and would be an upstream\ncontribution.\n\n**Reason:** every extension is another docs dependency to pin, so the bar is a\nrendering upgrade large enough to justify it — met only for OpenAPI/AsyncAPI,\nwhere today's output is a dump. Native-rST rendering is the only style\nconsistent with the offline, self-contained docs posture; ReDoc, Swagger-UI\n(CDN by default), RapiDoc and the embeddable bundles ship a JS app into the\ndocs. `sphinxcontrib-typer` covers only Typer, so argparse would still need\nseparate handling. `asyncapi-sphinx-ext` is early-stage, stale, and wants\nchannels authored in docstrings rather than consuming a generated spec.\n\n**Rejected alternative:** `sphinx-pydantic` — abandoned. `pydantic-kitbash` and\n`sphinx-jsonschema` — no advantage for a settings reference.\n\n**Consequence:** `sphinxcontrib-openapi`'s OpenAPI 3.1 support has lagged and\nboth frameworks emit 3.1, so a pilot must precede adoption.", "reason": "every extension is another docs dependency to pin, so the bar is a\nrendering upgrade large enough to justify it — met only for OpenAPI/AsyncAPI,\nwhere today's output is a dump. Native-rST rendering is the only style\nconsistent with the offline, self-contained docs posture; ReDoc, Swagger-UI\n(CDN by default), RapiDoc and the embeddable bundles ship a JS app into the\ndocs. `sphinxcontrib-typer` covers only Typer, so argparse would still need\nseparate handling. `asyncapi-sphinx-ext` is early-stage, stale, and wants\nchannels authored in docstrings rather than consuming a generated spec.", "rejected": ["`sphinx-pydantic` — abandoned. `pydantic-kitbash` and\n`sphinx-jsonschema` — no advantage for a settings reference."], "consequence": "`sphinxcontrib-openapi`'s OpenAPI 3.1 support has lagged and\nboth frameworks emit 3.1, so a pilot must precede adoption.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-versioning.md#docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages", "uuid": "858025c1-19a6-46f6-a237-01ba6477262a", "file": "docs-versioning.md", "line": 3, "end_line": 44, "title": "Docs publish only the current version and carry older built versions forward from `gh-pages`", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-027 §1–2 (`docs/adr/027-versioned-documentation-and-last-updated-stamps.md`); issue #165; the Litestar docs build is the model", "verification": null, "revisit_when": "a Sphinx multiversion tool stops rebuilding old tags, or `conf.py` stops running build-time generators against the live app", "see": [{"locator": "docs-stack.md#sphinx-with-the-bare-shibuya-theme-replaces-mkdocs", "uuid": "5133caa8-3231-4d4d-877b-041b315cb87a", "date": "2026-10-11", "file": "docs-stack.md", "anchor": "sphinx-with-the-bare-shibuya-theme-replaces-mkdocs", "remote": null}, {"locator": "docs-stack.md#pr-docs-previews-deploy-to-a-subfolder-of-the-projects-own-gh-pages-same-repo-only", "uuid": "55a74975-a6e0-4f18-8254-fa27f047e829", "date": "2026-10-11", "file": "docs-stack.md", "anchor": "pr-docs-previews-deploy-to-a-subfolder-of-the-projects-own-gh-pages-same-repo-only", "remote": null}], "superseded_by": null, "body": {"text": "A generated `tools/build_docs.py` computes the version slug, enumerates the\nversion directories already on `gh-pages`, writes a generated (gitignored)\n`versions.json` for Shibuya's native switcher, builds only the current ref,\ncopies every other version directory across from `gh-pages`, writes a root\nredirect to `latest` (the highest non-prerelease by PEP 440 ordering), and\ndeploys with previews excluded from cleaning. Versioned publishing is how a\ndocs-enabled project always publishes; it is not a toggle. The version list is\nstateless: `gh-pages` is the source of truth, and local builds hide the\nswitcher because no `versions.json` exists.\n\n**Reason:** `sphinx-multiversion` (effectively unmaintained) and\n`sphinx-polyversion` both rebuild every selected tag on every deploy. This\ntemplate's `conf.py` runs subprocess generators against the live app, so\nrebuilding a historical tag re-runs that tag's generators against whatever the\nbuild resolves — fragile, slow, and it forces every past `conf.py` to keep\nbuilding forever. Litestar's build-current-preserve-rest model avoids that.\nLitestar commits and hand-edits its version list, which is untenable with\nper-minor granularity and automated releases, and having CI commit back to a\nprotected `main` adds real machinery.\n\n**Rejected alternative:** `sphinx-multiversion` or `sphinx-polyversion` — the\nrebuild model above.\n\n**Rejected alternative:** a committed `versions.json` — the hand-edit or\nCI-commit cost above.\n\n**Consequence:** `gh-pages` becomes load-bearing state; both deploy paths must\npreserve the numeric version-slug directories. An older version's switcher is\nfrozen at its build time, so the switcher appears only from the first versioned\nrelease onward.", "reason": "`sphinx-multiversion` (effectively unmaintained) and\n`sphinx-polyversion` both rebuild every selected tag on every deploy. This\ntemplate's `conf.py` runs subprocess generators against the live app, so\nrebuilding a historical tag re-runs that tag's generators against whatever the\nbuild resolves — fragile, slow, and it forces every past `conf.py` to keep\nbuilding forever. Litestar's build-current-preserve-rest model avoids that.\nLitestar commits and hand-edits its version list, which is untenable with\nper-minor granularity and automated releases, and having CI commit back to a\nprotected `main` adds real machinery.", "rejected": ["`sphinx-multiversion` or `sphinx-polyversion` — the\nrebuild model above.", "a committed `versions.json` — the hand-edit or\nCI-commit cost above."], "consequence": "`gh-pages` becomes load-bearing state; both deploy paths must\npreserve the numeric version-slug directories. An older version's switcher is\nfrozen at its build time, so the switcher appears only from the first versioned\nrelease onward.", "considered": null, "why_open": null}, "refs": ["docs-stack.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-versioning.md#version-granularity-is-a-scaffold-time-question", "uuid": "5d18c9af-73e9-476b-9ba9-544c776812e6", "file": "docs-versioning.md", "line": 45, "end_line": 65, "title": "Version granularity is a scaffold-time question", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-027 §3 (`docs/adr/027-versioned-documentation-and-last-updated-stamps.md`)", "verification": null, "revisit_when": "the pre-1.0 minor-is-breaking bump policy changes", "see": [{"locator": "docs-versioning.md#docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages", "uuid": "858025c1-19a6-46f6-a237-01ba6477262a", "date": "2026-10-11", "file": "docs-versioning.md", "anchor": "docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages", "remote": null}, {"locator": "release-automation.md#release-please-is-the-sole-release-orchestrator", "uuid": "7ec8a937-fd4d-41f2-96b7-824fe3be913b", "date": "2026-10-11", "file": "release-automation.md", "anchor": "release-please-is-the-sole-release-orchestrator", "remote": null}], "superseded_by": null, "body": {"text": "`docs_version_granularity` (asked with `include_docs`) offers `minor` (`X.Y`,\ndefault), `major` (`X`) and `full` (`X.Y.Z`). The choice bakes a slicing\nconstant into the generated build script, overridable at build time only by the\nmanual redeploy.\n\n**Reason:** granularity is the one knob adopters reasonably differ on. `minor`\nmatches the pre-1.0 posture where minors are the breaking bump; a large project\npicks `major`, an archival one `full`. Prerelease slugs survive only under\n`full` and are excluded from `latest`.", "reason": "granularity is the one knob adopters reasonably differ on. `minor`\nmatches the pre-1.0 posture where minors are the breaking bump; a large project\npicks `major`, an archival one `full`. Prerelease slugs survive only under\n`full` and are excluded from `latest`.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": ["release-automation.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-versioning.md#the-manual-redeploy-rebuilds-the-latest-published-release-never-head", "uuid": "f0ad70ba-c790-42d2-94f0-152e9527be4f", "file": "docs-versioning.md", "line": 66, "end_line": 99, "title": "The manual redeploy rebuilds the latest published release, never HEAD", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-027 §4 (`docs/adr/027-versioned-documentation-and-last-updated-stamps.md`)", "verification": null, "revisit_when": "release-please stops creating the tag before the release is published, or the build script's granularity stops being baked in", "see": [{"locator": "docs-versioning.md#docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages", "uuid": "858025c1-19a6-46f6-a237-01ba6477262a", "date": "2026-10-11", "file": "docs-versioning.md", "anchor": "docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages", "remote": null}, {"locator": "release-automation.md#the-release-is-created-as-a-draft-finalized-after-artifacts-attach", "uuid": "398b3cd9-e57b-4856-b2c7-76752c0ec37f", "date": "2026-10-11", "file": "release-automation.md", "anchor": "the-release-is-created-as-a-draft-finalized-after-artifacts-attach", "remote": null}], "superseded_by": null, "body": {"text": "`gh-pages.yml` (manual dispatch only) routes through the build script, checks\nout the tag of the latest *published* release via the releases API, sets up the\ninterpreter after that checkout, restores the build script itself from the\ndispatch ref, and passes the tag's baked granularity back through the\nenvironment.\n\n**Reason:** a naive root publish would wipe every version directory. The tag\ncomes from the API rather than `git describe` because release-please creates\nthe tag the moment the release PR merges and leaves the release a draft until\npublishing succeeds — so `git describe` would pick an unreleased version in\nexactly the window a redeploy is most likely (right after a failed release).\nThe interpreter setup follows the checkout so the tagged docs build on the\nPython the release shipped on. The script is orchestration, same layer as the\nworkflow, and an older tagged copy could carry the version-dropping bug the\nloud-fetch rule prevents; its granularity is not orchestration — which slug a\nrelease occupies is fixed at publish time — so an adopter who changed the\nanswer later must not republish a tag under a second slug and repoint `latest`.\n\n**Rejected alternative:** `git describe --tags` — selects draft tags.\n\n**Rejected alternative:** use the dispatch revision's granularity — duplicates a\nreleased version under a new slug.", "reason": "a naive root publish would wipe every version directory. The tag\ncomes from the API rather than `git describe` because release-please creates\nthe tag the moment the release PR merges and leaves the release a draft until\npublishing succeeds — so `git describe` would pick an unreleased version in\nexactly the window a redeploy is most likely (right after a failed release).\nThe interpreter setup follows the checkout so the tagged docs build on the\nPython the release shipped on. The script is orchestration, same layer as the\nworkflow, and an older tagged copy could carry the version-dropping bug the\nloud-fetch rule prevents; its granularity is not orchestration — which slug a\nrelease occupies is fixed at publish time — so an adopter who changed the\nanswer later must not republish a tag under a second slug and repoint `latest`.", "rejected": ["`git describe --tags` — selects draft tags.", "use the dispatch revision's granularity — duplicates a\nreleased version under a new slug."], "consequence": null, "considered": null, "why_open": null}, "refs": ["release-automation.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-versioning.md#a-failed-gh-pages-fetch-must-abort-never-fall-through-as-branch-absent", "uuid": "135cfbb5-6c5c-45d8-9239-cf225a819818", "file": "docs-versioning.md", "line": 100, "end_line": 123, "title": "A failed `gh-pages` fetch must abort, never fall through as \"branch absent\"", "type": ["decision", "incident"], "status": "active", "evidence": "confirmed", "source": "ADR-027 §4a (`docs/adr/027-versioned-documentation-and-last-updated-stamps.md`)", "verification": null, "revisit_when": "the deploy stops cleaning the target, or `git fetch` learns to distinguish a missing ref from a transport error", "see": [{"locator": "docs-versioning.md#docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages", "uuid": "858025c1-19a6-46f6-a237-01ba6477262a", "date": "2026-10-11", "file": "docs-versioning.md", "anchor": "docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages", "remote": null}], "superseded_by": null, "body": {"text": "Both deploy paths probe the branch with `git ls-remote --exit-code` and branch\non its exit code: 2 means no such ref, anything else aborts. One layer up, the\nbuild script's preserve step raises when a version subtree it was handed cannot\nbe read; only the `latest` alias is optional.\n\n**Reason:** the previous `fetch || echo` swallowed every failure, not only a\nmissing ref. The build script then assembled a site with no prior versions and\nthe clean deploy deleted every published version directory — one transient\ntransport error destroys the documentation archive for every prior release.\nEvery slug the preserve step receives came from a listing of that very ref, so\nit provably exists and silently omitting it is the same deletion by another\nroute.", "reason": "the previous `fetch || echo` swallowed every failure, not only a\nmissing ref. The build script then assembled a site with no prior versions and\nthe clean deploy deleted every published version directory — one transient\ntransport error destroys the documentation archive for every prior release.\nEvery slug the preserve step receives came from a listing of that very ref, so\nit provably exists and silently omitting it is the same deletion by another\nroute.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-versioning.md#per-page-last-updated-comes-from-git-history", "uuid": "7e34868f-a26a-4c89-8189-f5778ad9a04b", "file": "docs-versioning.md", "line": 124, "end_line": 143, "title": "Per-page \"last updated\" comes from git history", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-027 §5 (`docs/adr/027-versioned-documentation-and-last-updated-stamps.md`)", "verification": null, "revisit_when": "a docs job checks out with shallow history", "see": [{"locator": "docs-stack.md#sphinx-warnings-use-an-exact-reviewable-allowlist", "uuid": "2a555902-38e7-47d4-a231-445a8e6caa0f", "date": "2026-10-11", "file": "docs-stack.md", "anchor": "sphinx-warnings-use-an-exact-reviewable-allowlist", "remote": null}], "superseded_by": null, "body": {"text": "`sphinx-last-updated-by-git` is in the `docs` group; every page footer shows the\ncommit date of its source. Any untracked-source warning from the generated\nfragments goes through the warning allowlist, not blanket suppression.\n\n**Reason:** readers could not tell how fresh a page was; git history is a cheap\noffline freshness signal.\n\n**Consequence:** every docs build needs full history (`fetch-depth: 0`),\nincluding the CI job that runs the warning gate.", "reason": "readers could not tell how fresh a page was; git history is a cheap\noffline freshness signal.", "rejected": [], "consequence": "every docs build needs full history (`fetch-depth: 0`),\nincluding the CI job that runs the warning gate.", "considered": null, "why_open": null}, "refs": ["docs-stack.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-versioning.md#the-sphinx-warning-gate-runs-in-a-job-the-required-check-context-aggregates", "uuid": "bc382803-5aa9-4582-9bad-1c9efef8fc49", "file": "docs-versioning.md", "line": 144, "end_line": 164, "title": "The Sphinx warning gate runs in a job the required `check` context aggregates", "type": ["decision", "incident"], "status": "active", "evidence": "confirmed", "source": "ADR-027, Consequences (`docs/adr/027-versioned-documentation-and-last-updated-stamps.md`)", "verification": null, "revisit_when": "`docs-doctest` is renamed or leaves the `check` aggregation", "see": [{"locator": "docs-stack.md#sphinx-warnings-use-an-exact-reviewable-allowlist", "uuid": "2a555902-38e7-47d4-a231-445a8e6caa0f", "date": "2026-10-11", "file": "docs-stack.md", "anchor": "sphinx-warnings-use-an-exact-reviewable-allowlist", "remote": null}, {"locator": "ci-topology.md#per-component-markers-path-filtered-jobs-and-one-coverage-gate-per-component", "uuid": "467b6cc3-775b-4e4c-9a8e-b0d1c3d733ac", "date": "2026-10-11", "file": "ci-topology.md", "anchor": "per-component-markers-path-filtered-jobs-and-one-coverage-gate-per-component", "remote": null}], "superseded_by": null, "body": {"text": "`tox -e docs-build` (Sphinx with warnings captured plus the allowlist checker)\nruns in `ci.yml`'s `docs-doctest` job, which `check` aggregates.\n\n**Reason:** it previously ran only in the docs-preview workflow, which forks\nskip and no protected branch requires, so a PR introducing broken references\nkept every required context green. The doctest job on its own runs the doctest\nbuilder with no warnings-as-errors and no allowlist, so it never covered this.\nA gate must be checked by which context a protected branch sees, not by whether\nthe job runs.", "reason": "it previously ran only in the docs-preview workflow, which forks\nskip and no protected branch requires, so a PR introducing broken references\nkept every required context green. The doctest job on its own runs the doctest\nbuilder with no warnings-as-errors and no allowlist, so it never covered this.\nA gate must be checked by which context a protected branch sees, not by whether\nthe job runs.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": ["ci-topology.md", "docs-stack.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "external-integrations.md#a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "uuid": "392b6dcf-6e9d-441d-bf7b-64ba362578d7", "file": "external-integrations.md", "line": 3, "end_line": 28, "title": "A freshly generated project is green on first push with zero external accounts", "type": ["constraint"], "status": "active", "evidence": "confirmed", "source": "ADR-009, ADR-010, ADR-011, ADR-013, ADR-017, ADR-018, ADR-021, ADR-026, ADR-034 (`docs/adr/`)", "verification": null, "revisit_when": "the template's target audience shifts to teams that provision external services as a matter of course", "see": [], "superseded_by": null, "body": {"text": "The template's default posture: anything that needs an external service, a\nsecret, a personal access token or a per-owner repository is an opt-in toggle\ndefaulting to `false`; anything self-contained and zero-config may be always-on.\nSecret-gated jobs skip with a visible notice or warning instead of failing, and\nsuch jobs never join the `check` merge gate unless the project owner requires\nthem through branch protection.\n\n**Reason:** an integration forced on without its setup is inert or noisy — a\nSonarCloud job with no token fails, an unmaintained contributors grid rots, a\nmulti-gigabyte linter image slows every push — and most of them duplicate gates\nthe template already ships. Keeping the default fast and account-free is what\nlets a scaffold be green on its first push. This is the shared rationale the\nper-integration entries cite rather than restate.\n\n**Rejected alternative:** ship the integrations always-on because mature\nprojects use them. Rejected for the failure modes above.", "reason": "an integration forced on without its setup is inert or noisy — a\nSonarCloud job with no token fails, an unmaintained contributors grid rots, a\nmulti-gigabyte linter image slows every push — and most of them duplicate gates\nthe template already ships. Keeping the default fast and account-free is what\nlets a scaffold be green on its first push. This is the shared rationale the\nper-integration entries cite rather than restate.", "rejected": ["ship the integrations always-on because mature\nprojects use them. Rejected for the failure modes above."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "external-integrations.md#sourcery-sonarcloud-and-all-contributors-are-independent-opt-in-toggles", "uuid": "e926a0ce-c030-4a76-8b11-41c450bb43f4", "file": "external-integrations.md", "line": 29, "end_line": 66, "title": "Sourcery, SonarCloud and all-contributors are independent opt-in toggles", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-009 (`docs/adr/009-optional-external-quality-community-integrations.md`), including its 2026-07 amendment", "verification": null, "revisit_when": "one of the three services gains a provisioning-free mode, or a fourth integration of the same shape is proposed", "see": [{"locator": "external-integrations.md#a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "uuid": "392b6dcf-6e9d-441d-bf7b-64ba362578d7", "date": "2026-10-11", "file": "external-integrations.md", "anchor": "a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "remote": null}, {"locator": "standalone-executables.md#three-architecture-named-executable-toggles-instead-of-one-brand-toggle", "uuid": "d5aed1a0-0b7c-4ac3-9d75-fb9568d9e34d", "date": "2026-10-11", "file": "standalone-executables.md", "anchor": "three-architecture-named-executable-toggles-instead-of-one-brand-toggle", "remote": null}], "superseded_by": null, "body": {"text": "`include_sourcery` renders only a config file (the GitHub App does the work; no\nworkflow surface). `include_sonarcloud` adds a `sonar` CI job that runs only on\nsame-repo events and records a visible skip when `SONAR_TOKEN` is unset.\n`include_all_contributors` renders the config, a README section and a small\nworkflow that runs the all-contributors CLI (delivered through mise's npm\nbackend, Renovate-tracked) and opens a pull request with the regenerated table —\nit never pushes to the default branch, so the toggle is useful without the bot.\n\n**Reason:** all three depend on out-of-band provisioning and overlap with\ntooling already shipped (SonarCloud with Codecov, CodeQL, ruff and the type\ncheckers; Sourcery with ruff's refactor rules). Teams that already run them get\na correctly wired start instead of hand-rolling config. The amendment gave\nall-contributors a first-party path so the toggle no longer depends solely on\nan external bot.\n\n**Rejected alternative:** always-on — breaks the self-contained default.\n\n**Rejected alternative:** omit them entirely — loses the first-class starting\npoint and the discoverability of the option.\n\n**Rejected alternative:** one shared enum or parent toggle — they solve\ndifferent problems and compose freely, mirroring the independent-boolean\nprecedent of the executable toggles.\n\n**Consequence:** the all-contributors workflow needs the repository setting that\nlets Actions create pull requests, which release-please already requires.", "reason": "all three depend on out-of-band provisioning and overlap with\ntooling already shipped (SonarCloud with Codecov, CodeQL, ruff and the type\ncheckers; Sourcery with ruff's refactor rules). Teams that already run them get\na correctly wired start instead of hand-rolling config. The amendment gave\nall-contributors a first-party path so the toggle no longer depends solely on\nan external bot.", "rejected": ["always-on — breaks the self-contained default.", "omit them entirely — loses the first-class starting\npoint and the discoverability of the option.", "one shared enum or parent toggle — they solve\ndifferent problems and compose freely, mirroring the independent-boolean\nprecedent of the executable toggles."], "consequence": "the all-contributors workflow needs the repository setting that\nlets Actions create pull requests, which release-please already requires.", "considered": null, "why_open": null}, "refs": ["standalone-executables.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "external-integrations.md#opt-in-benchmarking-with-pytest-codspeed", "uuid": "841ba12d-3ad2-402e-9c7e-6791b8221952", "file": "external-integrations.md", "line": 67, "end_line": 89, "title": "Opt-in benchmarking with pytest-codspeed", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-034 (`docs/adr/034-opt-in-performance-benchmarking.md`)", "verification": null, "revisit_when": "a benchmarking service becomes usable without an account, or the default CI budget changes", "see": [{"locator": "external-integrations.md#a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "uuid": "392b6dcf-6e9d-441d-bf7b-64ba362578d7", "date": "2026-10-11", "file": "external-integrations.md", "anchor": "a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "remote": null}], "superseded_by": null, "body": {"text": "`include_benchmarks` (default off, on in the `full` preset) renders a\n`benchmarks/` starter suite, a `benchmark` pytest marker excluded from the\nordinary run, `benchmark` tox/mise entry points and a separate `benchmarks.yml`\nworkflow. The workflow is gated on `CODSPEED_TOKEN`, emits a notice when it is\nnot configured, and stays out of the `check` gate.\n\n**Reason:** correctness and coverage gates do not catch a valid change that\nmakes a hot path materially slower, but timings must not slow every project's\ndefault CI or require an account. Service setup is an explicit, reversible\nowner choice.\n\n**Alternatives:** unknown — ADR-034 records the decision and its constraints,\nno alternative that was in contention.", "reason": "correctness and coverage gates do not catch a valid change that\nmakes a hot path materially slower, but timings must not slow every project's\ndefault CI or require an account. Service setup is an explicit, reversible\nowner choice.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-12", "commit": "875a972"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "gitignore-generation.md#cobo-generates-the-gitignore-with-a-hash-sealed-fence-and-lockfiles", "uuid": "3e3bc38e-bc1e-4e65-b74d-e91848262157", "file": "gitignore-generation.md", "line": 3, "end_line": 36, "title": "cobo generates the gitignore with a hash-sealed fence and lockfiles", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-012 (`docs/adr/012-cobo-for-gitignore-generation.md`)", "verification": null, "revisit_when": "`github/gitignore` stops being the boilerplate source, or cobo changes its fence or lock format", "see": [{"locator": "ci-topology.md#network-dependent-checks-run-on-a-weekly-cron-never-in-the-merge-gate", "uuid": "3e5b9525-9087-4125-b19f-80f6c226c01f", "date": "2026-10-11", "file": "ci-topology.md", "anchor": "network-dependent-checks-run-on-a-weekly-cron-never-in-the-merge-gate", "remote": null}], "superseded_by": null, "body": {"text": "cobo fetches the same `github/gitignore` boilerplates the previous gibo\nworkflow stacked, but writes them inside a sha256-sealed fence and records the\nupstream commit and per-file blobs in `cobo.lock`. The repository root lock\ncarries two fragments — the template source and this repository's own\n`.gitignore` (dogfooding) — and `template/cobo.lock` ships verbatim so a\ngenerated project's gitignore is drift-checkable. cobo is always-included\ntooling (a mise `pipx:` tool, Renovate-tracked), with no toggle. The project's\nown overrides (the freezer spec negation, the C-extension ignore) sit below the\nend fence, where cobo preserves them; the negation still lands after the fenced\n`*.spec` ignore, so it wins.\n\n**Reason:** gibo was run by hand with no lockfile, no pin the tooling\nunderstood and no way to detect upstream drift, and the overrides were injected\ninside the boilerplate it generated.\n\n**Rejected alternative:** keep gibo — the gaps above.\n\n**Consequence:** the cobo-managed `.gitignore` is excluded from the\n`trailing-whitespace` hook, because upstream ships trailing whitespace on some\ncomment lines and trimming inside the fence breaks the seal; `cobo.lock` is\n`linguist-generated` and carries its own 2-space EditorConfig stanza (taplo's\n`*.toml` glob does not cover `.lock`). Regeneration is `cobo update` followed\nby `cobo sync`; a hand edit inside the fence breaks the sha256.", "reason": "gibo was run by hand with no lockfile, no pin the tooling\nunderstood and no way to detect upstream drift, and the overrides were injected\ninside the boilerplate it generated.", "rejected": ["keep gibo — the gaps above."], "consequence": "the cobo-managed `.gitignore` is excluded from the\n`trailing-whitespace` hook, because upstream ships trailing whitespace on some\ncomment lines and trimming inside the fence breaks the seal; `cobo.lock` is\n`linguist-generated` and carries its own 2-space EditorConfig stanza (taplo's\n`*.toml` glob does not cover `.lock`). Regeneration is `cobo update` followed\nby `cobo sync`; a hand edit inside the fence breaks the sha256.", "considered": null, "why_open": null}, "refs": ["ci-topology.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "gitignore-generation.md#the-fence-is-lf-sealed-which-corrupts-two-macos-character-class-patterns", "uuid": "a5df0a9c-aa53-4a8c-add6-566326352a0e", "file": "gitignore-generation.md", "line": 37, "end_line": 69, "title": "The fence is LF-sealed, which corrupts two macOS character-class patterns", "type": ["decision", "workaround"], "status": "active", "evidence": "confirmed", "source": "ADR-012 §1 (`docs/adr/012-cobo-for-gitignore-generation.md`); cobo#120/#121 (the upstreamed `--eol lf` policy), [cobo#124](https://github.com/hasansezertasan/cobo/issues/124), [issue #111](https://github.com/hasansezertasan/copier-pyproject/issues/111)", "verification": null, "revisit_when": "cobo#124 ships (normalize terminators only, not a mid-line CR) *and* the Copier render preserves a lone carriage return in this file", "see": [], "superseded_by": null, "body": {"text": "The fence is sealed with cobo's `--eol lf` policy, persisted as `eol = \"lf\"` on\nthe lock fragment. The macOS boilerplate encodes two filenames that end in a\ncarriage return (`Icon␍`, `.HFS+ Private Directory Data␍`) as single-line\ncharacter classes; LF normalization splits each into an unterminated `Icon[`\n(matches nothing, inert) and an orphan `]` (ignores a file literally named\n`]`). Those two patterns are knowingly broken in every generated project.\n\n**Reason:** the template enforces LF everywhere (`.gitattributes`,\nEditorConfig, ruff), `editorconfig-checker` fails on an embedded CR, and —\ndecisively — Copier renders `.gitignore.jinja` through Jinja, whose lexer\nnormalizes a lone `\\r` to `\\n` at scaffold time. A byte-exact (`preserve`) seal\nwould therefore report `locally modified` forever in every generated project.\nThere is no LF-only pattern that matches `Icon␍` precisely (`Icon?` over-matches),\nso fidelity genuinely requires the CR, and the CR cannot survive the render.\nThese are legacy HFS resource-fork artifacts modern macOS rarely creates and\nalmost never commits — an accepted tradeoff, not \"harmless\".\n\n**Rejected alternative:** seal byte-exact and keep the CR — fights the LF\ninvariant and is re-corrupted by the render anyway.\n\n**Consequence:** the cobo-level fix is necessary but not sufficient; restoring\nthe patterns additionally needs a render that preserves the CR (a raw wrap or a\nCopier newline carve-out scoped to this file).", "reason": "the template enforces LF everywhere (`.gitattributes`,\nEditorConfig, ruff), `editorconfig-checker` fails on an embedded CR, and —\ndecisively — Copier renders `.gitignore.jinja` through Jinja, whose lexer\nnormalizes a lone `\\r` to `\\n` at scaffold time. A byte-exact (`preserve`) seal\nwould therefore report `locally modified` forever in every generated project.\nThere is no LF-only pattern that matches `Icon␍` precisely (`Icon?` over-matches),\nso fidelity genuinely requires the CR, and the CR cannot survive the render.\nThese are legacy HFS resource-fork artifacts modern macOS rarely creates and\nalmost never commits — an accepted tradeoff, not \"harmless\".", "rejected": ["seal byte-exact and keep the CR — fights the LF\ninvariant and is re-corrupted by the render anyway."], "consequence": "the cobo-level fix is necessary but not sufficient; restoring\nthe patterns additionally needs a render that preserves the CR (a raw wrap or a\nCopier newline carve-out scoped to this file).", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "lint-orchestration.md#the-tox-style-env-is-the-sole-authoritative-lint-suite-prek-is-a-fast-gate-not-a-second-suite", "uuid": "9b74fc8b-a808-4f2b-bdbd-9e4253c1b35a", "file": "lint-orchestration.md", "line": 3, "end_line": 36, "title": "The tox `style` env is the sole authoritative lint suite; prek is a fast gate, not a second suite", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-003 (`docs/adr/003-tox-as-canonical-lint-runner.md`), including its 2026-06 update", "verification": null, "revisit_when": "a second orchestrator is proposed, or tool versions gain a second pinning location", "see": [], "superseded_by": null, "body": {"text": "Tool versions live in the uv-managed `style` dependency group and the tox\n`style` env runs the full lint/type-check suite from it. Git hooks are always\nincluded (the `include_precommit` toggle was removed) and run via prek as a\nfast local and CI gate; Renovate keeps both the prek `rev` pins and the `style`\ngroup current. Pants and Trunk, once default-on orchestrators of the same\nlinters, were first demoted to opt-ins and later removed entirely.\n\n**Reason:** a default project shipped three orchestrators (tox, Pants, Trunk)\npinning `ruff`, `mypy`, `actionlint` and others in three places with three\nupdate mechanisms, and the pins had already drifted — a contributor could pass\nthe local suite and fail CI on a rule that changed between two pinned versions.\nOne source of truth makes drift impossible, keeps linting on the uv/tox spine\nthe generated project already uses, and leaves one updater. The prek overlap is\ndeliberate: fast feedback while editing, authoritative coverage in tox; the\ncost is duplicate execution and at most a brief window between two Renovate\nPRs, not sustained drift.\n\n**Rejected alternative:** keep Pants and Trunk as opt-ins — the intermediate\nstate this ADR first established; its 2026-06 update dropped them outright so\nthat the tox `style` env is the sole orchestrator and nothing can drift against\nit.\n\n**Consequence:** MegaLinter, when enabled, is scoped so it cannot drift against\nthe Python toolchain (see its own entry below).", "reason": "a default project shipped three orchestrators (tox, Pants, Trunk)\npinning `ruff`, `mypy`, `actionlint` and others in three places with three\nupdate mechanisms, and the pins had already drifted — a contributor could pass\nthe local suite and fail CI on a rule that changed between two pinned versions.\nOne source of truth makes drift impossible, keeps linting on the uv/tox spine\nthe generated project already uses, and leaves one updater. The prek overlap is\ndeliberate: fast feedback while editing, authoritative coverage in tox; the\ncost is duplicate execution and at most a brief window between two Renovate\nPRs, not sustained drift.", "rejected": ["keep Pants and Trunk as opt-ins — the intermediate\nstate this ADR first established; its 2026-06 update dropped them outright so\nthat the tox `style` env is the sole orchestrator and nothing can drift against\nit."], "consequence": "MegaLinter, when enabled, is scoped so it cannot drift against\nthe Python toolchain (see its own entry below).", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-12", "commit": "875a972"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "lint-orchestration.md#taplo-checks-do-not-fetch-schemas-from-generated-toml-directives", "uuid": "152edfc1-817e-4265-ac23-53d2a730cd5f", "file": "lint-orchestration.md", "line": 37, "end_line": 65, "title": "Taplo checks do not fetch schemas from generated TOML directives", "type": ["workaround", "decision"], "status": "active", "evidence": "confirmed", "source": "[issue #337](https://github.com/hasansezertasan/copier-pyproject/issues/337), [PR #338](https://github.com/hasansezertasan/copier-pyproject/pull/338); commit [9e86cb8](https://github.com/hasansezertasan/copier-pyproject/commit/9e86cb8fcd8ccebc667d70391531c5a33ccc8de4)", "verification": "corroborated — generated root TOML omits schema directives while the style environment retains Taplo syntax and formatting checks", "revisit_when": "Taplo provides a verified way to retain editor directives without fetching their schemas during checks", "see": [{"locator": "lint-orchestration.md#semgrep-runs-in-the-style-env-against-a-named-registry-ruleset-never-vendored", "uuid": "5068081c-24ce-4c39-9cdf-13e0a7c229b4", "date": "2026-10-11", "file": "lint-orchestration.md", "anchor": "semgrep-runs-in-the-style-env-against-a-named-registry-ruleset-never-vendored", "remote": null}], "superseded_by": null, "body": {"text": "Generated root TOML no longer carries the remote schema directive. Editors can\nuse SchemaStore's filename mapping, while Taplo still checks syntax and canonical\nformatting without that schema fetch.\n\n**Reason:** a transient remote schema failure could fail the required style gate\non unchanged source. The investigation found that Taplo 0.9.3 still fetched an\nexplicit directive's URL with its no-schema flag, so the apparent offline switch\ndid not solve this failure mode.\n\n**Rejected alternative:** retain the directive and rely on the no-schema flag.\nIt was tested and rejected because the fetch still occurred. Vendoring a schema\nwas discussed with a maintenance cost, but the reviewed sources do not establish\nan explicit verdict on that alternative.\n\nThis constraint applies to the Taplo pass, not to every style tool: the semgrep\nentry below separately accepts a registry dependency.", "reason": "a transient remote schema failure could fail the required style gate\non unchanged source. The investigation found that Taplo 0.9.3 still fetched an\nexplicit directive's URL with its no-schema flag, so the apparent offline switch\ndid not solve this failure mode.", "rejected": ["retain the directive and rely on the no-schema flag.\nIt was tested and rejected because the fetch still occurred. Vendoring a schema\nwas discussed with a maintenance cost, but the reviewed sources do not establish\nan explicit verdict on that alternative."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "lint-orchestration.md#the-prek-gate-runs-at-commit-push-only-hooks-opt-in-per-hook", "uuid": "8fd817b4-fab6-4ce1-b80d-59a2ea93016f", "file": "lint-orchestration.md", "line": 66, "end_line": 85, "title": "The prek gate runs at commit; push-only hooks opt in per hook", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "found while adopting the template in openapipages; reproduced with prek 0.5.5; recorded in ADR-003 (`docs/adr/003-tox-as-canonical-lint-runner.md`)", "verification": "corroborated — a hook with no `stages` ran on `pre-commit`, `pre-push`, `commit-msg` and `manual` when `default_stages` was unset", "revisit_when": "a hook other than `commitizen-branch` needs to run on push", "see": [], "superseded_by": null, "body": {"text": "`default_stages` is `[\"pre-commit\"]`. Hooks that belong on push, such as\n`commitizen-branch`, declare `stages` themselves.\n\n**Reason:** `[\"pre-commit\", \"pre-push\"]` ran every hook without its own stages\ntwice per change, including the whole-project type checkers and pylint, and the\npush run added no coverage the commit run lacked.\n\n**Rejected alternative:** dropping `default_stages`. prek then treats every\nstage as the default, so file hooks also run on `commit-msg`.", "reason": "`[\"pre-commit\", \"pre-push\"]` ran every hook without its own stages\ntwice per change, including the whole-project type checkers and pylint, and the\npush run added no coverage the commit run lacked.", "rejected": ["dropping `default_stages`. prek then treats every\nstage as the default, so file hooks also run on `commit-msg`."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "lint-orchestration.md#five-type-checkers-strict-basedpyright-replaces-pyright", "uuid": "7e130850-494b-427c-a892-a6b3479dd047", "file": "lint-orchestration.md", "line": 86, "end_line": 117, "title": "Five type checkers; strict basedpyright replaces pyright", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-005 (`docs/adr/005-five-type-checkers-basedpyright-strict.md`)", "verification": null, "revisit_when": "`ty` churn becomes a burden, or two checkers stop catching anything the others miss", "see": [], "superseded_by": null, "body": {"text": "The `style` env invokes mypy (two Python versions), basedpyright at its full\nstrict ruleset, ty, pyrefly and zuban. pyright is dropped from the group and the\nenv. Generated code is fixed to satisfy strict rules rather than relaxing the\nchecker; the only suppressions are localized `# pyright: ignore` comments at\ngenuine library boundaries (MCP's untyped tool arguments).\n\n**Reason:** basedpyright and zuban were installed but never invoked. Wiring them\nin surfaced two latent bugs the four invoked checkers all missed — a pyright\nvenv misconfiguration that pyright tolerated silently, and an invariant-list\nassignment to Textual's `BINDINGS` that only zuban's mypy-compatible engine\nflagged. basedpyright is a strict superset of pyright, so running both was the\nmost redundant pairing in the set.\n\n**Rejected alternative:** relax the strict rules — forfeits the hardening the\nstrict bar drove into the generated code.\n\n**Rejected alternative:** keep pyright beside basedpyright — pure redundancy.\n\n**Consequence:** TUI projects gain `typing_extensions` for `@override` on\n3.10/3.11; `ty` is pre-release and kept because it currently passes and adds\ncoverage. An earlier zuban miscategorized one finding and forced broadening a\nmypy disable list; zuban 0.9.0 fixed it and the concession was removed.", "reason": "basedpyright and zuban were installed but never invoked. Wiring them\nin surfaced two latent bugs the four invoked checkers all missed — a pyright\nvenv misconfiguration that pyright tolerated silently, and an invariant-list\nassignment to Textual's `BINDINGS` that only zuban's mypy-compatible engine\nflagged. basedpyright is a strict superset of pyright, so running both was the\nmost redundant pairing in the set.", "rejected": ["relax the strict rules — forfeits the hardening the\nstrict bar drove into the generated code.", "keep pyright beside basedpyright — pure redundancy."], "consequence": "TUI projects gain `typing_extensions` for `@override` on\n3.10/3.11; `ty` is pre-release and kept because it currently passes and adds\ncoverage. An earlier zuban miscategorized one finding and forced broadening a\nmypy disable list; zuban 0.9.0 fixed it and the concession was removed.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "lint-orchestration.md#mypy-s-prek-hook-runs-through-uv-like-basedpyright", "uuid": "71f826cd-950d-4112-9cfb-7dad6ee98264", "file": "lint-orchestration.md", "line": 118, "end_line": 142, "title": "mypy's prek hook runs through uv, like basedpyright", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": " s the project's environment, the `style`\npin, and `[tool.mypy] files`, the same as tox.", "rejected": ["keep mirrors-mypy and add a test that its\n`additional_dependencies` match the runtime deps. That guards one of the three\ndrifts and keeps the duplicate version pin."], "consequence": null, "considered": null, "why_open": null}, "refs": ["architecture-contracts.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "lint-orchestration.md#megalinter-is-an-opt-in-lean-complement-non-blocking-on-three-levels", "uuid": "f3041701-610f-4418-b297-e9707da5de40", "file": "lint-orchestration.md", "line": 143, "end_line": 181, "title": "MegaLinter is an opt-in lean complement, non-blocking on three levels", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-013 (`docs/adr/013-megalinter-opt-in-lean-complement.md`); prompted by a real run ([hwid#90](https://github.com/hasansezertasan/hwid/actions/runs/30634574244/job/91168813067))", "verification": null, "revisit_when": "prek gains one of the five enabled linters, the `cupcake` flavor drops one, or GitHub changes SARIF ingestion rules", "see": [{"locator": "external-integrations.md#a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "uuid": "392b6dcf-6e9d-441d-bf7b-64ba362578d7", "date": "2026-10-11", "file": "external-integrations.md", "anchor": "a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "remote": null}, {"locator": "lint-orchestration.md#the-tox-style-env-is-the-sole-authoritative-lint-suite-prek-is-a-fast-gate-not-a-second-suite", "uuid": "9b74fc8b-a808-4f2b-bdbd-9e4253c1b35a", "date": "2026-10-11", "file": "lint-orchestration.md", "anchor": "the-tox-style-env-is-the-sole-authoritative-lint-suite-prek-is-a-fast-gate-not-a-second-suite", "remote": null}], "superseded_by": null, "body": {"text": "`include_megalinter` (default off) renders the workflow and config. Enabled\nlinters are only the gaps prek and tox leave: shellcheck for standalone\nscripts, hadolint (gated on `include_web`, the only config that renders a\nDockerfile), jsonlint, copy-paste detection, and cspell scoped to Markdown as a\ndeeper dictionary pass beside prek's fast `typos`. It uses the smaller\n`cupcake` flavor image, no paths filter, exits 0 (`DISABLE_ERRORS`), posts no\ncommit status, and is not in the `check` gate; findings reach the Security tab\nthrough a best-effort SARIF upload of the single aggregate report.\n\n**Reason:** the always-on predecessor was documented nowhere, pulled an ~8 GB\nimage on every push (165 s of a 3-minute run was the pull), and five of its six\nlinters re-ran checks prek already performed. Unlike the external-service\nintegrations it needs no account, so it earned its own decision. A paths filter\nwas tried and dropped: copy-paste detection scans source, so the filter fired on\nnearly every PR anyway and only confused. Pointing the SARIF upload at the\nreports directory was rejected because GitHub rejects a file whose runs share a\ntool and category; the aggregate's per-linter runs carry distinct tool names.\n\n**Rejected alternative:** always-on — the posture above.\n\n**Rejected alternative:** drop cspell entirely — an earlier revision did; it was\nreinstated, scoped, during review.\n\n**Consequence:** the best-effort upload fails silently, so the SARIF path is\nverified against a live public repository via the code-scanning API, not by\nrendering, after any change to that step or a major bump. A project wanting\nMegaLinter to gate requires its code-scanning results via branch protection.", "reason": "the always-on predecessor was documented nowhere, pulled an ~8 GB\nimage on every push (165 s of a 3-minute run was the pull), and five of its six\nlinters re-ran checks prek already performed. Unlike the external-service\nintegrations it needs no account, so it earned its own decision. A paths filter\nwas tried and dropped: copy-paste detection scans source, so the filter fired on\nnearly every PR anyway and only confused. Pointing the SARIF upload at the\nreports directory was rejected because GitHub rejects a file whose runs share a\ntool and category; the aggregate's per-linter runs carry distinct tool names.", "rejected": ["always-on — the posture above.", "drop cspell entirely — an earlier revision did; it was\nreinstated, scoped, during review."], "consequence": "the best-effort upload fails silently, so the SARIF path is\nverified against a live public repository via the code-scanning API, not by\nrendering, after any change to that step or a major bump. A project wanting\nMegaLinter to gate requires its code-scanning results via branch protection.", "considered": null, "why_open": null}, "refs": ["external-integrations.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": [{"severity": "warning", "code": "W301", "line": 149, "message": "base64-looking blob (65 chars) — if it needs decoding to be read, it doesn't belong in an entry meant to be read"}]}, {"id": "lint-orchestration.md#semgrep-runs-in-the-style-env-against-a-named-registry-ruleset-never-vendored", "uuid": "5068081c-24ce-4c39-9cdf-13e0a7c229b4", "file": "lint-orchestration.md", "line": 182, "end_line": 217, "title": "semgrep runs in the `style` env against a named registry ruleset, never vendored", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "ADR-032 (`docs/adr/032-semgrep-sast-in-the-style-env.md`); [issue #174](https://github.com/hasansezertasan/copier-pyproject/issues/174)", "verification": null, "revisit_when": "offline determinism outranks rule quality, semgrep gains an on-disk rule cache, or the registry rules' license permits redistribution", "see": [{"locator": "lint-orchestration.md#the-tox-style-env-is-the-sole-authoritative-lint-suite-prek-is-a-fast-gate-not-a-second-suite", "uuid": "9b74fc8b-a808-4f2b-bdbd-9e4253c1b35a", "date": "2026-10-11", "file": "lint-orchestration.md", "anchor": "the-tox-style-env-is-the-sole-authoritative-lint-suite-prek-is-a-fast-gate-not-a-second-suite", "remote": null}], "superseded_by": null, "body": {"text": "semgrep is pinned in its own `sast` dependency group, runs only in the tox\n`style` env over `src` with the `p/python` registry pack, findings blocking and\ntelemetry off. It is not a prek hook, not in `check-security.yml`, and no\nruleset is committed.\n\n**Reason:** the registry rules carry the Semgrep Rules License, which forbids\ndistribution — a Copier template exists to distribute files, so vendoring them\nis exactly the prohibited act. semgrep keeps no on-disk rule cache, so a prek\nhook would hit the registry on every commit and fail offline; the style-env-only\nplacement follows the `ty`/`pyrefly`/`zuban` precedent. The dedicated group\nexists because `dev` includes `style` wholesale and the wheel is ~215 MB with a\nnative core; only the Linux style job should pay that. `--config auto` was\navoided so rule selection is reproducible.\n\n**Rejected alternative:** hand-authored rules — legal and offline, but a\nhand-maintained taint database catching less than the relevant community rules.\n\n**Rejected alternative:** a `uvx semgrep` job in `check-security.yml` — pure\nduplication once semgrep is in `style`, with an unpinned version Renovate did\nnot track.\n\n**Consequence:** not hermetic — a new community rule or a registry outage can\nredden an unrelated PR; findings overlap ruff's bandit rules, so a line may need\nboth suppressions. The marginal value is cross-statement taint rules ruff\ncannot express.", "reason": "the registry rules carry the Semgrep Rules License, which forbids\ndistribution — a Copier template exists to distribute files, so vendoring them\nis exactly the prohibited act. semgrep keeps no on-disk rule cache, so a prek\nhook would hit the registry on every commit and fail offline; the style-env-only\nplacement follows the `ty`/`pyrefly`/`zuban` precedent. The dedicated group\nexists because `dev` includes `style` wholesale and the wheel is ~215 MB with a\nnative core; only the Linux style job should pay that. `--config auto` was\navoided so rule selection is reproducible.", "rejected": ["hand-authored rules — legal and offline, but a\nhand-maintained taint database catching less than the relevant community rules.", "a `uvx semgrep` job in `check-security.yml` — pure\nduplication once semgrep is in `style`, with an unpinned version Renovate did\nnot track."], "consequence": "not hermetic — a new community rule or a registry outage can\nredden an unrelated PR; findings overlap ruff's bandit rules, so a line may need\nboth suppressions. The marginal value is cross-statement taint rules ruff\ncannot express.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "package-distribution.md#homebrew-and-scoop-are-opt-in-dispatches-the-tap-or-bucket-owns-the-manifest-logic", "uuid": "462ac46c-c9db-4a4a-b8ae-bbe5c14af09f", "file": "package-distribution.md", "line": 3, "end_line": 46, "title": "Homebrew and Scoop are opt-in dispatches; the tap or bucket owns the manifest logic", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-017 (`docs/adr/017-opt-in-homebrew-scoop-distribution.md`); the live reference is the keycast tap and bucket repositories", "verification": null, "revisit_when": "the release build matrix becomes per-architecture, or an ecosystem's own bump tooling changes shape", "see": [{"locator": "external-integrations.md#a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "uuid": "392b6dcf-6e9d-441d-bf7b-64ba362578d7", "date": "2026-10-11", "file": "external-integrations.md", "anchor": "a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "remote": null}, {"locator": "package-distribution.md#optional-pypi-publishing", "uuid": "20be7463-ca95-4d01-82c9-71f632d1b4be", "date": "2026-10-11", "file": "package-distribution.md", "anchor": "optional-pypi-publishing", "remote": null}], "superseded_by": null, "body": {"text": "`include_homebrew` and `include_scoop` are independent toggles, off by default\nand asked only when the project can distribute natively. When enabled,\n`release.yml` gains `bump-homebrew`/`bump-scoop` jobs that fire a\n`repository_dispatch` at the owner's `homebrew-tap`/`scoop-bucket` repository\nwith only the package name and version. A listener workflow living in the tap\nor bucket does the manifest work with each ecosystem's own tooling; the\ngenerated project ships a reference listener and setup guide under\n`docs/packaging/` as a copy-into-your-tap bundle, not code it runs. The jobs\nare gated on a fine-grained PAT with Contents-write on the target repository\nonly, skip with a visible warning when the secret is unset, run with no\nworkflow permissions of their own, and never join the `check` gate.\n\n**Reason:** generating a formula, cask or manifest in every producing project\nduplicates sha256 computation, PyPI resource resolution, per-OS asset matching\nand each ecosystem's audit rules — and their bugs — once per generated project.\nDispatching keeps that logic in one downstream place, written with the tools\nthe ecosystems maintain for exactly this job. The jobs live in `release.yml`\nbecause a release event fired by the workflow token cannot trigger another\nworkflow. The listener opens its own PR with its own token, so the PAT needs no\npull-request scope.\n\n**Rejected alternative:** render and push the formula/manifest from the\ngenerated project — the original design of this record, replaced for the\nduplication above.\n\n**Rejected alternative:** one shared enum or parent toggle — an owner may want\none ecosystem only.\n\n**Consequence:** binaries are single-architecture per OS; the Scoop PyPI\nfallback is best-effort because Scoop's tooling assumes binary downloads; the\nlistener is not validated by this template's tests; payload validation is the\nlistener's job.", "reason": "generating a formula, cask or manifest in every producing project\nduplicates sha256 computation, PyPI resource resolution, per-OS asset matching\nand each ecosystem's audit rules — and their bugs — once per generated project.\nDispatching keeps that logic in one downstream place, written with the tools\nthe ecosystems maintain for exactly this job. The jobs live in `release.yml`\nbecause a release event fired by the workflow token cannot trigger another\nworkflow. The listener opens its own PR with its own token, so the PAT needs no\npull-request scope.", "rejected": ["render and push the formula/manifest from the\ngenerated project — the original design of this record, replaced for the\nduplication above.", "one shared enum or parent toggle — an owner may want\none ecosystem only."], "consequence": "binaries are single-architecture per OS; the Scoop PyPI\nfallback is best-effort because Scoop's tooling assumes binary downloads; the\nlistener is not validated by this template's tests; payload validation is the\nlistener's job.", "considered": null, "why_open": nul
