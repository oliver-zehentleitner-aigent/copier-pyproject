ve the ordering per template — the drift\n`primary_component` already exists to prevent.", "reason": "PyInstaller and Nuitka produce fully self-contained binaries; the\nPyCrucible launcher still needs the network on first run, so it is the fallback\nof last resort. One computed variable mirrors the role `primary_component`\nplays for console-script precedence: no template re-spells the ordering\ninline.", "rejected": ["re-derive the ordering per template — the drift\n`primary_component` already exists to prevent."], "consequence": null, "considered": null, "why_open": null}, "refs": ["standalone-executables.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "package-distribution.md#optional-pypi-publishing", "uuid": "20be7463-ca95-4d01-82c9-71f632d1b4be", "file": "package-distribution.md", "line": 71, "end_line": 128, "title": "Optional PyPI publishing", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "[issue #382](https://github.com/hasansezertasan/copier-pyproject/issues/382); maintainer decisions while implementing it, 2026-10-11; ADR-039 (`docs/adr/039-optional-pypi-publishing.md`)", "verification": null, "revisit_when": "the PyPI project name becomes its own question, or Homebrew / Scoop gain a non-PyPI source for a pure-Python package", "see": [{"locator": "release-automation.md#the-workflow_dispatch-trigger-on-releaseyml-stays-the-publish-environment-is-the-containment", "uuid": "0d93a35d-46a3-4ac6-b072-fc07da789842", "date": "2026-10-11", "file": "release-automation.md", "anchor": "the-workflow_dispatch-trigger-on-releaseyml-stays-the-publish-environment-is-the-containment", "remote": null}], "superseded_by": null, "body": {"text": "`include_pypi_publish` is a boolean toggle, seeded **on** by every preset, so\nexisting projects and `copier update` keep publishing. When it is off:\n\n- `release.yml` does not render `pypi-publish`, and drops it from the `needs`\n  of `attach-github-release` and `finalize-release`. `build` still produces and\n  attests the wheel and sdist, and `attach-github-release` still uploads them,\n  so every release keeps its distributions.\n- `build` keeps the `publish` environment. It mints build-provenance\n  attestations there, and the environment's main-only deployment-branch policy\n  is what stops a `workflow_dispatch` run from another branch. So the setup\n  guide drops only the PyPI publisher registration. The \"Restrict the `publish`\n  environment to `main`\" step stays.\n- The README and `installation.rst` install from\n  `git+https://github.com/<user>/<repo>` (`uv tool install`, `uvx --from`,\n  `uv add`, `pip install`) and say the release assets carry the wheel and sdist.\n  The README PyPI badges and its PyPI-based Analysis links are dropped. The\n  PyPI publication-attestation text in `installation.rst` is dropped too, along\n  with PyPI mentions in `CONTRIBUTING.md`, the `repo-setup` skill and the\n  after-copy message.\n\n**Homebrew and Scoop.** A Homebrew formula is built from the PyPI sdist, and\nthe Scoop pipx manifest polls PyPI. Only a prebuilt executable (a cask or binary\nmanifest) is fetched from the GitHub Release. A hidden `can_distribute_natively`\n(`is_app` and either PyPI publishing or a `primary_executable`) therefore gates\n`include_homebrew` and `include_scoop`. Without it they are not asked, and their\n`default` repeats the guard, so a preset cannot turn on a tap or bucket that\ncould never update.\n\n**Rejected alternative:** leave Homebrew/Scoop ungated and document the caveat.\nRejected: it renders a tap/bucket dispatch whose formula or manifest can never\nresolve, which is a failure on first release that the template can prevent at\nquestion time.\n\n**Rejected alternative:** point the install docs at a GitHub Release wheel\ndownload. Rejected in favor of Git URL installs, which work with every installer\nthe docs already show, can be pinned with `@<tag>`, and work over SSH for\nprivate repositories.\n\n**Rejected alternative:** make the PyPI project name its own question in this\nchange. Deferred as a separate concern: it decouples the distribution name from\nthe package name, which touches far more than the publish job.\n\n**Consequence:** a project can release without PyPI, and that choice survives\n`copier update`. An explicit `--data include_homebrew=true` still renders the\ntap even when the question is gated off — Copier applies passed data to an\nunasked question, the existing contract of the `is_app` gate too. The\ntemplate-ci `litestar-kafka` scenario renders with PyPI off so actionlint checks\nthe web variant of `finalize-release`'s `needs` without `pypi-publish`.", "reason": null, "rejected": ["leave Homebrew/Scoop ungated and document the caveat.\nRejected: it renders a tap/bucket dispatch whose formula or manifest can never\nresolve, which is a failure on first release that the template can prevent at\nquestion time.", "point the install docs at a GitHub Release wheel\ndownload. Rejected in favor of Git URL installs, which work with every installer\nthe docs already show, can be pinned with `@<tag>`, and work over SSH for\nprivate repositories.", "make the PyPI project name its own question in this\nchange. Deferred as a separate concern: it decouples the distribution name from\nthe package name, which touches far more than the publish job."], "consequence": "a project can release without PyPI, and that choice survives\n`copier update`. An explicit `--data include_homebrew=true` still renders the\ntap even when the question is gated off — Copier applies passed data to an\nunasked question, the existing contract of the `is_app` gate too. The\ntemplate-ci `litestar-kafka` s le becomes stable.\nIt stays because the identity fields have no defaults and giving them defaults\nwould be a footgun — a bare `--defaults` run would emit a project literally\nnamed `example` owned by `octocat` — while non-interactive generation (the\nexample task, the CI render job) still needs a data source. The render harness\nis unaffected; it supplies its own identity dictionary through Copier's API.\n\n**Rejected alternative:** remove the file and give the identity questions\ndefaults — the footgun above.", "reason": "removing the toggle list deletes the recurring maintenance step\n\"update the example input when a toggle is added\", so the file becomes stable.\nIt stays because the identity fields have no defaults and giving them defaults\nwould be a footgun — a bare `--defaults` run would emit a project literally\nnamed `example` owned by `octocat` — while non-interactive generation (the\nexample task, the CI render job) still needs a data source. The render harness\nis unaffected; it supplies its own identity dictionary through Copier's API.", "rejected": ["remove the file and give the identity questions\ndefaults — the footgun above."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "release-automation.md#release-please-is-the-sole-release-orchestrator", "uuid": "7ec8a937-fd4d-41f2-96b7-824fe3be913b", "file": "release-automation.md", "line": 3, "end_line": 47, "title": "release-please is the sole release orchestrator", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-002 (`docs/adr/002-release-please-for-release-automation.md`); validated against the keycast release pipeline ([keycast#11](https://github.com/hasansezertasan/keycast/pull/11))", "verification": null, "revisit_when": "the open re-evaluation below is decided, or the generated project's version stops being sourced from git tags", "see": [{"locator": "release-automation.md#the-release-automation-choice-is-under-re-evaluation", "uuid": "d9131d49-3c27-48f8-a903-e97caf4acff6", "date": "2026-10-11", "file": "release-automation.md", "anchor": "the-release-automation-choice-is-under-re-evaluation", "remote": null}, {"locator": "package-distribution.md#optional-pypi-publishing", "uuid": "20be7463-ca95-4d01-82c9-71f632d1b4be", "date": "2026-10-12", "file": "package-distribution.md", "anchor": "optional-pypi-publishing", "remote": null}], "superseded_by": null, "body": {"text": "Every generated project ships an unconditional release-please pipeline in one\nunified `release.yml`: Conventional Commits on `main` open a release PR, its\nmerge cuts the tag and release, and every downstream job (build, PyPI — optional\nsince ADR-039 —, executables, Docker, docs, SBOM, notifications) gates on its\noutputs. The\nformer `release_automation` choice (`none`, release-please, release-it,\nrelease-drafter) and the separate `cd.yml` are gone. Versioning is sourced from\ngit tags through hatch-vcs, so release-please never edits a version literal and\n`uv.lock` cannot desync; `bump-minor-pre-major` keeps pre-1.0 projects pre-1.0.\n\n**Reason:** offering three tools multiplied the integration surface for a\nfeature each project configures once. release-please is Python-native, derives\nthe version from commits the template already enforces, and produces a\nreviewable release PR before any tag exists. Two of the three hard-won keycast\nfixes were already in the template, so it was the option with the most\nevidence.\n\n**Rejected alternative:** release-it — JS-oriented, needs a Node runtime, and a\nhuman picks the bump every time.\n\n**Rejected alternative:** release-drafter — label-driven, writes release notes\nbut no `CHANGELOG.md`.\n\n**Rejected alternative:** keeping a `none` escape hatch — projects that want no\nautomation delete the files after generation; accepted for a template whose\naudience publishes releases.\n\n**Consequence:** the PyPI trusted publisher must register `release.yml` as the\nworkflow. Rendering plus actionlint validate the workflow across option\ncombinations, but draft-tag timing, OIDC publishing and reconciliation can only\nbe exercised by a live release. The template has no `CHANGELOG.md` seed file:\nrelease-please owns the changelog, and a scaffold-time seed would wipe an\nadopting project's release history on update.", "reason": "offering three tools multiplied the integration surface for a\nfeature each project configures once. release-please is Python-native, derives\nthe version from commits the template already enforces, and produces a\nreviewable release PR before any tag exists. Two of the three hard-won keycast\nfixes were already in the template, so it was the option with the most\nevidence.", "rejected": ["release-it — JS-oriented, needs a Node runtime, and a\nhuman picks the bump every time.", "release-drafter — label-driven, writes release notes\nbut no `CHANGELOG.md`.", "keeping a `none` escape hatch — projects that want no\nautomation delete the files after generation; accepted for a template whose\naudience publishes releases."], "consequence": "the PyPI trusted publisher must register `release.yml` as the\nworkflow. Rendering plus actionlint validate the workflow across option\ncombinations, but draft-tag timing, OIDC publishing and reconciliation can only\nbe exercised by a live release. The template has no `CHANGELOG.md` seed file:\nrelease-please owns the changelog, and a scaffold-time seed would wipe an\nadopting project's release history on update.", "considered": null, "why_open": null}, "refs": ["package-distribution.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-12", "commit": "875a972"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "release-automation.md#the-release-is-created-as-a-draft-finalized-after-artifacts-attach", "uuid": "398b3cd9-e57b-4856-b2c7-76752c0ec37f", "file": "release-automation.md", "line": 48, "end_line": 76, "title": "The release is created as a draft, finalized after artifacts attach", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-002 (`docs/adr/002-release-please-for-release-automation.md`); the wrong-version bug caught in [cobo#49](https://github.com/hasansezertasan/cobo/pull/49)", "verification": null, "revisit_when": "release-please creates releases after artifact upload natively, or computes its commit range from drafts", "see": [{"locator": "release-automation.md#release-please-is-the-sole-release-orchestrator", "uuid": "7ec8a937-fd4d-41f2-96b7-824fe3be913b", "date": "2026-10-11", "file": "release-automation.md", "anchor": "release-please-is-the-sole-release-orchestrator", "remote": null}], "superseded_by": null, "body": {"text": "release-please creates the GitHub release with `draft: true` and\n`force-tag-creation: true`. Build jobs attach wheels, executables and the SBOM\nto the draft; `finalize-release` un-drafts it and then closes the phantom\nnext-release PR and re-dispatches the workflow, bounded.\n\n**Reason:** a public release must never exist without its artifacts, so the\nrelease stays a draft until they are attached. GitHub withholds a draft's git\ntag until publication, so without forced tag creation the build job would run\nbefore the tag exists and hatch-vcs would stamp the previous version. The\nphantom PR exists because release-please computes its commit range from the\nlatest *published* release and ignores drafts.\n\n**Rejected alternative:** `draft: false` — a window with a public release and no\nartifacts.\n\n**Consequence:** docs deployment lives in the same workflow (`deploy-docs`,\nafter finalization) because an event fired by `finalize-release`'s token cannot\ntrigger a separate workflow.", "reason": "a public release must never exist without its artifacts, so the\nrelease stays a draft until they are attached. GitHub withholds a draft's git\ntag until publication, so without forced tag creation the build job would run\nbefore the tag exists and hatch-vcs would stamp the previous version. The\nphantom PR exists because release-please computes its commit range from the\nlatest *published* release and ignores drafts.", "rejected": ["`draft: false` — a window with a public release and no\nartifacts."], "consequence": "docs deployment lives in the same workflow (`deploy-docs`,\nafter finalization) because an event fired by `finalize-release`'s token cannot\ntrigger a separate workflow.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "release-automation.md#the-workflow-dispatch-trigger-on-release-yml-stays-the-publish-environment-is-the-containment", "uuid": "0d93a35d-46a3-4ac6-b072-fc07da789842", "file": "release-automation.md", "line": 77, "end_line": 103, "title": "The `workflow_dispatch` trigger on `release.yml` stays; the `publish` environment is the containment", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "ADR-002 (`docs/adr/002-release-please-for-release-automation.md`)", "verification": null, "revisit_when": "the GitHub API for re-running a workflow stops requiring the dispatch trigger, or environment deployment-branch policies change", "see": [{"locator": "release-automation.md#the-release-is-created-as-a-draft-finalized-after-artifacts-attach", "uuid": "398b3cd9-e57b-4856-b2c7-76752c0ec37f", "date": "2026-10-11", "file": "release-automation.md", "anchor": "the-release-is-created-as-a-draft-finalized-after-artifacts-attach", "remote": null}, {"locator": "supply-chain-security.md#provenance-minting-shares-the-protected-publication-boundary", "uuid": "a0396603-cb34-4151-9d5b-1fc77eb31f6e", "date": "2026-10-11", "file": "supply-chain-security.md", "anchor": "provenance-minting-shares-the-protected-publication-boundary", "remote": null}], "superseded_by": null, "body": {"text": "`release.yml` keeps `workflow_dispatch`. The publish jobs run in a `publish`\nenvironment whose deployment-branch policy is limited to `main`; the generated\nsetup guide ships that policy as a scriptable step with a check, because GitHub\nauto-creates the environment unprotected on first use.\n\n**Reason:** the trigger looks like a publish-escalation surface — a manual run\nexecutes the workflow file from the selected branch, so the `release_created`\nguard cannot stop someone with write access from dispatching a guard-free copy\nand minting a trusted-publishing token. But `finalize-release`'s reconciliation\nre-dispatches the workflow through the API, which requires the trigger.\nGitHub evaluates an environment's branch policy outside the workflow file, so\nthe environment contains what the trigger exposes.\n\n**Rejected alternative:** remove the trigger — breaks release-PR reconciliation.", "reason": "the trigger looks like a publish-escalation surface — a manual run\nexecutes the workflow file from the selected branch, so the `release_created`\nguard cannot stop someone with write access from dispatching a guard-free copy\nand minting a trusted-publishing token. But `finalize-release`'s reconciliation\nre-dispatches the workflow through the API, which requires the trigger.\nGitHub evaluates an environment's branch policy outside the workflow file, so\nthe environment contains what the trigger exposes.", "rejected": ["remove the trigger — breaks release-PR reconciliation."], "consequence": null, "considered": null, "why_open": null}, "refs": ["supply-chain-security.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "release-automation.md#release-workflows-use-github-token-with-two-documented-manual-workarounds", "uuid": "bc96b93e-9b9e-4496-8fbb-b215f1d9a04c", "file": "release-automation.md", "line": 104, "end_line": 130, "title": "Release workflows use `GITHUB_TOKEN`, with two documented manual workarounds", "type": ["decision", "workaround"], "status": "active", "evidence": "confirmed", "source": "ADR-002 (`docs/adr/002-release-please-for-release-automation.md`); [issue #332](https://github.com/hasansezertasan/copier-pyproject/issues/332)", "verification": null, "revisit_when": "GitHub lets the workflow token start workflow runs or grants it workflow write access", "see": [{"locator": "release-automation.md#release-please-is-the-sole-release-orchestrator", "uuid": "7ec8a937-fd4d-41f2-96b7-824fe3be913b", "date": "2026-10-11", "file": "release-automation.md", "anchor": "release-please-is-the-sole-release-orchestrator", "remote": null}], "superseded_by": null, "body": {"text": "Release-please runs with the implicit `GITHUB_TOKEN`. Two consequences are\nhandled procedurally in the generated setup guide rather than with a stronger\ncredential: the release PR reports no required status contexts until a human\ncloses and reopens it, and a merge that changes workflow files between the\nrelease PR merging and the release run finishing must wait, because the\nrelease API then refuses tag creation with a 403.\n\n**Reason:** events created with the workflow token do not start workflow runs,\nand the token cannot be granted workflow write access. A PAT or App token would\nfix both but is a standing credential with write access to `main`; closing and\nreopening the PR (every required context listens for `reopened`) and pausing\nworkflow merges are the cheaper side of that trade. Editing the PR body is not\nequivalent — two of the checks do not listen for `edited`.\n\n**Rejected alternative:** a PAT or GitHub App token for release-please.", "reason": "events created with the workflow token do not start workflow runs,\nand the token cannot be granted workflow write access. A PAT or App token would\nfix both but is a standing credential with write access to `main`; closing and\nreopening the PR (every required context listens for `reopened`) and pausing\nworkflow merges are the cheaper side of that trade. Editing the PR body is not\nequivalent — two of the checks do not listen for `edited`.", "rejected": ["a PAT or GitHub App token for release-please."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "release-automation.md#the-stale-draft-release-comment-link-is-an-accepted-cosmetic-defect", "uuid": "2c6a6034-1936-4026-b10a-93445ace87b1", "file": "release-automation.md", "line": 131, "end_line": 152, "title": "The stale draft-release comment link is an accepted cosmetic defect", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-002 (`docs/adr/002-release-please-for-release-automation.md`); [issue #143](https://github.com/hasansezertasan/copier-pyproject/issues/143), [PR #152](https://github.com/hasansezertasan/copier-pyproject/pull/152)", "verification": null, "revisit_when": "release-please rewrites its release comment after un-drafting, or the draft flow is replaced", "see": [{"locator": "release-automation.md#the-release-is-created-as-a-draft-finalized-after-artifacts-attach", "uuid": "398b3cd9-e57b-4856-b2c7-76752c0ec37f", "date": "2026-10-11", "file": "release-automation.md", "anchor": "the-release-is-created-as-a-draft-finalized-after-artifacts-attach", "remote": null}], "superseded_by": null, "body": {"text": "release-please posts its \"created releases\" comment once, at draft-creation\ntime, with the transient `untagged-<hash>` slug; after finalization that link\n404s. It is left as is.\n\n**Reason:** the release, tag, artifacts and SBOM are all correct; only a link on\nan already-merged PR is dead. `draft: false` would repair the link but\nreintroduce the no-artifacts window, and having `finalize-release` patch the\ncomment adds API surface for no functional gain.\n\n**Rejected alternative:** patch the comment in `finalize-release` — still\navailable without switching tools, listed as an option in the re-evaluation.", "reason": "the release, tag, artifacts and SBOM are all correct; only a link on\nan already-merged PR is dead. `draft: false` would repair the link but\nreintroduce the no-artifacts window, and having `finalize-release` patch the\ncomment adds API surface for no functional gain.", "rejected": ["patch the comment in `finalize-release` — still\navailable without switching tools, listed as an option in the re-evaluation."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "release-automation.md#commitizen-is-a-commit-helper-never-a-release-tool", "uuid": "ee1d2fad-67ab-4f4a-a531-73458da14eb1", "file": "release-automation.md", "line": 153, "end_line": 182, "title": "Commitizen is a commit helper, never a release tool", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-004 (`docs/adr/004-commitizen-as-commit-helper-not-release-tool.md`)", "verification": null, "revisit_when": "the re-evaluation below selects a Commitizen-based orchestrator", "see": [{"locator": "release-automation.md#release-please-is-the-sole-release-orchestrator", "uuid": "7ec8a937-fd4d-41f2-96b7-824fe3be913b", "date": "2026-10-11", "file": "release-automation.md", "anchor": "release-please-is-the-sole-release-orchestrator", "remote": null}], "superseded_by": null, "body": {"text": "The generated `[tool.commitizen]` block contains only the convention name. The\nrelease-coupled keys (tag format, version provider and scheme,\n`major_version_zero`, changelog-on-bump) were removed, so `cz bump` has no\nconfigured tagging or changelog behaviour. The commit-message hooks stay;\nCommitizen is always included (the `include_commitizen` toggle was dropped\nbecause its hooks were unconditional anyway).\n\n**Reason:** as shipped, Commitizen was configured as a second complete release\npipeline that tags the same releases and rewrites the same `CHANGELOG.md` as\nrelease-please — a direct conflict the first release decision never compared.\nVersioning, tagging and changelog get exactly one owner; Commitizen keeps the\northogonal half, helping to write and lint conforming commits.\n\n**Rejected alternative:** keep both configured as \"aligned\" — competing tags\nand two changelog writers on one file.\n\n**Consequence:** message linting overlaps the PR-title check under the required\nsquash-by-title merge strategy; accepted because the hook gives feedback while\nauthoring, before a PR exists.", "reason": "as shipped, Commitizen was configured as a second complete release\npipeline that tags the same releases and rewrites the same `CHANGELOG.md` as\nrelease-please — a direct conflict the first release decision never compared.\nVersioning, tagging and changelog get exactly one owner; Commitizen keeps the\northogonal half, helping to write and lint conforming commits.", "rejected": ["keep both configured as \"aligned\" — competing tags\nand two changelog writers on one file."], "consequence": "message linting overlaps the PR-title check under the required\nsquash-by-title merge strategy; accepted because the hook gives feedback while\nauthoring, before a PR exists.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "release-automation.md#the-release-automation-choice-is-under-re-evaluation", "uuid": "d9131d49-3c27-48f8-a903-e97caf4acff6", "file": "release-automation.md", "line": 183, "end_line": 212, "title": "The release-automation choice is under re-evaluation", "type": ["decision"], "status": "open", "evidence": "confirmed", "source": "ADR-037 (`docs/adr/037-release-automation-reevaluation.md`), a research record last refreshed 2026-10-05; upstream release-please issues [#2515](https://github.com/googleapis/release-please/issues/2515) and [#2605](https://github.com/googleapis/release-please/issues/2605)", "verification": null, "revisit_when": "git-cliff ships prerelease version calculation ([#1380](https://github.com/orhun/git-cliff/issues/1380)), RC series become frequent, or a maintainer picks one of the four options", "see": [{"locator": "release-automation.md#release-please-is-the-sole-release-orchestrator", "uuid": "7ec8a937-fd4d-41f2-96b7-824fe3be913b", "date": "2026-10-11", "file": "release-automation.md", "anchor": "release-please-is-the-sole-release-orchestrator", "remote": null}, {"locator": "release-automation.md#commitizen-is-a-commit-helper-never-a-release-tool", "uuid": "ee1d2fad-67ab-4f4a-a531-73458da14eb1", "date": "2026-10-11", "file": "release-automation.md", "anchor": "commitizen-is-a-commit-helper-never-a-release-tool", "remote": null}], "superseded_by": null, "body": {"text": "Two friction points reopened the tool choice: a stable release cut after\nrelease candidates lists only changes since the last RC (release-please has no\nprerelease/stable distinction and no config remedy; the npm CLI team works\naround the same behaviour by hand), and the draft-then-finalize dance plus\nphantom-PR reconciliation are workarounds layered on release-please's model.\nThe research frames tools as commit helpers, changelog engines and release\norchestrators, and compares Commitizen (`cz bump`, fixes the RC range with one\nsetting, medium effort, reverses the commit-helper decision, loses the\nreviewable release PR) against git-cliff (a changelog engine only; high effort,\nRC math stays hand-written). Four options stand: stay and document, migrate to\nCommitizen, git-cliff inside a bespoke orchestrator, or defer. Until decided,\nnothing changes.\n\n**Why this needs an answer:** both replacements need a standing privileged\ncredential or a maintainer-local bump under the `full` preset's ruleset, and\n`release.yml` fans out to every generated project while being validated only\nby rendering until a live release runs. Whether the RC gap bites often enough\nto justify that blast radius is a maintainer judgement, not a research result.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": "both replacements need a standing privileged\ncredential or a maintainer-local bump under the `full` preset's ruleset, and\n`release.yml` fans out to every generated project while being validated only\nby rendering until a live release runs. Whether the RC gap bites often enough\nto justify that blast radius is a maintainer judgement, not a research result."}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "open", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "release-automation.md#optional-docker-hub-configuration-gates-the-publish-fan-out", "uuid": "f6f9eea4-dd38-4a74-98ed-f67e436c393d", "file": "release-automation.md", "line": 213, "end_line": 243, "title": "Optional Docker Hub configuration gates the publish fan-out", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "[PR #51](https://github.com/hasansezertasan/copier-pyproject/pull/51), [shared-gate review discussion](https://github.com/hasansezertasan/copier-pyproject/pull/51#discussion_r3524165040); commit [f48250e](https://github.com/hasansezertasan/copier-pyproject/commit/f48250ebe8b92c880964e892f7c2fb37471a12c4)", "verification": "corroborated — the web release workflow makes both PyPI and Docker publication depend on `docker-publish-preflight`", "revisit_when": "a new irreversible publication channel is added or Docker Hub opt-in semantics change", "see": [], "superseded_by": null, "body": {"text": "Docker Hub publication is optional and its credential pair is all-or-nothing:\nneither credential means GHCR-only publication, both enable Docker Hub, and a\npartial pair fails a shared preflight before either PyPI or Docker publication.\n\n**Reason:** PyPI uploads are irreversible. A credential check inside only the\nDocker job would allow PyPI publication to finish concurrently before Docker\nfailed, stranding a partially published release. The shared prerequisite rejects\nthat known configuration error before the publish jobs fan out; it does not make\nall later external uploads transactional.\n\n**Rejected alternative:** validate the credentials only inside Docker\npublication. Review moved the check into a shared prerequisite specifically to\nprevent the PyPI race. Requiring Docker Hub for every web release is not the\nselected contract; GHCR-only publication remains supported.\n\nThe narrowly scoped ghalint exceptions exist because conditional steps need\njob-scoped credential-presence information and GitHub does not expose the\nsecrets context directly in conditions. The token itself is reduced to a\npresence flag, not exposed job-wide. The exceptions are recorded in the\ngenerated `.github/ghalint.yaml` rather than disabling that policy globally.", "reason": "PyPI uploads are irreversible. A credential check inside only the\nDocker job would allow PyPI publication to finish concurrently before Docker\nfailed, stranding a partially published release. The shared prerequisite rejects\nthat known configuration error before the publish jobs fan out; it does not make\nall later external uploads transactional.", "rejected": ["validate the credentials only inside Docker\npublication. Review moved the check into a shared prerequisite specifically to\nprevent the PyPI race. Requiring Docker Hub for every web release is not the\nselected contract; GHCR-only publication remains supported."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "release-automation.md#released-issue-notifications-are-one-inline-job-in-release-yml", "uuid": "c8cd015d-12ff-47a7-9447-40b69a2b1a82", "file": "release-automation.md", "line": 244, "end_line": 264, "title": "Released-issue notifications are one inline job in `release.yml`", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-010 §2 (`docs/adr/010-pr-docs-previews-and-released-issue-notifications.md`)", "verification": null, "revisit_when": "the release lifecycle is split across workflows", "see": [{"locator": "release-automation.md#the-release-is-created-as-a-draft-finalized-after-artifacts-attach", "uuid": "398b3cd9-e57b-4856-b2c7-76752c0ec37f", "date": "2026-10-11", "file": "release-automation.md", "anchor": "the-release-is-created-as-a-draft-finalized-after-artifacts-attach", "remote": null}], "superseded_by": null, "body": {"text": "A `notify-released-issues` job, gated on a created release and running after\nfinalization, uses a single inline `github-script` step to comment the release\ntag and URL on every issue the release closed. It is always on, with no toggle.\n\n**Reason:** the upstream implementation shipped a committed Python script and a\nJS helper behind a reusable workflow — more moving parts than a single-maintainer\nproject needs. Inline in `release.yml` matches keeping the whole release\nlifecycle in one workflow, and it is zero-config: no closed issues means no\nnotification, so it cannot fail an unused feature.\n\n**Rejected alternative:** a separate `workflow_call` file with committed scripts.", "reason": "the upstream implementation shipped a committed Python script and a\nJS helper behind a reusable workflow — more moving parts than a single-maintainer\nproject needs. Inline in `release.yml` matches keeping the whole release\nlifecycle in one workflow, and it is zero-config: no closed issues means no\nnotification, so it cannot fail an unused feature.", "rejected": ["a separate `workflow_call` file with committed scripts."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "repo-setup.md#repository-metadata-via-the-settings-github-app-opt-in-labels-and-branch-protection-stay-out-of-it", "uuid": "dee6eadb-b617-4d64-bbec-7c688bad0604", "file": "repo-setup.md", "line": 3, "end_line": 33, "title": "Repository metadata via the Settings GitHub App, opt-in; labels and branch protection stay out of it", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-018 (`docs/adr/018-repository-settings-as-code.md`)", "verification": null, "revisit_when": "GitHub exposes the About-sidebar activity toggles through an API, or the Settings App gains rulesets support", "see": [{"locator": "external-integrations.md#a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "uuid": "392b6dcf-6e9d-441d-bf7b-64ba362578d7", "date": "2026-10-11", "file": "external-integrations.md", "anchor": "a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "remote": null}, {"locator": "repo-setup.md#branch-protection-as-code-through-an-opt-in-rulesets-sync-workflow", "uuid": "3f94789f-94e8-4758-a32d-1e0d72c0140b", "date": "2026-10-11", "file": "repo-setup.md", "anchor": "branch-protection-as-code-through-an-opt-in-rulesets-sync-workflow", "remote": null}], "superseded_by": null, "body": {"text": "`include_repo_settings` (default off, `full` preset only) renders\n`.github/settings.yml` for the Settings App: description, homepage, topics\n(normalized from a free-form answer and omitted when empty so existing topics\nstay untouched) and the squash-merge flags release-please needs. Labels are\nexcluded; branch protection and collaborators are excluded. The activity\ntoggles cannot be set by anything.\n\n**Reason:** the App is an external install, so opt-in. Labels are already\nmanaged App-free by an always-on label-sync workflow, and moving them under an\nopt-in App would drop the provisioning of the `no-issue` label that the\nlinked-issue check needs as its bypass. Branch protection was excluded as\nduplicating the documented required-checks setup — a part later superseded by\nthe rulesets workflow below. The activity toggles are web-UI only.\n\n**Rejected alternative:** consolidate labels under the App — breaks the\nlinked-issue escape hatch for any project without the App.\n\n**Consequence:** the App escalates push access to admin, mitigated by the\ndocumented CODEOWNERS plus required code-owner review pattern.", "reason": "the App is an external install, so opt-in. Labels are already\nmanaged App-free by an always-on label-sync workflow, and moving them under an\nopt-in App would drop the provisioning of the `no-issue` label that the\nlinked-issue check needs as its bypass. Branch protection was excluded as\nduplicating the documented required-checks setup — a part later superseded by\nthe rulesets workflow below. The activity toggles are web-UI only.", "rejected": ["consolidate labels under the App — breaks the\nlinked-issue escape hatch for any project without the App."], "consequence": "the App escalates push access to admin, mitigated by the\ndocumented CODEOWNERS plus required code-owner review pattern.", "considered": null, "why_open": null}, "refs": ["external-integrations.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "repo-setup.md#branch-protecti al plugin skill with its own hand-maintained verify list\nduplicating the doc. Neither knew per step whether it was already done, and\nsetup is invisible to CI. A standalone `steps.yaml` manifest would re-encode the\ncommands, actor tags and Jinja gating the doc already carries and drift against\nit — exactly what the single-home decision collapsed. The consumer is an LLM\nreader, not a parser, so RST readability suffices. Deferred classification is\nthe fix for a naive walk deadlocking at Pages before reaching the rest. The\nskill is a rendered file, so it never needs a post-copy task.\n\n**Rejected alternative:** a `steps.yaml` manifest — the drift above.\n\n**Consequence:** every future setup step must carry a `[CHECK]` block to stay\nmachine-drivable, as every step already had to carry an actor tag.\n\nThe repo-local half was removed on 2026-10-12; the entry below records why.", "reason": "the prose was executed two lossy ways — a human hand-running\ncommands, or an external plugin skill with its own hand-maintained verify list\nduplicating the doc. Neither knew per step whether it was already done, and\nsetup is invisible to CI. A standalone `steps.yaml` manifest would re-encode the\ncommands, actor tags and Jinja gating the doc already carries and drift against\nit — exactly what the single-home decision collapsed. The consumer is an LLM\nreader, not a parser, so RST readability suffices. Deferred classification is\nthe fix for a naive walk deadlocking at Pages before reaching the rest. The\nskill is a rendered file, so it never needs a post-copy task.", "rejected": ["a `steps.yaml` manifest — the drift above."], "consequence": "every future setup step must carry a `[CHECK]` block to stay\nmachine-drivable, as every step already had to carry an actor tag.", "considered": null, "why_open": null}, "refs": ["agent-instructions.md", "template-updates.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-12", "commit": "7d7ce45"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "repo-setup.md#this-repository-s-own-one-time-setup-is-two-documented-commands-not-a-repo-local-skill", "uuid": "c85feefa-0063-4a34-8030-8c348190b96b", "file": "repo-setup.md", "line": 147, "end_line": 172, "title": "This repository's own one-time setup is two documented commands, not a repo-local skill", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": null, "verification": null, "revisit_when": "this repository's own setup grows beyond a couple of settings, or has to be re-applied repeatedly (forks, re-created repo, recurring drift)", "see": [], "superseded_by": null, "body": {"text": "The template repository's own setup — squash-only merging with the PR title as\nthe commit message, plus `can_approve_pull_request_reviews=true` so\nrelease-please can open its release PR, with `default_workflow_permissions`\nleft at least-privilege `read` — is recorded as two `gh` commands under\n\"One-time repo setup\" in `docs/template-architecture.md`. The repo-local\n`.claude/skills/repo-setup/` that drove them (ADR-023 §3) is removed. The\nshipped `repo-setup` skill keeps its role; the plugin `setup` skill was\nlater removed (companion-skills.md).\n\n**Reason:** the setup runs once per repository and has already run —\nrelease-please has been cutting releases. Afterwards the skill sat in every\nsession's skill list next to two similarly named setup skills for generated\nprojects, and it duplicated the two commands the architecture doc already\ncarries.\n\n**Rejected alternative:** keep it as an idempotent verifier for when the\nrelease PR stops opening, or for a fork — re-running the two documented\ncommands (with the fork's `OWNER/REPO` substituted) covers that by hand.", "reason": "the setup runs once per repository and has already run —\nrelease-please has been cutting releases. Afterwards the skill sat in every\nsession's skill list next to two similarly named setup skills for generated\nprojects, and it duplicated the two commands the architecture doc already\ncarries.", "rejected": ["keep it as an idempotent verifier for when the\nrelease PR stops opening, or for a fork — re-running the two documented\ncommands (with the fork's `OWNER/REPO` substituted) covers that by hand."], "consequence": null, "considered": null, "why_open": null}, "refs": ["companion-skills.md"], "git": {"created": null, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-12", "commit": "7d7ce45"}, "status_history": []}, "findings": []}, {"id": "runtime-logging.md#an-unavailable-home-directory-permits-placeholders-not-shared-temp-logging", "uuid": "1488d613-3cce-4249-ade8-3a6dacbaceec", "file": "runtime-logging.md", "line": 3, "end_line": 32, "title": "An unavailable home directory permits placeholders, not shared-temp logging", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "[PR #126](https://github.com/hasansezertasan/copier-pyproject/pull/126), [rejection of the temporary-log fallback](https://github.com/hasansezertasan/copier-pyproject/pull/126#issuecomment-5168172412); commit [f47e6fc](https://github.com/hasansezertasan/copier-pyproject/commit/f47e6fc4aa885851b671eb33772b472abcb24f26)", "verification": "corroborated — `core/dirs.py.jinja` distinguishes home resolution from placeholder paths, and `core/logging_setup.py.jinja` disables file logging when home resolution fails", "revisit_when": "logging initialization becomes lazy or the template adopts a verified user-private fallback directory", "see": [], "superseded_by": null, "body": {"text": "Logging attaches the console handler before attempting file logging. Failure to\nresolve the home directory disables file logging entirely; file-system errors\nwith a resolved home also degrade to console-only logging. Directory values may\nstill use a temporary-directory-derived `Path` as a placeholder, but the template\ndoes not automatically write logs there.\n\n**Reason:** logger initialization can happen at module import, so unavailable or\nunwritable home storage must not crash read-only commands. A predictable shared\ntemporary log path can be pre-created or symlinked by another local user; its\nexistence as a valid `Path` does not establish safe ownership for writes.\n\n**Rejected alternative:** automatically log under a shared temporary project\ndirectory when home resolution fails. The initial fallback was explicitly\nrejected because it creates a local log-hijacking opportunity.\n\nLazy file-handler initialization was suggested, but the reviewed evidence does\nnot establish why it was not selected. The current cached logger accessor also\ndoes not make module-level calls lazy: caching prevents repeated setup, not the\nfirst import-time initialization.", "reason": "logger initialization can happen at module import, so unavailable or\nunwritable home storage must not crash read-only commands. A predictable shared\ntemporary log path can be pre-created or symlinked by another local user; its\nexistence as a valid `Path` does not establish safe ownership for writes.", "rejected": ["automatically log under a shared temporary project\ndirectory when home resolution fails. The initial fallback was explicitly\nrejected because it creates a local log-hijacking opportunity."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "standalone-executables.md#three-architecture-named-executable-toggles-instead-of-one-brand-toggle", "uuid": "d5aed1a0-0b7c-4ac3-9d75-fb9568d9e34d", "file": "standalone-executables.md", "line": 3, "end_line": 38, "title": "Three architecture-named executable toggles instead of one brand toggle", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-007 (`docs/adr/007-standalone-executable-toggles.md`)", "verification": null, "revisit_when": "a fourth standalone-executable architecture appears, or a category's strongest tool changes", "see": [], "superseded_by": null, "body": {"text": "`include_launcher` (PyCrucible, uv-bootstrap launcher), `include_compiler`\n(Nuitka, source-to-machine-code) and `include_freezer` (PyInstaller,\ninterpreter-plus-deps bundle) replace the single `include_pycrucible` toggle.\nAll three default to `false` and combine freely; there is no `when:` gating and\nno mutually exclusive choice.\n\n**Reason:** the single toggle conflated a brand with a capability and covered\none of three architectures that make materially different promises — a tiny\nonline-first-run launcher, a compiled native binary, a fully offline bundle — and\nthat a project may legitimately want together (a launcher for connected users\nand an offline bundle for air-gapped ones). Naming the architecture rather than\nthe tool means swapping PyCrucible for PyApp later needs no variable rename.\n\n**Rejected alternative:** one `executable_tool` enum — forces mutual exclusion\nthat is wrong for these categories and blocks adding a fourth later.\n\n**Rejected alternative:** PyApp or UVBox — same launcher category as\nPyCrucible, lateral not new capability. cx_Freeze and py2exe — weaker freezers\n(py2exe Windows-only). mypyc — module-level, not whole-app. Briefcase — targets\nnative installers and GUI/mobile packaging, out of scope for a single-file\nexecutable. PyOxidizer — archived.\n\n**Consequence:** a breaking rename for existing answers files with no automatic\nmigration (Copier does not rename variables). Build dependencies live in the uv\n`tool` group and are Renovate-tracked like every other pin. Each toggle must be\nexercised independently and in combination.", "reason": "the single toggle conflated a brand with a capability and covered\none of three architectures that make materially different promises — a tiny\nonline-first-run launcher, a compiled native binary, a fully offline bundle — and\nthat a project may legitimately want together (a launcher for connected users\nand an offline bundle for air-gapped ones). Naming the architecture rather than\nthe tool means swapping PyCrucible for PyApp later needs no variable rename.", "rejected": ["one `executable_tool` enum — forces mutual exclusion\nthat is wrong for these categories and blocks adding a fourth later.", "PyApp or UVBox — same launcher category as\nPyCrucible, lateral not new capability. cx_Freeze and py2exe — weaker freezers\n(py2exe Windows-only). mypyc — module-level, not whole-app. Briefcase — targets\nnative installers and GUI/mobile packaging, out of scope for a single-file\nexecutable. PyOxidizer — archived."], "consequence": "a breaking rename for existing answers files with no automatic\nmigration (Copier does not rename variables). Build dependencies live in the uv\n`tool` group and are Renovate-tracked like every other pin. Each toggle must be\nexercised independently and in combination.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "standalone-executables.md#executables-are-named-per-tool-and-os-and-all-target-the-package-main-module", "uuid": "1b37b4df-147f-4d71-8249-4003ecfe4302", "file": "standalone-executables.md", "line": 39, "end_line": 73, "title": "Executables are named per tool and OS and all target the package main module", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-007 (`docs/adr/007-standalone-executable-toggles.md`)", "verification": null, "revisit_when": "`attach-github-release` stops flattening downloaded artifacts by filename, or component selection moves out of `__main__.py`", "see": [], "superseded_by": null, "body": {"text": "Each build names its binary `<pkg>-<tool>-<os-label>` rather than a bare\n`<pkg>`. All three builds target the package's `__main__.py`, which was\ngeneralized from a CLI-only form into the single entry that selects and\nlaunches whichever component is enabled; with an executable toggle on but no\nrunnable component selected, `main()` raises a `SystemExit` with an\nexplanatory message.\n\n**Reason:** the release job collects every executable artifact with\n`merge-multiple`, which flattens by filename — bare names made per-OS (and,\nwith more than one toggle, per-tool) binaries silently overwrite each other and\ndrop platforms from the release. One entrypoint keeps the PyInstaller spec, the\nNuitka command and the PyCrucible config free of duplicated component\nconditionals and guarantees the binary *runs* the app rather than importing a\nmodule that never invokes it. A binary that builds and exits non-zero with a\nreason beats one that silently does nothing and looks broken.\n\n**Consequence:** PyCrucible takes the name via its output option, Nuitka via\n`--output-filename` (otherwise a generic `__main__.bin`), PyInstaller is renamed\nafter the build because its spec cannot see the CI matrix. The PyInstaller spec\nis rendered for reproducible builds and un-ignored in the generated\n`.gitignore` (the default `*.spec` ignore would keep it uncommitted and break\nthe fresh-checkout release build); Nuitka's flags live in the mise task and CI\nstep since it has no spec equivalent. The mise `package`  "69443ac8-be5b-401a-b45d-53d19c54045c", "file": "standalone-executables.md", "line": 74, "end_line": 93, "title": "Every executable toggle adds a PR-time build-check job", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-007 (`docs/adr/007-standalone-executable-toggles.md`)", "verification": null, "revisit_when": "the test suite starts exercising the built binary, or the per-OS build cost outweighs the signal", "see": [], "superseded_by": null, "body": {"text": "Each enabled toggle renders a per-OS, `fail-fast: false` `build-<tool>-check`\njob in `ci.yml` that builds the executable on every push and pull request,\nverifies the binary was produced, smoke-runs it with `--help` for a CLI\nproject, uploads a short-retention preview artifact and gates the `check` job.\nIt mirrors the release build commands but never publishes.\n\n**Reason:** the test suite always runs the source tree, never the built\nbinary, so a dependency or Python bump that breaks packaging would otherwise\nfail silently at release time instead of against the offending diff.\n\n**Rejected alternative:** build only at release time — the previous state.", "reason": "the test suite always runs the source tree, never the built\nbinary, so a dependency or Python bump that breaks packaging would otherwise\nfail silently at release time instead of against the offending diff.", "rejected": ["build only at release time — the previous state."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "supply-chain-security.md#provenance-minting-shares-the-protected-publication-boundary", "uuid": "a0396603-cb34-4151-9d5b-1fc77eb31f6e", "file": "supply-chain-security.md", "line": 3, "end_line": 43, "title": "Provenance minting shares the protected publication boundary", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "[issue #185](https://github.com/hasansezertasan/copier-pyproject/issues/185), [PR #318](https://github.com/hasansezertasan/copier-pyproject/pull/318), review discussions on [private availability](https://github.com/hasansezertasan/copier-pyproject/pull/318#discussion_r4065991055) and [the trust boundary](https://github.com/hasansezertasan/copier-pyproject/pull/318#discussion_r4065991056); commit [cc7ce42](https://github.com/hasansezertasan/copier-pyproject/commit/cc7ce42b91d56a0a75901606f93e29afa0315ceb)", "verification": "corroborated — the release build uses the `publish` environment, includes gated attestation steps and per-platform bundles, and installation docs constrain signer workflow and ref", "revisit_when": "attestation availability, signer verification, or the publishing environment's branch policy changes", "see": [], "superseded_by": null, "body": {"text": "The release build attests the distributions it produces and retains the\nprovenance bundles alongside the release artifacts. Matrix builds attest their\nown outputs. Attestation minting runs behind the same externally protected\n`publish` environment as package publication, with a main-only deployment policy\nconfigured during repository setup. Referencing the environment in workflow\nsource alone does not prove that an adopter configured its live policy.\nConsumer verification identifies\nthe release workflow and the `main` ref, not only the repository. The workflow\nenables attestation for public repositories and requires explicit opt-in for\nprivate ones.\n\n**Reason:** repository identity alone does not prove that the intended protected\nrelease workflow built an artifact. A branch-dispatched workflow could otherwise\nmint repository-backed attestations for arbitrary outputs. GitHub evaluates the\nenvironment's deployment policy outside the dispatched workflow file, so that\nboundary also protects provenance minting. The private opt-in avoids breaking\nreleases on plans without the necessary attestation support.\n\n**Rejected alternative:** leave minting in an unprotected build job and verify\nonly repository identity. Review rejected this weaker trust boundary.\n\n**Rejected alternative:** attempt attestations unconditionally on private\nrepositories. Review required explicit opt-in to preserve unsupported private\nrelease paths.\n\n[ADR-002](../docs/adr/002-release-please-for-release-automation.md) records why manual release\ndispatch remains necessary and why the environment must have a main-only policy.\nThe verification procedure is in generated `docs/installation.rst`; this entry\nrecords why its signer constraints and the minting boundary exist.", "reason": "repository identity alone does not prove that the intended protected\nrelease workflow built an artifact. A branch-dispatched workflow could otherwise\nmint repository-backed attestations for arbitrary outputs. GitHub evaluates the\nenvironment's deployment policy outside the dispatched workflow file, so that\nboundary also protects provenance minting. The private opt-in avoids breaking\nreleases on plans without the necessary attestation support.", "rejected": ["leave minting in an unprotected build job and verify\nonly repository identity. Review rejected this weaker trust boundary.", "attempt attestations unconditionally on private\nrepositories. Review required explicit opt-in to preserve unsupported private\nrelease paths."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "supply-chain-security.md#relationship-between-github-provenance-and-pypi-attestations", "uuid": "09b24722-bfa5-460a-bbd7-05d8973b5389", "file": "supply-chain-security.md", "line": 44, "end_line": 65, "title": "Relationship between GitHub provenance and PyPI attestations", "type": ["decision"], "status": "superseded", "evidence": "unknown", "source": "[issue #185](https://github.com/hasansezertasan/copier-pyproject/issues/185), PyPI-side integration question; [PR #318](https://github.com/hasansezertasan/copier-pyproject/pull/318)", "verification": "uncorroborated — the reviewed sources establish the explicit GitHub provenance path, but no resolution of the PyPI-side overlap question was found", "revisit_when": null, "see": [{"locator": "supply-chain-security.md#provenance-minting-shares-the-protected-publication-boundary", "uuid": "a0396603-cb34-4151-9d5b-1fc77eb31f6e", "date": "2026-10-08", "file": "supply-chain-security.md", "anchor": "provenance-minting-shares-the-protected-publication-boundary", "remote": null}], "superseded_by": "f5495121-8004-4652-b3ac-af71995c263a", "body": {"text": "The proposal asked whether the trusted-publishing action's PEP 740 attestations\nmake the explicit GitHub provenance step partly redundant, or whether both paths\nserve a deliberate belt-and-suspenders purpose. The implementation retains the\nGitHub path, but the rationale for its relationship to PyPI-side attestations\ncould not be recovered. No historical reason for keeping both was established;\nthis was not a finding that either mechanism was defective or safe to remove.\n\nThe current decision below resolves the configuration choice from verified\ntechnical differences. It does not turn that new justification into a claim\nabout the original implementation's intent.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "superseded", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "supply-chain-security.md#retain-build-provenance-and-publication-attestations-as-distinct-claims", "uuid": "f5495121-8004-4652-b3ac-af71995c263a", "file": "supply-chain-security.md", "line": 66, "end_line": 111, "title": "Retain build provenance and publication attestations as distinct claims", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "current attestation review, 2026-10-08; [PyPI Publish predicate](https://docs.pypi.org/attestations/publish/v1/), [PyPI attestation production](https://docs.pypi.org/attestations/producing-attestations/), [GitHub artifact attestations](https://docs.github.com/en/actions/concepts/security/artifact-attestations); pinned PyPI action [dc37677](https://github.com/pypa/gh-action-pypi-publish/commit/dc37677b2e1c63e2034f94d8a5b11f265b73ba33), `action.yml` defaults and `attestations.py` signing implementation", "verification": "corroborated — the build job emits SLSA provenance, the separate PyPI job uses default Trusted Publishing attestations, and both consume the same distribution artifacts without rebuilding", "revisit_when": "the publishing action changes its default predicate or the workflow changes artifact transfer or attestation storage", "see": [{"locator": "supply-chain-security.md#provenance-minting-shares-the-protected-publication-boundary", "uuid": "a0396603-cb34-4151-9d5b-1fc77eb31f6e", "date": "2026-10-08", "file": "supply-chain-security.md", "anchor": "provenance-minting-shares-the-protected-publication-boundary", "remote": null}], "superseded_by": null, "body": {"text": "The current configuration retains both mechanisms. GitHub's build step produces\nSLSA provenance at build time, with workflow/source/run information and artifact\ndigests. The pinned PyPI action defaults to a PyPI Publish attestation during\nTrusted Publishing to PyPI or TestPyPI: its predicate body is empty, and its\ncertificate identity identifies the publisher. It is not a second structured\nSLSA build statement. PEP 740 defines index-hosted attestation handling rather\nthan requiring that all attestations make the same claim.\n\n**Reason:** the claims and consumer channels complement one another. GitHub\nstores build attestations and the template attaches their bundles to releases;\nPyPI exposes publication attestations through its per-file provenance APIs and\nUI. The publishing and release-attachment jobs download the built distributions\nwithout rebuilding them, preserving the artifact hashes. PyPI's default signing\ndoes not export the separately created GitHub build-provenance bundle to PyPI.\n\n**Rejected alternative:** remove the explicit GitHub step because PyPI already\nsigns attestations. The default publication claim does not replace the structured\nbuild claim or the build bundle distributed with GitHub Releases.\n\n**Rejected alternative:** disable PyPI's default attestations as duplicate work.\nThat would remove the index-hosted publication claim and its discovery channel.\nThere is overlapping identity/integrity coverage, but neither path currently\nreplaces all of the other's claims and availability.\n\nGitHub's private-repository entitlement and explicit opt-in govern its build\nattestations only. The PyPI action has no equivalent repository-visibility gate;\nits default path requires Trusted Publishing and uses public Sigstore signing\ninfrastructure. API-token publication or an explicit attestation opt-out changes\nthat path. Main-only publication depends on the configured GitHub environment policy,\nnot inferred merely from a PyPI publisher's repository/workflow registration.\n\nThe verification procedures and availability distinction are in generated\n`docs/installation.rst`. This is a present decision grounded in the documented\nmechanisms; the original rationale remains unknown in the superseded record.", "reason": "the claims and consumer channels complement one another. GitHub\nstores build attestations and the template attaches their bundles to releases;\nPyPI exposes publication attestations through its per-file provenance APIs and\nUI. The publishing and release-attachment jobs download the built distributions\nwithout rebuilding them, preserving the artifact hashes. PyPI's default signing\ndoes not export the separately created GitHub build-provenance bundle to PyPI.", "rejected": ["remove the explicit GitHub step because PyPI already\nsigns attestations. The default publication claim does not replace the structured\nbuild claim or the build bundle distributed with GitHub Releases.", "disable PyPI's default attestations as duplicate work.\nThat would remove the index-hosted publication claim and its discovery channel.\nThere is overlapping identity/integrity coverage, but neither path currently\nreplaces all of the other's claims and availability."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "supply-chain-security.md#unknown-scan-visibility-fails-open-private-audits-remain-useful", "uuid": "8973c4ce-8e76-42fa-b69b-e52fc34eba50", "file": "supply-chain-security.md", "line": 112, "end_line": 146, "title": "Unknown scan visibility fails open; private audits remain useful", "type": ["decision", "workaround"], "status": "active", "evidence": "confirmed", "source": "[issue #293](https://github.com/hasansezertasan/copier-pyproject/issues/293), [PR #294](https://github.com/hasansezertasan/copier-pyproject/pull/294), [PR #291](https://github.com/hasansezertasan/copier-pyproject/pull/291); commits [0e7fac8](https://github.com/hasansezertasan/copier-pyproject/commit/0e7fac8acb9d7b98f449380791212a7f58ed33f9) and [f19133d](https://github.com/hasansezertasan/copier-pyproject/commit/f19133d059f93c35136a81cb2cdebea017d9cf49)", "verification": "corroborated — CodeQL and Scorecard coalesce visibility sources with a public default; zizmor selects public SARIF or private inline annotations", "revisit_when": "GitHub documents a reliable visibility source for scheduled runs or private scanning availability changes", "see": [], "superseded_by": null, "body": {"text": "CodeQL and Scorecard use two potential visibility sources and default an unknown\nresult to public. Zizmor instead switches its output mode: public repositories\nuse the code-scanning dashboard, while private/internal repositories keep the\naudit through inline annotations rather than a potentially unsupported upload.\n\n**Reason:** scheduled runs lack the usual repository event payload, and the\nother visibility property was undocumented and runtime-unverified in the\ninvestigation. Silently skipping public security scans when both sources are\nempty is a worse failure than an unsupported private run reporting an error.\nZizmor's push/PR events have the payload needed for its narrower mode selection;\nan unavailable private dashboard does not make the underlying audit useless.\n\n**Rejected alternative:** guard scheduled scans with a single visibility source.\nIt could silently disable analysis when that source is absent.\n\n**Rejected alternative:** skip the entire private zizmor job. That discards an\naudit that can still report through annotations without code-scanning support.\n\nThe fallback rationale is confirmed by the sources; actual runtime availability\nof the undocumented visibility property remains unknown. Source inspection\ncorroborates the implemented policy, not that property's runtime behavior.\n[ADR-013](../docs/adr/013-megalinter-opt-in-lean-complement.md) separately records\nMegaLinter's best-effort SARIF upload posture.", "reason": "scheduled runs lack the usual repository event payload, and the\nother visibility property was undocumented and runtime-unverified in the\ninvestigation. Silently skipping public security scans when both sources are\nempty is a worse failure than an unsupported private run reporting an error.\nZizmor's push/PR events have the payload needed for its narrower mode selection;\nan unavailable private dashboard does not make the underlying audit useless.", "rejected": ["guard scheduled scans with a single visibility source.\nIt could silently disable analysis when that source is absent.", "skip the entire private zizmor job. That discards an\naudit that can still report through annotations without code-scanning support."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "supply-chain-security.md#local-and-historical-secret-scanning-cover-different-failure-stages", "uuid": "62d903d7-45bb-4790-b28a-f5dd1934983a", "file": "supply-chain-security.md", "line": 147, "end_line": 173, "title": "Local and historical secret scanning cover different failure stages", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "[issue #175](https://github.com/hasansezertasan/copier-pyproject/issues/175), [PR #236](https://github.com/hasansezertasan/copier-pyproject/pull/236); commit [825f420](https://github.com/hasansezertasan/copier-pyproject/commit/825f420cf4fafcc4444f85b108db84a21b4389e8); `docs/template-architecture.md`, secret scanning", "verification": "corroborated — generated prek config includes detect-secrets and a baseline, while the security workflow retains gitleaks history scanning", "revisit_when": "either scanner's execution stage or baseline-management contract changes", "see": [], "superseded_by": null, "body": {"text": "Generated projects retain both a local, baseline-backed detect-secrets hook and\nhistory-spanning gitleaks in CI.\n\n**Reason:** historical scanning detects exposure after a secret reaches commit\nhistory. A local hook can stop that commit before the exposure occurs. The\ncommitted baseline makes known false positives reviewable instead of requiring\nblanket scanner suppression. Similar-looking scanners are therefore deliberate\nlayers, not redundant lint execution.\n\n**Rejected alternative:** rely on historical gitleaks coverage alone. The issue\nidentifies the missing before-commit gate as the reason for adding local scanning.\nAlternatives among other local scanning tools, and why they lost to\ndetect-secrets, are unknown in the reviewed evidence.\n\nThe baseline maintenance procedure is in generated `.github/CONTRIBUTING.md`.\n[ADR-003](../docs/adr/003-tox-as-canonical-lint-runner.md) covers the general fast-hook versus\nfull-suite boundary; this entry records the distinct exposure stages.", "reason": "historical scanning detects exposure after a secret reaches commit\nhistory. A local hook can stop that commit before the exposure occurs. The\ncommitted baseline makes known false positives reviewable instead of requiring\nblanket scanner suppression. Similar-looking scanners are therefore deliberate\nlayers, not redundant lint execution.", "rejected": ["rely on historical gitleaks coverage alone. The issue\nidentifies the missing before-commit gate as the reason for adding local scanning.\nAlternatives among other local scanning tools, and why they lost to
