t (ai-rulez composes its own headings and stamps a\nprovenance header with a content hash), so rendering both would diff on first\ngenerate and every `copier update` would re-render on top of generated files —\nchurn on files the adopter never touched. As build output they sit outside the\n3-way merge, which then covers only the small per-rule sources. Neither\ndirection is automatic because the template has no tasks. Dropping the toggle\nfrom `full` was rejected: `full` means every toggle, and a preset that quietly\nomits one is a worse surprise than a loud one.\n\n**Rejected alternative:** render the generated files as well — the churn above.", "reason": "copier's renderer and ai-rulez's renderer produce different bytes\nfor the same content (ai-rulez composes its own headings and stamps a\nprovenance header with a content hash), so rendering both would diff on first\ngenerate and every `copier update` would re-render on top of generated files —\nchurn on files the adopter never touched. As build output they sit outside the\n3-way merge, which then covers only the small per-rule sources. Neither\ndirection is automatic because the template has no tasks. Dropping the toggle\nfrom `full` was rejected: `full` means every toggle, and a preset that quietly\nomits one is a worse surprise than a loud one.", "rejected": ["render the generated files as well — the churn above."], "consequence": null, "considered": null, "why_open": null}, "refs": ["template-updates.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "agent-instructions.md#no-builtin-ai-rulez-domains-and-ai-rulez-never-touches-gitignore", "uuid": "e9823c4a-891f-4344-8d64-029dd8d31138", "file": "agent-instructions.md", "line": 68, "end_line": 94, "title": "No builtin ai-rulez domains, and ai-rulez never touches `.gitignore`", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "ADR-035 §3–4 (`docs/adr/035-ai-rulez-as-the-agent-instruction-source.md`)", "verification": null, "revisit_when": "a builtin domain stops contradicting a gate the project enforces, or the gitignore stops being cobo-sealed", "see": [{"locator": "gitignore-generation.md#cobo-generates-the-gitignore-with-a-hash-sealed-fence-and-lockfiles", "uuid": "3e3bc38e-bc1e-4e65-b74d-e91848262157", "date": "2026-10-11", "file": "gitignore-generation.md", "anchor": "cobo-generates-the-gitignore-with-a-hash-sealed-fence-and-lockfiles", "remote": null}], "superseded_by": null, "body": {"text": "`builtins = false`: the shipped rules are only the project's own.\n`gitignore = false`: the generated output is committed and ai-rulez does not\nrewrite the ignore file.\n\n**Reason:** every one of the seven auto-included builtin domains either\nrestates a gate or contradicts it — complexity 20 versus ruff's 5, 120 columns\nversus 88, 80% coverage versus 99%, \"use conventional commits\" versus the\nblocking title check. A rule an agent obeys and a gate that fails it must never\nbe two separately maintained sentences, and per-domain exclusions would leave\nthe next release free to add a contradiction to a domain opted into. Off\nentirely also keeps the generated file ~60 lines instead of ~270. ai-rulez's\ndefault gitignore rewrite would break the cobo-sealed fence and hide the very\nfiles GitHub must find in the repository.\n\n**Rejected alternative:** per-domain `!` exclusions — the next-release risk.", "reason": "every one of the seven auto-included builtin domains either\nrestates a gate or contradicts it — complexity 20 versus ruff's 5, 120 columns\nversus 88, 80% coverage versus 99%, \"use conventional commits\" versus the\nblocking title check. A rule an agent obeys and a gate that fails it must never\nbe two separately maintained sentences, and per-domain exclusions would leave\nthe next release free to add a contradiction to a domain opted into. Off\nentirely also keeps the generated file ~60 lines instead of ~270. ai-rulez's\ndefault gitignore rewrite would break the cobo-sealed fence and hide the very\nfiles GitHub must find in the repository.", "rejected": ["per-domain `!` exclusions — the next-release risk."], "consequence": null, "considered": null, "why_open": null}, "refs": ["gitignore-generation.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "agent-instructions.md#two-gates-plus-a-convergence-scenario-over-every-host", "uuid": "b23fd420-5b88-4075-93ad-5122b4f7622e", "file": "agent-instructions.md", "line": 95, "end_line": 131, "title": "Two gates plus a convergence scenario over every host", "type": ["decision", "incident"], "status": "active", "evidence": "confirmed", "source": "ADR-035 §6–7 (`docs/adr/035-ai-rulez-as-the-agent-instruction-source.md`)", "verification": null, "revisit_when": "ai-rulez gains a check mode for preset output, or a host's generated output changes format", "see": [{"locator": "template-testing.md#generated-files-must-be-formatter-canonical-not-merely-valid", "uuid": "9b931598-7e52-4ff1-bb07-ef65c01d5369", "date": "2026-10-11", "file": "template-testing.md", "anchor": "generated-files-must-be-formatter-canonical-not-merely-valid", "remote": null}, {"locator": "lint-orchestration.md#the-tox-style-env-is-the-sole-authoritative-lint-suite-prek-is-a-fast-gate-not-a-second-suite", "uuid": "9b74fc8b-a808-4f2b-bdbd-9e4253c1b35a", "date": "2026-10-11", "file": "lint-orchestration.md", "anchor": "the-tox-style-env-is-the-sole-authoritative-lint-suite-prek-is-a-fast-gate-not-a-second-suite", "remote": null}], "superseded_by": null, "body": {"text": "prek runs the generator as a fixing hook; tox `style` runs `ai-rulez validate`;\nand `ci.yml`'s hooks job additionally fails on any working-tree change\nincluding untracked files. A template-ci scenario renders the toggle on with\n*every* offered host, runs the generator, then the generated project's own\nfixing hooks, and gates on `git diff`; it also runs the checking hooks and\ngates on their exit codes. Checking hooks skip the paths a generator owns\n(`.continue/prompts/` for trailing-whitespace, yamllint and the editorconfig\nchecker; `.mdc` for the editorconfig checker), rendered only under the toggle.\n\n**Reason:** there is no check mode for preset output, and a fixing hook only\nfails on a modified *tracked* file — a project that never committed its output\nwould have it regenerated untracked and stay green, shipping instructions that\nexist on no branch. Two generators writing one tree that disagree on a byte\nleave a repository that never converges. The defaults emit markdown alone and\nconverge; two hosts found only once the scenario covered every host do not —\ncontinue-dev's YAML header carries trailing-space comment lines the whitespace\nhook strips and the next generate restores, and cursor's `.mdc` rules fail the\neditorconfig checker because the `\\.md$` exclude does not reach the extra\ncharacter. A checking hook rejecting generated output cannot be satisfied at\nall, so it gets the `.copier-answers.yml` answer: skip the generator-owned\npath.\n\n**Consequence:** the width of the gate is the width of the output it sees;\nevery offered host widens the scenario that must keep passing.", "reason": "there is no check mode for preset output, and a fixing hook only\nfails on a modified *tracked* file — a project that never committed its output\nwould have it regenerated untracked and stay green, shipping instructions that\nexist on no branch. Two generators writing one tree that disagree on a byte\nleave a repository that never converges. The defaults emit markdown alone and\nconverge; two hosts found only once the scenario covered every host do not —\ncontinue-dev's YAML header carries trailing-space comment lines the whitespace\nhook strips and the next generate restores, and cursor's `.mdc` rules fail the\neditorconfig checker because the `\\.md$` exclude does not reach the extra\ncharacter. A checking hook rejecting generated output cannot be satisfied at\nall, so it gets the `.copier-answers.yml` answer: skip the generator-owned\npath.", "rejected": [], "consequence": "the width of the gate is the width of the output it sees;\nevery offered host widens the scenario that must keep passing.", "considered": null, "why_open": null}, "refs": ["lint-orchestration.md", "template-testing.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "agent-instructions.md#no-claude-md-by-default-claude-left-the-preset-defaults-gemini-is-no-longer-offered", "uuid": "1a6849be-72d0-4990-abe2-7a0243cd5e67", "file": "agent-instructions.md", "line": 132, "end_line": 165, "title": "No `CLAUDE.md` by default; `claude` left the preset defaults; `gemini` is no longer offered", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-035, 2026-10 amendment (`docs/adr/035-ai-rulez-as-the-agent-instruction-source.md`)", "verification": null, "revisit_when": "Claude Code stops reading `AGENTS.md` natively, or the maintainers start using Gemini", "see": [{"locator": "agent-instructions.md#ai-rulez-is-the-opt-in-single-source-for-agent-instructions-with-the-prose-in-shared-macros", "uuid": "e1545d12-ac20-426b-9cd5-519e80a56b5f", "date": "2026-10-11", "file": "agent-instructions.md", "anchor": "ai-rulez-is-the-opt-in-single-source-for-agent-instructions-with-the-prose-in-shared-macros", "remote": null}], "superseded_by": null, "body": {"text": "The default shape uses `AGENTS.md` alone, including for Claude Code. The former\n`@AGENTS.md` wrapper is neither rendered nor preserved on update any more, so\nan update deletes leftover copies (customized ones too). `ai_rulez_presets`\ndefaults to `codex` and `copilot`; `claude` is still offered but not default;\n`gemini` was removed from the choices.\n\n**Reason:** Claude Code reads `AGENTS.md` natively, removing the only reason the\nwrapper existed — and a leftover `CLAUDE.md` makes Claude Code's default mode\n*skip* `AGENTS.md`, the opposite of what the default shape wants. The `codex`\nhost already writes `AGENTS.md`, so `claude` only added a duplicate wrapper and\na `.claude/` tree. The maintainers do not use Gemini and every offered host\nwidens the convergence scenario.\n\n**Rejected alternative:** keep excluding `CLAUDE.md` from updates to protect\nadopter guidance — kept a file that actively harmed the default; the README\ntells adopters to move unique guidance first, and git history keeps the old\ncontent.\n\n**Consequence:** by default the per-host skills no longer reach Claude Code,\nwhich looks under `.claude/skills/`; adopters who want them select `claude`.\nRemoving a choice has a sharp edge: a `--defaults` update (what Renovate runs)\nsilently replaces a recorded selection containing a removed choice with the new\ndefaults, so a project that selected `gemini` loses every other host too and\nkeeps a stale `GEMINI.md`; such a project cleans before updating and re-selects.", "reason": "Claude Code reads `AGENTS.md` natively, removing the only reason the\nwrapper existed — and a leftover `CLAUDE.md` makes Claude Code's default mode\n*skip* `AGENTS.md`, the opposite of what the default shape wants. The `codex`\nhost already writes `AGENTS.md`, so `claude` only added a duplicate wrapper and\na `.claude/` tree. The maintainers do not use Gemini and every offered host\nwidens the convergence scenario.", "rejected": ["keep excluding `CLAUDE.md` from updates to protect\nadopter guidance — kept a file that actively harmed the default; the README\ntells adopters to move unique guidance first, and git history keeps the old\ncontent."], "consequence": "by default the per-host skills no longer reach Claude Code,\nwhich looks under `.claude/skills/`; adopters who want them select `claude`.\nRemoving a choice has a sharp edge: a `--defaults` update (what Renovate runs)\nsilently replaces a recorded selection containing a removed choice with the new\ndefaults, so a project that selected `gemini` loses every other host too and\nkeeps a stale `GEMINI.md`; such a project cleans before updating and re-selects.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "architecture-contracts.md#one-exhaustive-import-linter-layers-contract-cli-above-independent-components-above-core-above-utils", "uuid": "3b7cdbee-7c66-4e52-9d7e-8ab0ffe32e56", "file": "architecture-contracts.md", "line": 3, "end_line": 39, "title": "One exhaustive import-linter layers contract: cli above independent components above core above utils", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-014 (`docs/adr/014-import-linter-for-architecture-contracts.md`)", "verification": null, "revisit_when": "`core` starts importing `utils`, a second orchestrator component appears, or a component needs an exception the layers model cannot express", "see": [{"locator": "components.md#secondary-components-are-subcommands-of-one-console-root-not-separate-scripts", "uuid": "3d60ab14-8ff9-47db-b326-d7e82947a6cf", "date": "2026-10-11", "file": "components.md", "anchor": "secondary-components-are-subcommands-of-one-console-root-not-separate-scripts", "remote": null}], "superseded_by": null, "body": {"text": "import-linter is an always-on style tool. A single `layers` contract stacks\n`cli` (present only with `include_cli`), the enabled non-CLI components as\npipe-separated independent siblings, then `core`, then `utils`. The contract\nis `exhaustive`, so any subpackage not named in the layers breaks it;\nnon-layer foundations (`__main__`, `__metadata__`, `_version`, `_c_extension`)\nare listed as exhaustive ignores.\n\n**Reason:** components are gated on toggles and meant to be independent — a\n`web -> gui` import is a latent bug against a sibling that may not be\ninstalled — and none of the existing tools enforce which module may import\nwhich. Sibling semantics give independence, layer order gives layering, and a\nseparate `cli` layer captures its legitimate lazy-import orchestration without\nignore rules. Exhaustiveness closes the gap that motivated the tool: coding\nagents and hurried humans add a top-level package (`data/`, `marketplace/`)\nthat an unlisted-is-unconstrained contract ignored; prose in the agent\ninstructions does not hold, a failing style run does. `utils` below `core`\nmatches current reality and the conventional leaf-helpers model.\n\n**Rejected alternative:** separate `independence` plus `layers` contracts —\nredundant, and `independence` is degenerate with zero or one component, whereas\nthe single contract degrades to a valid `core > utils`.\n\n**Consequence:** the contract is Jinja-conditional on enabled components, so a\ncomponent's coverage is exercised only when it is generated; the one boundary\nit cannot forbid (`cli` importing MCP or worker) is harmless because `cli`\nlegitimately sits on top.", "reason": "components are gated on toggles and meant to be independent — a\n`web -> gui` import is a latent bug against a sibling that may not be\ninstalled — and none of the existing tools enforce which module may import\nwhich. Sibling semantics give independence, layer order gives layering, and a\nseparate `cli` layer captures its legitimate lazy-import orchestration without\nignore rules. Exhaustiveness closes the gap that motivated the tool: coding\nagents and hurried humans add a top-level package (`data/`, `marketplace/`)\nthat an unlisted-is-unconstrained contract ignored; prose in the agent\ninstructions does not hold, a failing style run does. `utils` below `core`\nmatches current reality and the conventional leaf-helpers model.", "rejected": ["separate `independence` plus `layers` contracts —\nredundant, and `independence` is degenerate with zero or one component, whereas\nthe single contract degrades to a valid `core > utils`."], "consequence": "the contract is Jinja-conditional on enabled components, so a\ncomponent's coverage is exercised only when it is generated; the one boundary\nit cannot forbid (`cli` importing MCP or worker) is harmless because `cli`\nlegitimately sits on top.", "considered": null, "why_open": null}, "refs": ["components.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "architecture-contracts.md#whole-program-analyzers-are-local-system-hooks-backed-by-the-style-group", "uuid": "41f3397d-1afb-4e57-a0bd-b5ef85089bfc", "file": "architecture-contracts.md", "line": 40, "end_line": 67, "title": "Whole-program analyzers are local system hooks backed by the `style` group", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-014 §4 (`docs/adr/014-import-linter-for-architecture-contracts.md`); the same delivery is recorded for basedpyright in ADR-005 and sphinx-lint in ADR-011", "verification": null, "revisit_when": "prek gains a way to run repo hooks with the project installed, or the fast gate becomes too slow", "see": [{"locator": "lint-orchestration.md#the-tox-style-env-is-the-sole-authoritative-lint-suite-prek-is-a-fast-gate-not-a-second-suite", "uuid": "9b74fc8b-a808-4f2b-bdbd-9e4253c1b35a", "date": "2026-10-11", "file": "lint-orchestration.md", "anchor": "the-tox-style-env-is-the-sole-authoritative-lint-suite-prek-is-a-fast-gate-not-a-second-suite", "remote": null}], "superseded_by": null, "body": {"text": "import-linter and slotscheck (like basedpyright, mypy and sphinx-lint) run on\nthe prek gate as `local` `language = \"system\"` hooks that shell through\n`uv run --locked --group style`, and in the tox `style` env from the same\ngroup. Neither uses the upstream repo hook the tool ships.\n\n**Reason:** both need the installed package and a whole-import-graph build\n(grimp) or an import of every module (slotscheck). prek runs a repo hook in its\nown isolated venv with only the hook's own deps, so the project is not\ninstalled there and the graph cannot be built. A local system hook sees the\nproject's real environment, uses the single `style` pin (no second `rev` for\nRenovate), and verified end-to-end that an injected upward import fails the\nhook. slotscheck is worth the fast gate because it checks a property nothing\nelse covers; the redundant type checkers `ty`/`pyrefly`/`zuban` stay\nstyle-env-only so five type checkers do not stack on every commit.\n\n**Rejected alternative:** style-env-only for import-linter — an earlier revision\nof the record, on the imprecise premise that prek cannot install the package;\ntrue of the isolated repo-hook pattern, not of the local system hook.", "reason": "both need the installed package and a whole-import-graph build\n(grimp) or an import of every module (slotscheck). prek runs a repo hook in its\nown isolated venv with only the hook's own deps, so the project is not\ninstalled there and the graph cannot be built. A local system hook sees the\nproject's real environment, uses the single `style` pin (no second `rev` for\nRenovate), and verified end-to-end that an injected upward import fails the\nhook. slotscheck is worth the fast gate because it checks a property nothing\nelse covers; the redundant type checkers `ty`/`pyrefly`/`zuban` stay\nstyle-env-only so five type checkers do not stack on every commit.", "rejected": ["style-env-only for import-linter — an earlier revision\nof the record, on the imprecise premise that prek cannot install the package;\ntrue of the isolated repo-hook pattern, not of the local system hook."], "consequence": null, "considered": null, "why_open": null}, "refs": ["lint-orchestration.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "ci-topology.md#network-dependent-checks-run-on-a-weekly-cron-never-in-the-merge-gate", "uuid": "3e5b9525-9087-4125-b19f-80f6c226c01f", "file": "ci-topology.md", "line": 3, "end_line": 27, "title": "Network-dependent checks run on a weekly cron, never in the merge gate", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "ADR-011 (`docs/adr/011-docs-linting-and-cross-platform-filename-safety.md`), ADR-012 §4 (`docs/adr/012-cobo-for-gitignore-generation.md`), ADR-031 §3 (`docs/adr/031-single-render-entrypoint.md`); the same posture is cited for `check-security.yml`'s periodic scans", "verification": null, "revisit_when": "a network-dependent check becomes reliable enough to block, or the merge gate gains a retry mechanism", "see": [], "superseded_by": null, "body": {"text": "Checks whose outcome depends on the network or on an upstream that can change\nwithout a commit here — docs link checking, the cobo gitignore drift check, the\ntemplate's generated-artifact drift check — run on a weekly `schedule` plus\n`workflow_dispatch`, never on `pull_request`, and never join the `check`\naggregation. They surface rot as a visible, non-blocking workflow result; a tox\nenv or mise task lets a maintainer run each on demand.\n\n**Reason:** a transient 5xx, a rate limit, a site blocking CI, or an upstream\nboilerplate update must never block an unrelated merge. A weekly signal is the\nright cadence for drift that accumulates slowly, and a PR-time check cannot see\ndrift caused by something that changed underneath the repository.\n\n**Rejected alternative:** run them on pull requests — flaky red checks on\nunrelated changes.", "reason": "a transient 5xx, a rate limit, a site blocking CI, or an upstream\nboilerplate update must never block an unrelated merge. A weekly signal is the\nright cadence for drift that accumulates slowly, and a PR-time check cannot see\ndrift caused by something that changed underneath the repository.", "rejected": ["run them on pull requests — flaky red checks on\nunrelated changes."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "ci-topology.md#a-single-union-coverage-gate-across-the-whole-matrix", "uuid": "ca90a48d-f648-40b3-ae1a-05f9f21cf411", "file": "ci-topology.md", "line": 28, "end_line": 54, "title": "A single union coverage gate across the whole matrix", "type": ["decision"], "status": "superseded", "evidence": "confirmed", "source": "ADR-026 §1 (`docs/adr/026-combined-cross-matrix-coverage-and-tokenless-html-host.md`)", "verification": null, "revisit_when": null, "see": [{"locator": "testing-strategy.md#coverage-exclusions-are-per-site-pragmas-and-the-globs-must-match-the-installed-layout", "uuid": "68366ce3-cc8e-4720-aa91-5eb83aaf2e2d", "date": "2026-10-11", "file": "testing-strategy.md", "anchor": "coverage-exclusions-are-per-site-pragmas-and-the-globs-must-match-the-installed-layout", "remote": null}], "superseded_by": "467b6cc3-775b-4e4c-9a8e-b0d1c3d733ac", "body": {"text": "Each matrix cell combined its per-interpreter data, kept a non-gating report,\nand uploaded a per-OS artifact; one `coverage-combine` job (today's\n`coverage-report`) merged every cell\nand was the only place `fail_under = 99` was enforced, measuring the union of\nall OS and interpreter cells. `relative_files = true` made data from different\nrunners mergeable, complementing the `src`/`site-packages` path remap. The\ncombined XML became the one Codecov upload.\n\n**Reason:** per-cell gating measured each OS alone, so a line covered on Linux\nbut gated off on Windows was reported inconsistently, and there was no\nauthoritative cross-fan-out number. The union is the correct scope. This held\nwhile the matrix was symmetric — every cell measured the same code.\n\n**Consequence:** once the CI job split into path-filtered per-component jobs, a\nskipped component dropped its subtree from the union and the single gate failed\non every partial PR; the principle survives per component in the successor.", "reason": "per-cell gating measured each OS alone, so a line covered on Linux\nbut gated off on Windows was reported inconsistently, and there was no\nauthoritative cross-fan-out number. The union is the correct scope. This held\nwhile the matrix was symmetric — every cell measured the same code.", "rejected": [], "consequence": "once the CI job split into path-filtered per-component jobs, a\nskipped component dropped its subtree from the union and the single gate failed\non every partial PR; the principle survives per component in the successor.", "considered": null, "why_open": null}, "refs": ["testing-strategy.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-12", "commit": "875a972"}, "status_history": [{"status": "superseded", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "ci-topology.md#a-tokenless-public-html-coverage-mirror-via-smokeshow", "uuid": "21119a10-df03-494b-ac84-a57b9b1832c2", "file": "ci-topology.md", "line": 55, "end_line": 76, "title": "A tokenless public HTML coverage mirror via smokeshow", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-026 §2 (`docs/adr/026-combined-cross-matrix-coverage-and-tokenless-html-host.md`)", "verification": null, "revisit_when": "Codecov becomes tokenless for private repositories, or smokeshow changes its rate-limit model", "see": [{"locator": "external-integrations.md#a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "uuid": "392b6dcf-6e9d-441d-bf7b-64ba362578d7", "date": "2026-10-11", "file": "external-integrations.md", "anchor": "a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "remote": null}], "superseded_by": null, "body": {"text": "`include_smokeshow` (default off, `full` preset) adds a step that uploads the\nHTML report to an ephemeral public URL with no secret. It runs only on public\nrepositories, last in the coverage job, and is best-effort\n(`continue-on-error`).\n\n**Reason:** Codecov is opt-in and non-blocking, so a self-contained project had\nno hosted, browsable coverage report; smokeshow gives a public project one\nwithout an account. Its tokenless endpoint has low rate limits, so a transient\nfailure must neither fail the job that feeds the required `check` gate nor\nabort the authoritative Codecov upload; a private report must never be\npublished.", "reason": "Codecov is opt-in and non-blocking, so a self-contained project had\nno hosted, browsable coverage report; smokeshow gives a public project one\nwithout an account. Its tokenless endpoint has low rate limits, so a transient\nfailure must neither fail the job that feeds the required `check` gate nor\nabort the authoritative Codecov upload; a private report must never be\npublished.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": ["external-integrations.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "ci-topology.md#per-component-markers-path-filtered-jobs-and-one-coverage-gate-per-component", "uuid": "467b6cc3-775b-4e4c-9a8e-b0d1c3d733ac", "file": "ci-topology.md", "line": 77, "end_line": 118, "title": "Per-component markers, path-filtered jobs, and one coverage gate per component", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-028 (`docs/adr/028-per-component-markers-and-path-filtered-ci.md`)", "verification": null, "revisit_when": "a component gains a dependency on another component's tree, or the aggregation action changes how it treats skipped jobs", "see": [{"locator": "ci-topology.md#a-single-union-coverage-gate-across-the-whole-matrix", "uuid": "ca90a48d-f648-40b3-ae1a-05f9f21cf411", "date": "2026-10-11", "file": "ci-topology.md", "anchor": "a-single-union-coverage-gate-across-the-whole-matrix", "remote": null}, {"locator": "architecture-contracts.md#one-exhaustive-import-linter-layers-contract-cli-above-independent-components-above-core-above-utils", "uuid": "3b7cdbee-7c66-4e52-9d7e-8ab0ffe32e56", "date": "2026-10-11", "file": "architecture-contracts.md", "anchor": "one-exhaustive-import-linter-layers-contract-cli-above-independent-components-above-core-above-utils", "remote": null}], "superseded_by": null, "body": {"text": "One pytest marker per enabled component plus `core`, applied automatically by a\nroot `conftest.py` hook from each test's top-level `tests/<dir>/`. A\n`changes` path-filter job emits one boolean per component plus `core`; the\nmonolithic CI job splits into `test-core` (always) and `test-<component>` jobs\ngated on their own filter or `core`. Each `coverage-<component>` job merges\nthat component's OS cells and enforces `fail_under = 99` scoped to its subtree\nvia `--include`; `coverage-core` uses `--omit` of every component and re-adds\n`*/_version.py` because a CLI `--omit` overrides the pyproject one. A\nnon-gating `coverage-report` job merges what ran, omitting skipped components so\ntheir unexecuted files are not reported at zero, and publishes to Codecov,\nsmokeshow and SonarCloud. The `check` gate lists every path-gated job as an\nallowed skip. The default `tox run` is unchanged.\n\n**Reason:** every component's suite ran on every OS for a one-line change in\nanother component, and a contributor had no knob to run only one component.\n`core` is the escape hatch — it watches dependencies, the shared `core/` tree,\nroot modules and root tests, so a change underpinning every component forces\nthe full fan-out, mirroring the import layering. Per-component skipping is\nincompatible with a single union gate, so the gate is decomposed; skipping is\nsound because an unchanged subtree has nothing to regress. The cross-OS union\nis kept *within* a component, where a per-cell gate would wrongly fail on a\nplatform-gated branch. The aggregation action counts a skipped job as a\nfailure unless named, hence the allowed-skips list rendered from the same\ncomponent list as `needs`.\n\n**Consequence:** a full run fans out to more jobs than before; the win is on\ncomponent-scoped PRs. `--include`/`--omit` patterns must match both the\neditable and installed layouts (`*/`-anchored) and are verifiable only through a\nreal `tox run`. Adding a component touches the marker list, the conftest\ndirectory set, the filters, two jobs and the omit list in lockstep.", "reason": "every component's suite ran on every OS for a one-line change in\nanother component, and a contributor had no knob to run only one component.\n`core` is the escape hatch — it watches dependencies, the shared `core/` tree,\nroot modules and root tests, so a change underpinning every component forces\nthe full fan-out, mirroring the import layering. Per-component skipping is\nincompatible with a single union gate, so the gate is decomposed; skipping is\nsound because an unchanged subtree has nothing to regress. The cross-OS union\nis kept *within* a component, where a per-cell gate would wrongly fail on a\nplatform-gated branch. The aggregation action counts a skipped job as a\nfailure unless named, hence the allowed-skips list rendered from the same\ncomponent list as `needs`.", "rejected": [], "consequence": "a full run fans out to more jobs than before; the win is on\ncomponent-scoped PRs. `--include`/`--omit` patterns must match both the\neditable and installed layouts (`*/`-anchored) and are verifiable only through a\nreal `tox run`. Adding a component touches the marker list, the conftest\ndirectory set, the filters, two jobs and the omit list in lockstep.", "considered": null, "why_open": null}, "refs": ["architecture-contracts.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, " xt": "Every job in `ci.yml` carries the falsy-safe condition that the pull request is\nnot a draft, composed with existing conditions rather than replacing them\n(`check` keeps `always()`, SonarCloud its fork guard, component jobs their\nchange filters). The `pull_request` trigger explicitly includes\n`ready_for_review`. Security and docs-preview workflows still run on drafts.\n\n**Reason:** drafts paid for the whole fan-out before review. `!= true` keeps\nrunning on push and manual events where the pull-request object is absent,\nunlike `== false`. Without `ready_for_review`, a PR opened as a draft could\nstay permanently skipped after becoming reviewable. Draft PRs skip `check`\nitself, so they need no allowed-skip entry.", "reason": "drafts paid for the whole fan-out before review. `!= true` keeps\nrunning on push and manual events where the pull-request object is absent,\nunlike `== false`. Without `ready_for_review`, a PR opened as a draft could\nstay permanently skipped after becoming reviewable. Draft PRs skip `check`\nitself, so they need no allowed-skip entry.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "companion-skills.md#every-lifecycle-skill-ships-through-the-template", "uuid": "e4cd1c46-28c3-4241-82c8-d5aac41c293f", "file": "companion-skills.md", "line": 3, "end_line": 37, "title": "Every lifecycle skill ships through the template", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "maintainer decision, 2026-10-12", "verification": null, "revisit_when": "adoption requires executable guidance before a recoverable scaffold can be a maintainer has not ruled on it."], "consequence": "a project older than v1.6.0 has no update skill for the one\nupdate that brings `template-adoption` in.", "considered": null, "why_open": null}, "refs": ["repo-setup.md"], "git": {"created": null, "last_touched": {"author": "Hasan Sezer Taşan", "date": "2026-10-12", "commit": "1b2b897"}, "status_history": [{"status": "superseded", "author": "Hasan Sezer Taşan", "date": "2026-10-12", "commit": "1b2b897"}]}, "findings": []}, {"id": "components.md#secondary-components-are-subcommands-of-one-console-root-not-separate-scripts", "uuid": "3d60ab14-8ff9-47db-b326-d7e82947a6cf", "file": "components.md", "line": 3, "end_line": 42, "title": "Secondary components are subcommands of one console root, not separate scripts", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-019 (`docs/adr/019-components-as-cli-subcommands.md`), including its 2026-09 amendment; issue #203", "verification": null, "revisit_when": "a new kind of runnable component is added, or `typer` becomes unacceptable on the minimal launcher", "see": [{"locator": "architecture-contracts.md#one-exhaustive-import-linter-layers-contract-cli-above-independent-components-above-core-above-utils", "uuid": "3b7cdbee-7c66-4e52-9d7e-8ab0ffe32e56", "date": "2026-10-11", "file": "architecture-contracts.md", "anchor": "one-exhaustive-import-linter-layers-contract-cli-above-independent-components-above-core-above-utils", "remote": null}, {"locator": "components.md#the-web-component-gets-run-and-dev-launch-verbs-and-therefore-always-a-console-root", "uuid": "3daefc4a-ee36-44cb-b137-bc9224f2a262", "date": "2026-10-11", "file": "components.md", "anchor": "the-web-component-gets-run-and-dev-launch-verbs-and-therefore-always-a-console-root", "remote": null}], "superseded_by": null, "body": {"text": "The highest-precedence enabled component (CLI > GUI > TUI > web > MCP > worker,\nspelled once as `primary_component` in `copier.yml`) owns the bare `<pkg>`\ncommand. Every other enabled component is a lazily imported subcommand\n(`interactive`, `gui`, `web`, `mcp`, `worker`); no `<pkg>-<name>` console\nscript is emitted. A root exists only where it buys something, captured by the\nhidden `include_console_root`: with `include_cli`, with web, or with two or more\ncomponents. With no root, bare `<pkg>` dispatches to the sole component from\n`__main__`. GUI uses `[project.gui-scripts]` only as the sole runnable\ncomponent; a GUI primary sharing a root gets a normal console script.\n\n**Reason:** a multi-component project installed four or five sibling\nexecutables, a separate script is invisible until you know its name, and the\nCLI already exposed `interactive`/`gui`/`web` subcommands beside their suffixed\nscripts while MCP and worker had none. A windowless launcher as the shared root\nwould swallow console I/O and `--help` of the subcommands on Windows. One\ncomputed variable is the single source for the `cli/` package, the `typer`\ndependency, the import-linter orchestrator layer and the `__main__` branch, so\n`typer` stays off a single-component non-CLI app.\n\n**Rejected alternative:** a universal root for every app — forces `typer` onto\nsingle-component non-CLI apps and dilutes what `include_cli` means.\n\n**Rejected alternative:** keep suffixed scripts when no CLI is present — leaves\nthe PATH and discoverability problem for non-CLI multi-component apps.\n\n**Consequence:** the package directory is named `cli/` even in a launcher-only\nproject; adopters updating lose the suffixed scripts and switch wrappers to the\nsubcommand form.", "reason": "a multi-component project installed four or five sibling\nexecutables, a separate script is invisible until you know its name, and the\nCLI already exposed `interactive`/`gui`/`web` subcommands beside their suffixed\nscripts while MCP and worker had none. A windowless launcher as the shared root\nwould swallow console I/O and `--help` of the subcommands on Windows. One\ncomputed variable is the single source for the `cli/` package, the `typer`\ndependency, the import-linter orchestrator layer and the `__main__` branch, so\n`typer` stays off a single-component non-CLI app.", "rejected": ["a universal root for every app — forces `typer` onto\nsingle-component non-CLI apps and dilutes what `include_cli` means.", "keep suffixed scripts when no CLI is present — leaves\nthe PATH and discoverability problem for non-CLI multi-component apps."], "consequence": "the package directory is named `cli/` even in a launcher-only\nproject; adopters updating lose the suffixed scripts and switch wrappers to the\nsubcommand form.", "considered": null, "why_open": null}, "refs": ["architecture-contracts.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "components.md#cli-framework-offers-argparse-beside-typer-the-typer-dependency-is-gated-on-root-uses-typer", "uuid": "de9f8183-4328-4678-8611-5e715cffd70d", "file": "components.md", "line": 43, "end_line": 78, "title": "`cli_framework` offers argparse beside Typer; the Typer dependency is gated on `root_uses_typer`", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-020 (`docs/adr/020-cli-framework-choice.md`); [issue #205](https://github.com/hasansezertasan/copier-pyproject/issues/205)", "verification": null, "revisit_when": "demand appears for click as a third choice, or a no-CLI launcher needs to be framework-free", "see": [{"locator": "components.md#secondary-components-are-subcommands-of-one-console-root-not-separate-scripts", "uuid": "3d60ab14-8ff9-47db-b326-d7e82947a6cf", "date": "2026-10-11", "file": "components.md", "anchor": "secondary-components-are-subcommands-of-one-console-root-not-separate-scripts", "remote": null}, {"locator": "package-distribution.md#homebrew-and-scoop-are-opt-in-dispatches-the-tap-or-bucket-owns-the-manifest-logic", "uuid": "462ac46c-c9db-4a4a-b8ae-bbe5c14af09f", "date": "2026-10-11", "file": "package-distribution.md", "anchor": "homebrew-and-scoop-are-opt-in-dispatches-the-tap-or-bucket-owns-the-manifest-logic", "remote": null}], "superseded_by": null, "body": {"text": "A `cli_framework` sub-question (`typer` default, `argparse`), asked only with\n`include_cli`, mirrors `web_framework`. The argparse root is standard-library\nonly and contract-equivalent: same `version`/`info` commands, same lazily\nimported component subcommands, help on no arguments, non-zero exit on missing\nmetadata. A no-CLI launcher keeps the Typer root. The `typer` entry in\n`dependencies` and the `cli/app.py` branch both read one hidden\n`root_uses_typer` variable.\n\n**Reason:** `include_cli` was hardwired to Typer, so a genuine command-line\ntool that wanted no framework had no supported path to `is_app` and therefore\nnone to Homebrew/Scoop packaging; forcing toggles via `--data` did not persist.\nThe dependency is gated on `root_uses_typer` rather than on the framework\nanswer because Copier retains unasked answers: a project that set\n`argparse`, then turned the CLI off while keeping two components, carries the\nstored answer forward while rendering the Typer root — a launcher importing\n`typer` without declaring it, broken even in a synced environment. An earlier\nrevision of the record claimed the simpler guard was correct in every case; it\nwas not.\n\n**Rejected alternative:** widen the `is_app` gate for libraries — a framework-free\nCLI is made a first-class way to *be* an app instead.\n\n**Rejected alternative:** click as a third choice — a dependency without Typer's\nergonomics; earns its keep only on later demand.", "reason": "`include_cli` was hardwired to Typer, so a genuine command-line\ntool that wanted no framework had no supported path to `is_app` and therefore\nnone to Homebrew/Scoop packaging; forcing toggles via `--data` did not persist.\nThe dependency is gated on `root_uses_typer` rather than on the framework\nanswer because Copier retains unasked answers: a project that set\n`argparse`, then turned the CLI off while keeping two components, carries the\nstored answer forward while rendering the Typer root — a launcher importing\n`typer` without declaring it, broken even in a synced environment. An earlier\nrevision of the record claimed the simpler guard was correct in every case; it\nwas not.", "rejected": ["widen the `is_app` gate for libraries — a framework-free\nCLI is made a first-class way to *be* an app instead.", "click as a third choice — a dependency without Typer's\nergonomics; earns its keep only on later demand."], "consequence": null, "considered": null, "why_open": null}, "refs": ["package-distribution.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "components.md#launcher-imports-are-guarded-with-exact-match-preflighted-dependency-errors", "uuid": "70e54068-d43c-40a2-9097-95e7cc14c668", "file": "components.md", "line": 79, "end_line": 125, "title": "Launcher imports are guarded with exact-match, preflighted dependency errors", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-028 (`docs/adr/028-actionable-component-dependency-guard.md`); issues #172 and #268", "verification": null, "revisit_when": "generated projects gain per-component extras, or a dependency stops importing lazily after the guarded block", "see": [{"locator": "components.md#secondary-components-are-subcommands-of-one-console-root-not-separate-scripts", "uuid": "3d60ab14-8ff9-47db-b326-d7e82947a6cf", "date": "2026-10-11", "file": "components.md", "anchor": "secondary-components-are-subcommands-of-one-console-root-not-separate-scripts", "remote": null}, {"locator": "components.md#component-dependencies-are-core-dependencies-there-is-no-empty-all-extra", "uuid": "e9b25624-f621-4071-bd99-a7cde620189a", "date": "2026-10-11", "file": "components.md", "anchor": "component-dependencies-are-core-dependencies-there-is-no-empty-all-extra", "remote": null}], "superseded_by": null, "body": {"text": "Each launcher's lazy import is wrapped in a context manager that turns a\n`ModuleNotFoundError` whose name is *exactly* one of the component's declared\ndependency modules into an exit-1 message naming the component, the module and\nthe fix (`uv sync`). Dependencies that import late (uvicorn, Tkinter, textual)\nor re-export behind their own guard with no module name (faststream brokers,\nmcp's transitive imports) are imported eagerly inside the block by a preflight\nthat re-raises with the caller-supplied name. Tkinter gets a system-package\nhint (including a version-qualified Homebrew formula) because it is not a\ndistribution. The root's own module-scope imports (`typer`, pydantic via the\nsettings stack) and the sole-component entrypoint in `__main__.py` get the same\ntreatment; all derived facts are `when: false` computed variables in\n`copier.yml`.\n\n**Reason:** there are no extras to name — component deps are core dependencies —\nso a missing module means the environment is out of sync with the metadata and\n`uv sync` is the honest remedy. The first-party import always succeeds after a\n`copier update`; the third-party failure happens one frame deeper, so the guard\nmust classify what comes out of the import rather than replace it. Exact\nmatching protects application defects (a typo'd import below an installed\ndependency) from being mislabelled as a stale environment. The sole-component\nentrypoint is what frozen binaries target, whose user has no CLI to fall back\non. Shared computed variables matter most for the two guards rendered into\ndifferent files, only one of which exists in any project.\n\n**Rejected alternative:** a shared `require(module, feature, extra)` helper as\nthe issue proposed — no extra exists, and replacing the first-party import would\nnot catch the deeper failure.\n\n**Rejected alternative:** guard every component's module scope so direct library\nimports also get the message — the reader is already in a traceback in their\nown code, the guard would run on every successful import forever, and component\nmodules are what adopters edit most.\n\n**Rejected alternative:** let faststream's own `ImportError` through — its advice\n(`pip install \"faststream[<broker>]\"`) bypasses the lockfile.", "reason": "there are no extras to name — component deps are core dependencies —\nso a missing module means the environment is out of sync with the metadata and\n`uv sync` is the honest remedy. The first-party import always succeeds after a\n`copier update`; the third-party failure happens one frame deeper, so the guard\nmust classify what comes out of the import rather than replace it. Exact\nmatching protects application defects (a typo'd import below an installed\ndependency) from being mislabelled as a stale environment. The sole-component\nentrypoint is what frozen binaries target, whose user has no CLI to fall back\non. Shared computed variables matter most for the two guards rendered into\ndifferent files, only one of which exists in any project.", "rejected": ["a shared `require(module, feature, extra)` helper as\nthe issue proposed — no extra exists, and replacing the first-party import would\nnot catch the deeper failure.", "guard every component's module scope so direct library\nimports also get the message — the reader is already in a traceback in their\nown code, the guard would run on every successful import forever, and component\nmodules are what adopters edit most.", "let faststream's own `ImportError` through — its advice\n(`pip install \"faststream[<broker>]\"`) bypasses the lockfile."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "components.md#component-dependencies-are-core-dependencies-there-is-no-empty-all-extra", "uuid": "e9b25624-f621-4071-bd99-a7cde620189a", "file": "components.md", "line": 126, "end_line": 155, "title": "Component dependencies are core dependencies; there is no empty `all` extra", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "ADR-028 (`docs/adr/028-no-empty-all-extra.md`)", "verification": null, "revisit_when": "a component gains a genuinely optional dependency", "see": [], "superseded_by": null, "body": {"text": "Generated projects declare no `[project.optional-dependencies]` table. A\nrunnable component's runtime dependency goes into the core `dependencies` list\nunder its toggle guard. The permanently empty `all = []`, the `<pkg>[all]` dev\nself-reference, six `extras = [\"all\"]` tox settings and four `--extra all`\nworkflow flags were removed.\n\n**Reason:** a component is chosen at generation time and `__main__` imports it\nunconditionally, so a plain install must pull its dependency or the console\nscript fails at launch. The leftover shell installed nothing yet three\ndocuments cited it as load-bearing — a reader auditing the packaging would have\nconcluded the wrong thing about what guarantees what.\n\n**Rejected alternative:** keep `all = []` as a pre-wired seam for a future\noptional dependency — a one-time edit if ever needed is cheaper than a\npermanent misleading declaration.\n\n**Consequence:** adopters applying this update must re-lock, because the\nmetadata recorded in `uv.lock` changes and every `uv run --locked` hard-fails\nuntil they do; a hand-added `uv run --extra all` breaks.", "reason": "a component is chosen at generation time and `__main__` imports it\nunconditionally, so a plain install must pull its dependency or the console\nscript fails at launch. The leftover shell installed nothing yet three\ndocuments cited it as load-bearing — a reader auditing the packaging would have\nconcluded the wrong thing about what guarantees what.", "rejected": ["keep `all = []` as a pre-wired seam for a future\noptional dependency — a one-time edit if ever needed is cheaper than a\npermanent misleading declaration."], "consequence": "adopters applying this update must re-lock, because the\nmetadata recorded in `uv.lock` changes and every `uv run --locked` hard-fails\nuntil they do; a hand-added `uv run --extra all` breaks.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "components.md#the-web-component-gets-run-and-dev-launch-verbs-and-therefore-always-a-console-root", "uuid": "3daefc4a-ee36-44cb-b137-bc9224f2a262", "file": "components.md", "line": 156, "end_line": 198, "title": "The web component gets `run` and `dev` launch verbs, and therefore always a console root", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-032 (`docs/adr/032-uniform-run-dev-launch-verbs.md`); issue #177", "verification": null, "revisit_when": "FastStream's reload stops requiring its CLI extra, or a second component acquires a prod/dev distinction", "see": [{"locator": "components.md#secondary-components-are-subcommands-of-one-console-root-not-separate-scripts", "uuid": "3d60ab14-8ff9-47db-b326-d7e82947a6cf", "date": "2026-10-11", "file": "components.md", "anchor": "secondary-components-are-subcommands-of-one-console-root-not-separate-scripts", "remote": null}, {"locator": "components.md#launcher-imports-are-guarded-with-exact-match-preflighted-dependency-errors", "uuid": "70e54068-d43c-40a2-9097-95e7cc14c668", "date": "2026-10-11", "file": "components.md", "anchor": "launcher-imports-are-guarded-with-exact-match-preflighted-dependency-errors", "remote": null}], "superseded_by": null, "body": {"text": "`<pkg> run [module:attribute]` starts the web app on the configured bind;\n`<pkg> dev` adds autoreload and forces a loopback bind. Both share one private\nrunner and the dependency guard; `<pkg> web` stays as an alias where web is not\nprimary. The target is passed to uvicorn as an import string, validated for\nshape only — no module search, no framework sniffing. `include_console_root`\nnow includes `include_web`, so a web-only project reaches its component through\nthe minimal launcher.\n\n**Reason:** varying the app object or reload meant dropping to a different\nframework CLI per framework that the project's own help never mentioned.\nuvicorn is already a web runtime dependency and takes an import string with\nreload natively; the string form is the only one that can reload in a child\nprocess, so one code path serves both modes. A reloading server executes\nunreviewed code on every save and belongs on loopback. A web-only project had\nno root to hang a verb on, and standalone `<pkg>-run`/`<pkg>-dev` scripts are\nthe second entry scheme the subcommand decision exists to prevent.\n\n**Rejected alternative:** verbs for the worker too — reload needs\n`faststream[cli]` at runtime, which the template deliberately keeps out of\n`dependencies`, and type-sniffing the target is the framework detection avoided\nhere.\n\n**Rejected alternative:** replace `<pkg> web` with `<pkg> run` — breaks the one\nnaming rule the subcommand decision makes.\n\n**Rejected alternative:** let uvicorn parse the target — its error names no\nproject command and is not testable the way a cheap shape check is.\n\n**Consequence:** web-only Litestar projects gain `typer` (FastAPI already ships\nit); `sole_component` can never be `web`, so a web project's executable\nentrypoint is the console root.", "reason": "varying the app object or reload meant dropping to a different\nframework CLI per framework that the project's own help never mentioned.\nuvicorn is already a web runtime dependency and takes an import string with\nreload natively; the string form is the only one that can reload in a child\nprocess, so one code path serves both modes. A reloading server executes\nunreviewed code on every save and belongs on loopback. A web-only project had\nno root to hang a verb on, and standalone `<pkg>-run`/`<pkg>-dev` scripts are\nthe second entry scheme the subcommand decision exists to prevent.", "rejected": ["verbs for the worker too — reload needs\n`faststream[cli]` at runtime, which the template deliberately keeps out of\n`dependencies`, and type-sniffing the target is the framework detection avoided\nhere.", "replace `<pkg> web` with `<pkg> run` — breaks the one\nnaming rule the subcommand decision makes.", "let uvicorn parse the target — its error names no\nproject command and is not testable the way a cheap shape check is."], "consequence": "web-only Litestar projects gain `typer` (FastAPI already ships\nit); `sole_component` can never be `web`, so a web project's executable\nentrypoint is the console root.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "components.md#one-application-payload-in-core-app-py-components-are-adapters-over-it", "uuid": "8bb1e55e-f468-44fc-80a5-d3b3719e5ddc", "file": "components.md", "line": 199, "end_line": 239, "title": "One application payload in `core/app.py`; components are adapters over it", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-033 (`docs/adr/033-shared-app-service-components-as-adapters.md`); issues #178 and #321", "verification": null, "revisit_when": "a component needs a fourth failure behaviour, or a second provider of the payload appears", "see": [{"locator": "architecture-contracts.md#one-exhaustive-import-linter-layers-contract-cli-above-independent-components-above-core-above-utils", "uuid": "3b7cdbee-7c66-4e52-9d7e-8ab0ffe32e56", "date": "2026-10-11", "file": "architecture-contracts.md", "anchor": "one-exhaustive-import-linter-layers-contract-cli-above-independent-components-above-core-above-utils", "remote": null}, {"locator": "template-updates.md#retired-template-modules-become-adopter-owned", "uuid": "4dd6729a-697e-4588-a7a7-d37152018b6b", "date": "2026-10-11", "file": "template-updates.md", "anchor": "retired-template-modules-become-adopter-owned", "remote": null}], "superseded_by": null, "body": {"text": "`core/app.py` exposes three functions — `version()` and `info()`, which raise\n`MetadataUnavailableError`, and `info_or_unknown()`, which degrades, logs and\nnever raises — plus the error type and an unknown-version constant. Each\ncomponent imports the module as `service` and adapts: the CLI exits 1, the web\napp answers 503, the MCP tool returns error text, GUI and TUI show \"unknown\",\nthe worker falls back to `0.0.0`. The module renders only when a runnable\ncomponent is enabled. One `missing_metadata` fixture patching\n`core.app.Distribution` replaces six per-module stubs.\n\n**Reason:** a `full` project carried eight copies of the distribution lookup\nand six of the platform payload, with nothing enforcing agreement — GUI and TUI\nnearly drifted on field names and fatality. The import contract forbids\ncomponents importing each other, so sharing had to live below them, and `core`\nis already that layer. Functions rather than a class because it would hold no\nstate and ruff's no-self-use rule flags exactly that shape; no Protocol because\nit would have one implementation and no type-checking caller. Three functions\nbecause there are three real behaviours, each with more than one caller.\nLogging stays in the adapters because it genuinely differs; the worker's wire\nmodel keeps its own platform fields because routing them through a dict adds\nindirection for no sharing.\n\n**Rejected alternative:** a new `base/` package with an `AppService` class and\na `VersionProvider` protocol, as proposed — each adds a name without adding a\nconstraint.\n\n**Rejected alternative:** a transport/presentation split per component — more\nfiles than the three f-strings they would hold.\n\n**Rejected alternative:** keep the copies and add a conformance test — tells you\nthey drifted after the sixth copy is written; removing them means they cannot.", "reason": "a `full` project carried eight copies of the distribution lookup\nand six of the platform payload, with nothing enforcing agreement — GUI and TUI\nnearly drifted on field names and fatality. The import contract forbids\ncomponents importing each other, so sharing had to live below them, and `core`\nis already that layer. Functions rather than a class because it would hold no\nstate and ruff's no-self-use rule flags exactly that shape; no Protocol because\nit would have one implementation and no type-checking caller. Three functions\nbecause there are three real behaviours, each with more than one caller.\nLogging stays in the adapters because it genuinely differs; the worker's wire\nmodel keeps its own platform fields because routing them through a dict adds\nindirection for no sharing.", "rejected": ["a new `base/` package with an `AppService` class and\na `VersionProvider` protocol, as proposed — each adds a name without adding a\nconstraint.", "a transport/presentation split per component — more\nfiles than the three f-strings they would hold.", "keep the copies and add a conformance test — tells you\nthey drifted after the sixth copy is written; removing them means they cannot."], "consequence": null, "considered": null, "why_open": null}, "refs": ["architecture-contracts.md", "template-updates.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-stack.md#sphinx-with-the-bare-shibuya-theme-replaces-mkdocs", "uuid": "5133caa8-3231-4d4d-877b-041b315cb87a", "file": "docs-stack.md", "line": 3, "end_line": 37, "title": "Sphinx with the bare Shibuya theme replaces MkDocs", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-006 (`docs/adr/006-sphinx-shibuya-for-documentation.md`)", "verification": null, "revisit_when": "Shibuya stops being published on PyPI, or the Litestar-org reference sites change stack", "see": [], "superseded_by": null, "body": {"text": "Generated projects document with Sphinx, the `shibuya` theme from PyPI,\nreStructuredText sources (MyST enabled for Markdown pages), autodoc plus\nnapoleon for the API reference, and a set of extensions matching the Litestar\norganization's sites. Docs builds install the package, not only the docs group.\nPublishing still goes through the `gh-pages` branch, so no Pages setting\nchanged.\n\n**Reason:** the MkDocs 2.0 line was unstable and pinning 1.x indefinitely was a\ndead end; the shipped MkDocs setup installed `mkdocs-material` without\nconfiguring it and hand-maintained an API page that did not track the code.\nThe visual target (Litestar, Advanced Alchemy, Polyfactory) turned out to be\nSphinx plus Shibuya, so adopting that stack is the direct path. Autodoc must\nimport the package and the modules' dependencies, hence the package install.\n\n**Rejected alternative:** `litestar-sphinx-theme` — Shibuya plus Litestar\nbranding, distributed as a git dependency; wrong for a generic template.\n\n**Rejected alternative:** `sphinxcontrib-typer` for the CLI reference — works,\nbut generating the page from the live app at build time keeps the CLI uniform\nwith the worker and web generators and adds no extension; `sphinx-click` is\nunusable because Typer vendors its own Click.\n\n**Consequence:** the `--unsafe` YAML-check flag that existed only for\n`mkdocs.yml` was dropped; `conf.py` gets a ruff per-file ignore; a duplicate\ndocstring autodoc surfaced and was removed.", "reason": "the MkDocs 2.0 line was unstable and pinning 1.x indefinitely was a\ndead end; the shipped MkDocs setup installed `mkdocs-material` without\nconfiguring it and hand-maintained an API page that did not track the code.\nThe visual target (Litestar, Advanced Alchemy, Polyfactory) turned out to be\nSphinx plus Shibuya, so adopting that stack is the direct path. Autodoc must\nimport the package and the modules' dependencies, hence the package install.", "rejected": ["`litestar-sphinx-theme` — Shibuya plus Litestar\nbranding, distributed as a git dependency; wrong for a generic template.", "`sphinxcontrib-typer` for the CLI reference — works,\nbut generating the page from the live app at build time keeps the CLI uniform\nwith the worker and web generators and adds no extension; `sphinx-click` is\nunusable because Typer vendors its own Click."], "consequence": "the `--unsafe` YAML-check flag that existed only for\n`mkdocs.yml` was dropped; `conf.py` gets a ruff per-file ignore; a duplicate\ndocstring autodoc surfaced and was removed.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "docs-stack.md#pr-docs-previews-deploy-to-a-subfolder-of-the-project-s-own-gh-pages-same-repo-only", "uuid": "55a74975-a6e0-4f18-8254-fa27f047e829", "file": "docs-stack.md", "line": 38, "end_line": 71, "title": "PR docs previews deploy to a subfolder of the project's own `gh-pages`, same-repo only", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-010 §1 (`docs/adr/010-pr-docs-previews-and-released-issue-notifications.md`)", "verification": null, "revisit_when": "the preview action ships fork support, or previews need to block merges", "see": [{"locator": "external-integrations.md#a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "uuid": "392b6dcf-6e9d-441d-bf7b-64ba362578d7", "date": "2026-10-11", "file": "external-integrations.md", "anchor": "a-freshly-generated-project-is-green-on-first-push-with-zero-external-accounts", "remote": null}, {"locator": "docs-versioning.md#docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages", "uuid": "858025c1-19a6-46f6-a237-01ba6477262a", "date": "2026-10-11", "file": "docs-versioning.md", "anchor": "docs-publish-only-the-current-version-and-carry-older-built-versions-forward-from-gh-pages", "remote": null}], "superseded_by": null, "body": {"text": "A single-job `docs-preview.yml` on `pull_request` builds the Sphinx HTML and\nhands deploy, removal on close and a sticky comment to a purpose-built action,\npublishing under `pr-preview/pr-<N>/` on the project's own `gh-pages`. It runs\nonly when the head repository is the repository itself; fork PRs skip cleanly.\nIt renders only when `include_docs` is on (ADR-025) and is not in the `check`\ngate.\n\n**Reason:** the upstream pattern deployed to a separate repository with a\nGitHub App token — a second repo and App to provision. Same-repo `pull_request`\ncarries a write token and needs no dangerous-triggers ignore because untrusted\nfork code never runs with write access; for a solo-maintainer template,\nsame-repo branches are the common case. Removing a subfolder on close and\nmaintaining a comment would otherwise mean hand-rolled git on `gh-pages`,\nexactly the surface the released-docs deploy moved away from. A bare artifact\nhas no live URL, which is the whole value.\n\n**Rejected alternative:** a `workflow_run`/`pull_request_target` split for fork\ncoverage — deferred until the action supports forks.\n\n**Consequence:** the released-docs deploys exclude `pr-preview/**` from\ncleaning and merge rather than force-push, so previews survive a release and a\nracing deploy cannot overwrite them.", "reason": "the upstream pattern deployed to a separate repository with a\nGitHub App token — a second repo and App to provision. Same-repo `pull_request`\ncarries a write token and needs no dangerous-triggers ignore because untrusted\nfork code never runs with write access; for a solo-maintainer template,\nsame-repo branches are the common case. Removing a subfolder on close and\nmaintaining a comment would otherwise mean hand-rolled git on `gh-pages`,\nexactly the surface the released-docs deploy moved away from. A bare artifact\nhas no live URL, which is the whole value.", "rejected": ["a `workflow_run`/`pull_request_target` split for fork\ncoverage — deferred until the action supports forks."], "consequence": "the released-docs deploys exclude `pr-preview/**` from\ncleaning and merge rather than force-push, so previews survive a release and a\nracing deploy cannot overwrite them.", "considered"
