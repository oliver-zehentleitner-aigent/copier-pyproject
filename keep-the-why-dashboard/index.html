` covered one option set when a human\nremembered. A Jinja mistake emitting malformed YAML in a conditional file, or a\nwhitespace regression in a guarded block, merged green. Rendering without\ninstalling is fast enough to fan out; `pyproject.toml` carries pins that move\non every update, so a broad golden set would be churn without coverage.\n\n**Rejected alternative:** `pytest-copie` — a terser fixture that does not earn a\nsecond dependency beyond copier.\n\n**Rejected alternative:** only generate-and-run — proves the project works but\nis slow and heavy; \"renders and is structurally valid\" is a strictly weaker,\nfar cheaper property, so the two layers stay separate.\n\n**Consequence:** an intentional change to the two golden artifacts needs a\nregeneration and a reviewed diff.", "reason": "the template's correctness across presets and toggle combinations\nhad no automated guard — `example/` covered one option set when a human\nremembered. A Jinja mistake emitting malformed YAML in a conditional file, or a\nwhitespace regression in a guarded block, merged green. Rendering without\ninstalling is fast enough to fan out; `pyproject.toml` carries pins that move\non every update, so a broad golden set would be churn without coverage.", "rejected": ["`pytest-copie` — a terser fixture that does not earn a\nsecond dependency beyond copier.", "only generate-and-run — proves the project works but\nis slow and heavy; \"renders and is structurally valid\" is a strictly weaker,\nfar cheaper property, so the two layers stay separate."], "consequence": "an intentional change to the two golden artifacts needs a\nregeneration and a reviewed diff.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-testing.md#generated-files-must-be-formatter-canonical-not-merely-valid", "uuid": "9b931598-7e52-4ff1-bb07-ef65c01d5369", "file": "template-testing.md", "line": 37, "end_line": 80, "title": "Generated files must be formatter-canonical, not merely valid", "type": ["decision", "constraint", "incident"], "status": "active", "evidence": "confirmed", "source": "ADR-030 (`docs/adr/030-generated-files-must-be-formatter-canonical.md`); [issue #213](https://github.com/hasansezertasan/copier-pyproject/issues/213)", "verification": null, "revisit_when": "yamlfmt or taplo change the semantics of the pinned non-default knobs, or the generated project's formatter set changes", "see": [{"locator": "template-testing.md#render-and-inspect-is-the-fast-matrixed-layer-generate-and-run-stays-separate", "uuid": "c9bcdf52-af5d-4438-9c9f-d55e8226812c", "date": "2026-10-11", "file": "template-testing.md", "anchor": "render-and-inspect-is-the-fast-matrixed-layer-generate-and-run-stays-separate", "remote": null}], "superseded_by": null, "body": {"text": "A generated file must already be in the exact byte form the generated project's\nown formatters produce — yamlfmt, ruff-format, the prek builtins and taplo.\nThree things follow: formatter config is chosen so the hand-written layout is\ncanonical (`retain_line_breaks_single` for yamlfmt; no array auto-expand,\nauto-collapse or comment alignment for taplo; no yamlfmt `max_line_length`);\ntemplate sources are written in that form (one-line folded scalars, no comment\ntrailing a sequence, TOML arrays one-per-line with trailing comma, Jinja\nwhitespace control so no conditional leaves more than two blank lines or one at\nEOF, literal UTF-8 author tokens instead of `tojson`); and taplo runs in strict\ncheck mode. `template-ci.yml`'s render job runs the rendered project's own\nfixing hooks per scenario and gates on `git diff`, with an `integrations`\nscenario and a non-ASCII author name covering toggles nothing else rendered.\n\n**Reason:** on a pristine scaffold the first hook run rewrote two workflow files\nand taplo rewrote two TOML files while exiting 0, so the adopter's `hooks` CI\nfailed and every later `copier update` showed drift they never caused. Nothing\ncaught it because this repo ran only checking tools over a render and the\nharness asserts YAML parses, not that it is canonical; taplo's fix mode made the\ndefect invisible. Width-driven reflow would make a file's canonical form depend\non which components are enabled, and comment alignment would let a Renovate\nbump break a line nothing touched. The diff, not hook exit codes, is the gate\nbecause a fixing hook that rewrites and exits 0 sails through an exit-code\ncheck.\n\n**Rejected alternative:** chase the formatters' output in the templates — the\nconfig is pinned to make the written layout canonical instead.\n\n**Consequence:** hand-aligned trailing comments and hand-wrapped folded scalars\nare unavailable; a conditional block in rendered YAML/TOML requires thinking\nabout whitespace control; the pinned knobs fail loudly if a release changes\nthem.", "reason": "on a pristine scaffold the first hook run rewrote two workflow files\nand taplo rewrote two TOML files while exiting 0, so the adopter's `hooks` CI\nfailed and every later `copier update` showed drift they never caused. Nothing\ncaught it because this repo ran only checking tools over a render and the\nharness asserts YAML parses, not that it is canonical; taplo's fix mode made the\ndefect invisible. Width-driven reflow would make a file's canonical form depend\non which components are enabled, and comment alignment would let a Renovate\nbump break a line nothing touched. The diff, not hook exit codes, is the gate\nbecause a fixing hook that rewrites and exits 0 sails through an exit-code\ncheck.", "rejected": ["chase the formatters' output in the templates — the\nconfig is pinned to make the written layout canonical instead."], "consequence": "hand-aligned trailing comments and hand-wrapped folded scalars\nare unavailable; a conditional block in rendered YAML/TOML requires thinking\nabout whitespace control; the pinned knobs fail loudly if a release changes\nthem.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-testing.md#collection-literals-are-rendered-through-one-shared-macro", "uuid": "47b21a49-5fc4-46b8-b450-7d9f3225706c", "file": "template-testing.md", "line": 81, "end_line": 106, "title": "Collection literals are rendered through one shared macro", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-030, 2026-09 amendment (`docs/adr/030-generated-files-must-be-formatter-canonical.md`); the agent-prose macros in the same file are recorded in ADR-035", "verification": null, "revisit_when": "ruff-format changes its magic-trailing-comma or width behaviour, or Copier gains a way to share helpers inside `_subdirectory`", "see": [{"locator": "template-testing.md#generated-files-must-be-formatter-canonical-not-merely-valid", "uuid": "9b931598-7e52-4ff1-bb07-ef65c01d5369", "date": "2026-10-11", "file": "template-testing.md", "anchor": "generated-files-must-be-formatter-canonical-not-merely-valid", "remote": null}], "superseded_by": null, "body": {"text": "`py_collection(name, items, kind)` in `_macros.jinja` emits a tuple or list\nliteral in the form ruff-format produces: one line when the statement fits in\n88 columns, one element per line otherwise. The file sits at the repository\nroot, outside `_subdirectory`, and templates import it on their first line. It\nis used for `__all__`, the dependency allowlists and the guard tuples.\n\n**Reason:** a literal rendered from a Jinja loop has no single correct spelling\n— the width depends on values known only at render time (package name, broker\nmodule, component count) — so a template that always emits one form ships a\nfile the adopter's first hook run rewrites. Outside `_subdirectory` the file is\nan input Copier can never render into a project and needs no `_exclude`\noverride, which would replace Copier's default exclude list wholesale.\n\n**Rejected alternative:** a second hand-written copy of the width branch — the\ndrift this replaced.", "reason": "a literal rendered from a Jinja loop has no single correct spelling\n— the width depends on values known only at render time (package name, broker\nmodule, component count) — so a template that always emits one form ships a\nfile the adopter's first hook run rewrites. Outside `_subdirectory` the file is\nan input Copier can never render into a project and needs no `_exclude`\noverride, which would replace Copier's default exclude list wholesale.", "rejected": ["a second hand-written copy of the width branch — the\ndrift this replaced."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-testing.md#tools-render-py-is-the-only-place-the-template-is-rendered", "uuid": "f41fa3a2-20e2-4ba5-a3d0-c53a0074a9d0", "file": "template-testing.md", "line": 107, "end_line": 138, "title": "`tools/render.py` is the only place the template is rendered", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "ADR-031 §1 (`docs/adr/031-single-render-entrypoint.md`); issues #181, #183, #164, #184", "verification": null, "revisit_when": "Copier's API changes, or a root `pyproject.toml` appears (it must keep the repo root importable under pytest)", "see": [{"locator": "template-testing.md#render-and-inspect-is-the-fast-matrixed-layer-generate-and-run-stays-separate", "uuid": "c9bcdf52-af5d-4438-9c9f-d55e8226812c", "date": "2026-10-11", "file": "template-testing.md", "anchor": "render-and-inspect-is-the-fast-matrixed-layer-generate-and-run-stays-separate", "remote": null}], "superseded_by": null, "body": {"text": "A plain Python module with PEP 723 metadata wraps `copier.run_copy`. The render\nharness fixture, the generate-and-run CI matrix, the committed docs artifacts,\nthe watch loop and the mise tasks all call it. Answers layer as a neutral\nidentity, then `--data-file`, then explicit answers; programmatic renders use\nonly the neutral identity so golden files stay stable regardless of a\nmaintainer's own example input. The CI matrix's kitchen-sink scenario is\nspelled as the `full` preset rather than a hand-listed toggle set.\n\n**Reason:** \"render this template with these answers\" had forked into the\nharness, an inline CI invocation, the example task and three proposals each\nadding a script — six spellings where the answers baseline, the `vcs_ref` or\nthe defaults handling can quietly disagree, and a CI matrix rendering a shape\nno other consumer can reproduce. A Python module, not a shell script, because\nthe pytest harness must import the same code path. The preset spelling means a\ncomponent added to `full` is exercised end-to-end without editing the matrix.\n\n**Rejected alternative:** per-purpose shell scripts — two renderers again.\n\n**Consequence:** adding another `copier copy` invocation is a review defect; a\nnew consumer imports `render()` or calls the CLI.", "reason": "\"render this template with these answers\" had forked into the\nharness, an inline CI invocation, the example task and three proposals each\nadding a script — six spellings where the answers baseline, the `vcs_ref` or\nthe defaults handling can quietly disagree, and a CI matrix rendering a shape\nno other consumer can reproduce. A Python module, not a shell script, because\nthe pytest harness must import the same code path. The preset spelling means a\ncomponent added to `full` is exercised end-to-end without editing the matrix.", "rejected": ["per-purpose shell scripts — two renderers again."], "consequence": "adding another `copier copy` invocation is a review defect; a\nnew consumer imports `render()` or calls the CLI.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-testing.md#the-generated-project-tree-page-is-a-committed-derived-artifact-with-two-drift-guards", "uuid": "54918c4d-49dd-4ce8-94a6-3d472010173f", "file": "template-testing.md", "line": 139, "end_line": 171, "title": "The generated-project tree page is a committed derived artifact with two drift guards", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-031 §2–3 (`docs/adr/031-single-render-entrypoint.md`); generalizes the cobo drift-guard posture of ADR-012", "verification": null, "revisit_when": "copier is pinned in the render path, or another derived artifact joins `regenerate`", "see": [{"locator": "template-testing.md#toolsrenderpy-is-the-only-place-the-template-is-rendered", "uuid": "f41fa3a2-20e2-4ba5-a3d0-c53a0074a9d0", "date": "2026-10-11", "file": "template-testing.md", "anchor": "toolsrenderpy-is-the-only-place-the-template-is-rendered", "remote": null}, {"locator": "ci-topology.md#network-dependent-checks-run-on-a-weekly-cron-never-in-the-merge-gate", "uuid": "3e5b9525-9087-4125-b19f-80f6c226c01f", "date": "2026-10-11", "file": "ci-topology.md", "anchor": "network-dependent-checks-run-on-a-weekly-cron-never-in-the-merge-gate", "remote": null}, {"locator": "gitignore-generation.md#cobo-generates-the-gitignore-with-a-hash-sealed-fence-and-lockfiles", "uuid": "3e3bc38e-bc1e-4e65-b74d-e91848262157", "date": "2026-10-11", "file": "gitignore-generation.md", "anchor": "cobo-generates-the-gitignore-with-a-hash-sealed-fence-and-lockfiles", "remote": null}], "superseded_by": null, "body": {"text": "`regenerate` renders the four presets and writes the exact file set each\nproduces into `docs/generated-project-trees.md`, committed, plain fenced blocks.\nTwo guards, one per direction of drift: a blocking test in `render-tests`\nasserts the committed page equals a fresh render (this repo changed), and a\nweekly non-blocking `artifact-drift.yml` regenerates and diffs (the toolchain\nchanged underneath, since copier is installed unpinned). Golden files are not\nfolded into `regenerate`.\n\n**Reason:** the documented structure of a generated project is the first thing\na scaffolding template's docs get wrong, and a hand-maintained page cannot\nshow \"this toggle adds these five files\" as review signal. Committed rather\nthan built into a gitignored directory precisely for that diff; `example/`\nstays gitignored because a diff-based guard cannot apply to an untracked tree.\nA PR-time check cannot see a new copier release changing the output with no\ncommit here. Golden files already have the same job and their own regeneration\npath.\n\n**Consequence:** a PR changing what a preset renders must regenerate the page\nor fail `render-tests`; `regenerate` is the extension point for future derived\nartifacts.", "reason": "the documented structure of a generated project is the first thing\na scaffolding template's docs get wrong, and a hand-maintained page cannot\nshow \"this toggle adds these five files\" as review signal. Committed rather\nthan built into a gitignored directory precisely for that diff; `example/`\nstays gitignored because a diff-based guard cannot apply to an untracked tree.\nA PR-time check cannot see a new copier release changing the output with no\ncommit here. Golden files already have the same job and their own regeneration\npath.", "rejected": [], "consequence": "a PR changing what a preset renders must regenerate the page\nor fail `render-tests`; `regenerate` is the extension point for future derived\nartifacts.", "considered": null, "why_open": null}, "refs": ["ci-topology.md", "gitignore-generation.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-testing.md#the-watch-loop-is-an-authoring-aid-whose-target-is-validated-before-every-rebake", "uuid": "36ddff82-32d4-4234-a9cf-ea40d694df58", "file": "template-testing.md", "line": 172, "end_line": 190, "title": "The watch loop is an authoring aid whose target is validated before every rebake", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-031 §5 (`docs/adr/031-single-render-entrypoint.md`)", "verification": null, "revisit_when": "the rebake stops removing its target tree", "see": [{"locator": "template-testing.md#toolsrenderpy-is-the-only-place-the-template-is-rendered", "uuid": "f41fa3a2-20e2-4ba5-a3d0-c53a0074a9d0", "date": "2026-10-11", "file": "template-testing.md", "anchor": "toolsrenderpy-is-the-only-place-the-template-is-rendered", "remote": null}], "superseded_by": null, "body": {"text": "`watch` re-renders into a gitignored directory on every save under the template\nsources and survives a failed render. Its output path is rejected when it\ntouches a watched source in either direction, or when it is a non-empty\ndirectory without a `.copier-answers.yml`. `watchfiles` is supplied by the mise\ntask, not declared by the script.\n\n**Reason:** each rebake removes its target tree. \"Do not delete what this tool\ndid not render\" is checkable; enumerating which directories are precious is\nnot. No other consumer should pay for a dependency only the loop needs.", "reason": "each rebake removes its target tree. \"Do not delete what this tool\ndid not render\" is checkable; enumerating which directories are precious is\nnot. No other consumer should pay for a dependency only the loop needs.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-updates.md#renovate-s-copier-manager-delivers-downstream-updates-the-template-keeps-release-please-as-its-tag-source", "uuid": "f26da4b3-8b97-4cfc-9aba-64eba4acf04f", "file": "template-updates.md", "line": 3, "end_line": 42, "title": "Renovate's copier manager delivers downstream updates; the template keeps release-please as its tag source", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-015 (`docs/adr/015-template-self-versioning-and-copier-update-automation.md`); prompted by [hwid#113](https://github.com/hasansezertasan/hwid/pull/113)", "verification": null, "revisit_when": "Renovate fails its artifacts check on conflict markers ([renovate#31600](https://github.com/renovatebot/renovate/issues/31600)), or the copier manager accepts Copier's `gh:` shorthand", "see": [{"locator": "release-automation.md#release-please-is-the-sole-release-orchestrator", "uuid": "7ec8a937-fd4d-41f2-96b7-824fe3be913b", "date": "2026-10-11", "file": "release-automation.md", "anchor": "release-please-is-the-sole-release-orchestrator", "remote": null}, {"locator": "template-updates.md#copieryml-defines-no-_tasks", "uuid": "86130379-1660-4992-8aba-8b6cd7b4a9f7", "date": "2026-10-11", "file": "template-updates.md", "anchor": "copieryml-defines-no-_tasks", "remote": null}], "superseded_by": null, "body": {"text": "Generated projects receive template updates through Renovate's first-party\n`copier` manager, which watches the template's git tags, runs the real\n`copier update` and opens a PR. No bespoke workflow ships. This repository's\nown release-please therefore must keep cutting tags — they are the datasource.\nScaffolding uses the `.git` HTTPS URL because the `gh:` shorthand is not a git\nURL and the `git-tags` datasource rejects it silently.\n\n**Reason:** nothing in a generated project watched for template changes and the\ntemplate published no tags, so a default `copier update` found nothing. The\ntemplate already ships Renovate as the canonical updater; its App token can\npush workflow files (the repo `GITHUB_TOKEN` cannot), and its PRs flow through\nthe existing dashboard and review. Tags are cheap since release-please already\nruns and give adopters a changelog besides.\n\n**Rejected alternative:** a bespoke `copier-update.yml` workflow — ~50 lines of\nsecurity-sensitive YAML per project, and its default token cannot push\n`.github/workflows/*`, forcing every consumer to provision a PAT.\n\n**Rejected alternative:** `fohte/copier-update-action` — the bespoke workflow as\na third-party action, same token and conflict characteristics, plus an external\naction to trust with `--trust`.\n\n**Rejected alternative:** drop the template's own versioning and track HEAD —\nthe copier manager is tag-based, so release-please is the price of Renovate.\n\n**Consequence:** a copier-update PR can look mergeable while carrying conflict\nmarkers; maintainers review for them. A repo pinned to a raw SHA needs one\nmanual update to re-anchor onto a tag.", "reason": "nothing in a generated project watched for template changes and the\ntemplate published no tags, so a default `copier update` found nothing. The\ntemplate already ships Renovate as the canonical updater; its App token can\npush workflow files (the repo `GITHUB_TOKEN` cannot), and its PRs flow through\nthe existing dashboard and review. Tags are cheap since release-please already\nruns and give adopters a changelog besides.", "rejected": ["a bespoke `copier-update.yml` workflow — ~50 lines of\nsecurity-sensitive YAML per project, and its default token cannot push\n`.github/workflows/*`, forcing every consumer to provision a PAT.", "`fohte/copier-update-action` — the bespoke workflow as\na third-party action, same token and conflict characteristics, plus an external\naction to trust with `--trust`.", "drop the template's own versioning and track HEAD —\nthe copier manager is tag-based, so release-please is the price of Renovate."], "consequence": "a copier-update PR can look mergeable while carrying conflict\nmarkers; maintainers review for them. A repo pinned to a raw SHA needs one\nmanual update to re-anchor onto a tag.", "considered": null, "why_open": null}, "refs": ["release-automation.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-updates.md#copier-yml-defines-no-tasks", "uuid": "86130379-1660-4992-8aba-8b6cd7b4a9f7", "file": "template-updates.md", "line": 43, "end_line": 65, "title": "`copier.yml` defines no `_tasks`", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "ADR-015 (`docs/adr/015-template-self-versioning-and-copier-update-automation.md`); the constraint is re-affirmed in ADR-018, ADR-023, ADR-024 and ADR-035", "verification": null, "revisit_when": "the hosted Renovate App allows `--trust`, or Copier marks tasks safe", "see": [{"locator": "template-updates.md#renovates-copier-manager-delivers-downstream-updates-the-template-keeps-release-please-as-its-tag-source", "uuid": "f26da4b3-8b97-4cfc-9aba-64eba4acf04f", "date": "2026-10-11", "file": "template-updates.md", "anchor": "renovates-copier-manager-delivers-downstream-updates-the-template-keeps-release-please-as-its-tag-source", "remote": null}], "superseded_by": null, "body": {"text": "The template has no post-copy tasks; the former `git init` task is gone and\nthe scaffold instructions tell the adopter to run it. Every later feature that\nneeds a post-render step (the repo-setup skill, the render harness, the ai-rulez\ngenerator) is a rendered file or a documented command, never a task.\n\n**Reason:** any task marks a template unsafe and forces `--trust`, which\nRenovate gates behind a self-hosted-only setting the hosted App disables — a\ntask-bearing template makes the hosted App's `copier update` fail.\n\n**Rejected alternative:** keep the `git init` task — breaks the update path for\nevery hosted-Renovate adopter.", "reason": "any task marks a template unsafe and forces `--trust`, which\nRenovate gates behind a self-hosted-only setting the hosted App disables — a\ntask-bearing template makes the hosted App's `copier update` fail.", "rejected": ["keep the `git init` task — breaks the update path for\nevery hosted-Renovate adopter."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-updates.md#shipped-template-pins-are-frozen-from-this-repository-s-renovate", "uuid": "86e0af71-9614-42c1-9363-d16170d942a8", "file": "template-updates.md", "line": 66, "end_line": 105, "title": "Shipped `template/**` pins are frozen from this repository's Renovate", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "ADR-020 (`docs/adr/020-freeze-shipped-template-pins-from-renovate.md`); the confirmed conflict source was [PR #196](https://github.com/hasansezertasan/copier-pyproject/pull/196)", "verification": null, "revisit_when": "seed staleness becomes a security concern faster than downstream Renovate catches up, or Renovate learns to skip lines the downstream already moved", "see": [{"locator": "template-updates.md#renovates-copier-manager-delivers-downstream-updates-the-template-keeps-release-please-as-its-tag-source", "uuid": "f26da4b3-8b97-4cfc-9aba-64eba4acf04f", "date": "2026-10-11", "file": "template-updates.md", "anchor": "renovates-copier-manager-delivers-downstream-updates-the-template-keeps-release-please-as-its-tag-source", "remote": null}], "superseded_by": null, "body": {"text": "A `packageRules` entry in `.github/renovate.json` matches `template/**` and\ndisables updates there. Shipped version literals (action SHAs, prek `rev` pins,\nmise tool versions, dependency pins) are seed values only; each generated\nproject's own Renovate owns them afterwards. This repository's root workflows,\n`prek.toml` and `mise.toml` stay Renovate-managed.\n\n**Reason:** `copier update` is a 3-way merge per file, and a pinned line\nconflicts when both sides moved it to different values. Both repositories'\nbots advanced the same literals on independent schedules, so copier-update PRs\nconflicted on nearly every release — and Renovate does not fail on those\nconflicts, so a PR looked mergeable with markers inside. With the template\nfrozen, \"theirs\" equals \"base\" on every pin line and the downstream's value\nwins cleanly: the conflict class is eliminated structurally. `matchFileNames`\nplus `enabled: false` rather than `ignorePaths` preserves the shared preset's\nown ignore list and composes with its digest-pinning policy.\n\n**Rejected alternative:** auto-resolve in the downstream's favour via a\n`merge=ours` driver or copier `_exclude` — `_exclude` is whole-file and would\nblock genuine template changes; a per-downstream merge driver is fragile.\n\n**Rejected alternative:** converge by cadence (group bumps, release\nimmediately) — only shrinks the race window.\n\n**Consequence:** new projects start with slightly stale but valid seeds and\ntheir own Renovate opens catch-up PRs; refreshing seeds before a release is a\ndeliberate act that reintroduces conflicts for projects not yet caught up.\nRe-enabling Renovate for `template/**` reads as fixing staleness but rebuilds\nthe conflict engine.", "reason": "`copier update` is a 3-way merge per file, and a pinned line\nconflicts when both sides moved it to different values. Both repositories'\nbots advanced the same literals on independent schedules, so copier-update PRs\nconflicted on nearly every release — and Renovate does not fail on those\nconflicts, so a PR looked mergeable with markers inside. With the template\nfrozen, \"theirs\" equals \"base\" on every pin line and the downstream's value\nwins cleanly: the conflict class is eliminated structurally. `matchFileNames`\nplus `enabled: false` rather than `ignorePaths` preserves the shared preset's\nown ignore list and composes with its digest-pinning policy.", "rejected": ["auto-resolve in the downstream's favour via a\n`merge=ours` driver or copier `_exclude` — `_exclude` is whole-file and would\nblock genuine template changes; a per-downstream merge driver is fragile.", "converge by cadence (group bumps, release\nimmediately) — only shrinks the race window."], "consequence": "new projects start with slightly stale but valid seeds and\ntheir own Renovate opens catch-up PRs; refreshing seeds before a release is a\ndeliberate act that reintroduces conflicts for projects not yet caught up.\nRe-enabling Renovate for `template/**` reads as fixing staleness but rebuilds\nthe conflict engine.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-updates.md#retired-template-modules-become-adopter-owned", "uuid": "4dd6729a-697e-4588-a7a7-d37152018b6b", "file": "template-updates.md", "line": 106, "end_line": 140, "title": "Retired template modules become adopter-owned", "type": ["decision", "constraint"], "status": "active", "evidence": "confirmed", "source": "[PR #333](https://github.com/hasansezertasan/copier-pyproject/pull/333), [version-sweep results](https://github.com/hasansezertasan/copier-pyproject/pull/333#issuecomment-5932489770); commits [c150ec3](https://github.com/hasansezertasan/copier-pyproject/commit/c150ec30519c1e1ddcc3fb05ffc7ea3ba4e85709) and [0f7a406](https://github.com/hasansezertasan/copier-pyproject/commit/0f7a4062c251828f00fb27f91d8648d13d4e339d)", "verification": "corroborated — `copier.yml` excludes the retired paths and requires Copier 9.10.3; the update skill records the same compatibility floor", "revisit_when": "Copier changes update-deletion semantics or a retired module is rendered again", "see": [{"locator": "components.md#one-application-payload-in-coreapppy-components-are-adapters-over-it", "uuid": "8bb1e55e-f468-44fc-80a5-d3b3719e5ddc", "date": "2026-10-11", "file": "components.md", "anchor": "one-application-payload-in-coreapppy-components-are-adapters-over-it", "remote": null}], "superseded_by": null, "body": {"text": "The dropped `utils/app.py` and library-only `core/app.py` placeholders are\nexcluded from updates, leaving existing copies under the adopter's ownership.\nThe custom exclusion list explicitly retains Copier's default exclusions because\n`_exclude` replaces that list rather than extending it.\n\n**Reason:** an adopter can have replaced a placeholder with real application\ncode. Removing the template file can delete that edited copy without conflict\nmarkers or reject files, so ordinary conflict review cannot catch the loss.\nThe recorded version sweep found that Copier 9.6.0–9.10.2 still deleted the\nexcluded files; 9.10.3 and later preserved them. The version floor makes an older\nCopier refuse the update instead of silently deleting adopter code.\n\n**Rejected alternative:** let normal template deletion remove the old modules.\nRejected because the files may no longer be empty placeholders in the adopter.\n\n**Rejected alternative:** use exclusions without raising the Copier minimum.\nRejected because the version sweep showed the protection was ineffective on\nolder supported versions.\n\nThe architectural reason for retiring the placeholders is the shared\napplication payload entry in `components.md`; this entry records the distinct\nownership and update-safety constraint.", "reason": "an adopter can have replaced a placeholder with real application\ncode. Removing the template file can delete that edited copy without conflict\nmarkers or reject files, so ordinary conflict review cannot catch the loss.\nThe recorded version sweep found that Copier 9.6.0–9.10.2 still deleted the\nexcluded files; 9.10.3 and later preserved them. The version floor makes an older\nCopier refuse the update instead of silently deleting adopter code.", "rejected": ["let normal template deletion remove the old modules.\nRejected because the files may no longer be empty placeholders in the adopter.", " sting project behavior, rather than automatic authority to replace it.\nIt handles initial adoption, updates, and audits of already-committed updates;\nrepository-settings changes remain the responsibility of `repo-setup`.\n\n**Reason:** two workflows that both run prek can differ in event coverage and\nrequired-check identity. Consolidating them can discard manual dispatch or leave\nlive branch protection waiting for a check that no longer exists. A local\nruleset file alone cannot establish the live requirements. A post-update audit\ncan compare the actual committed baseline and diff without rerunning Copier and\ndisturbing the state being inspected.\n\n**Alternatives considered:** retain both workflows, accepting duplicate PR\nexecution, or consolidate after preserving event coverage and transitioning the\nrequired check. The documented walkthrough deliberately makes that choice\nconditional on the adopter's decision and evidence; neither option is rejected\nuniversally. Deletion without establishing equivalence is excluded because it\ncan silently remove functionality or block merges.\n\nThe execution procedure is in `docs/template-adoption.md`.", "reason": "two workflows that both run prek can differ in event coverage and\nrequired-check identity. Consolidating them can discard manual dispatch or leave\nlive branch protection waiting for a check that no longer exists. A local\nruleset file alone cannot establish the live requirements. A post-update audit\ncan compare the actual committed baseline and diff without rerunning Copier and\ndisturbing the state being inspected.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": ["repo-setup.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-updates.md#which-reconciliation-policy-governs-machine-config-and-ci-conflicts", "uuid": "3f155d92-8518-4294-bfcd-26251c36e2e1", "file": "template-updates.md", "line": 173, "end_line": 192, "title": "Which reconciliation policy governs machine-config and CI conflicts?", "type": ["constraint"], "status": "superseded", "evidence": "unknown", "source": "`skills/update/SKILL.md`, Shared reconciliation; the shipped `template-adoption` skill; [PR #349](https://github.com/hasansezertasan/copier-pyproject/pull/349)", "verification": "uncorroborated — the original justification for category-based precedence could not be established; the conflicting wording found during recovery has since been replaced", "revisit_when": null, "see": [{"locator": "template-updates.md#adoption-audits-preserve-behavior-before-consolidating-workflows", "uuid": "dfd6cd98-9d07-4dc4-b58f-d1343d636ea4", "date": "2026-10-08", "file": "template-updates.md", "anchor": "adoption-audits-preserve-behavior-before-consolidating-workflows", "remote": null}], "superseded_by": "9a6bf00c-33c1-4f0c-962e-7e960f9d2d58", "body": {"text": "At recovery, the two skills coexisted with conflicting guidance: the older\nupdate skill selected template-side CI/config hunks by category, while the newer\nadoption skill required behavioral preservation and decisions before\nconsequential cleanup. The reviewed historical sources did not establish which\npolicy governed their overlap or justify the older precedence rule.\n\nThe question has been resolved by the current decision below, rather than by\nclaiming to have recovered the original justification.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "status_history": [{"status": "superseded", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "template-updates.md#update-and-adoption-skills-share-preservation-first-reconciliation", "uuid": "9a6bf00c-33c1-4f0c-962e-7e960f9d2d58", "file": "template-updates.md", "line": 193, "end_line": 232, "title": "Update and adoption skills share preservation-first reconciliation", "type": ["decision"], "status": "superseded", "evidence": "confirmed", "source": "maintainer-approved reconciliation-policy review, 2026-10-08; `docs/template-adoption.md`; `skills/update/SKILL.md`", "verification": "corroborated — the older update skill now preserves custom behavior, requires evidence for equivalence, and delegates repository-settings transitions to `repo-setup`", "revisit_when": "either skill changes its scope or introduces a conflicting reconciliation policy", "see": [{"locator": "template-updates.md#adoption-audits-preserve-behavior-before-consolidating-workflows", "uuid": "dfd6cd98-9d07-4dc4-b58f-d1343d636ea4", "date": "2026-10-08", "file": "template-updates.md", "anchor": "adoption-audits-preserve-behavior-before-consolidating-workflows", "remote": null}], "superseded_by": "e4cd1c46-28c3-4241-82c8-d5aac41c293f", "body": {"text": "Superseded on 2026-10-12 by [the companion-skill retirement decision](companion-skills.md#every-lifecycle-skill-ships-through-the-template).\nThe generated `template-adoption` skill retains the preservation-first contract;\nthe separate root `skills/update` delivery surface is retired.\n\nAt the time of this decision, both skills used the same preservation-first contract.\nThe older update skill ran or reconciled updates; the generated adoption skill additionally handled\ninitial adoption and audits of completed updates. Those workflow differences do\nnot justify opposite advice about the same project customization.\n\n**Reason:** file category does not establish behavioral equivalence. CI and\nmachine configuration can encode adopter-specific event coverage, permissions,\nrequired-check identity, hooks, and dependencies. Replacing a hunk on the basis\nof its category can discard functioning customizations despite a green lint run.\nRoutine maintenance can proceed directly when equivalence is established within\nthe requested update; consequential behavior changes need an explicit decision.\n\nThe contract applies to clean merges as well as conflicts. Recovery uses the\nactual pre-update snapshot and preserves later edits: a current base branch can\nlack branch-owned release history, while the index may already hold the reset.\n\n**Rejected alternative:** retain automatic template precedence for CI/config\nhunks. It gives template origin more authority than evidence of the adopter's\nexisting behavior. Even action digest updates require checking release effects\nand preserving configured inputs rather than assuming equivalence from the SHA.\n\nRepository-settings transitions remain with `repo-setup`; the reconciliation\nprocedure is in the skills, not duplicated here. The former policy's historical\njustification remains unknown in the superseded record above.", "reason": "file category does not establish behavioral equivalence. CI and\nmachine configuration can encode adopter-specific event coverage, permissions,\nrequired-check identity, hooks, and dependencies. Replacing a hunk on the basis\nof its category can discard functioning customizations despite a green lint run.\nRoutine maintenance can proceed directly when equivalence is established within\nthe requested update; consequential behavior changes need an explicit decision.", "rejected": ["retain automatic template precedence for CI/config\nhunks. It gives template origin more authority than evidence of the adopter's\nexisting behavior. Even action digest updates require checking release effects\nand preserving configured inputs rather than assuming equivalence from the SHA."], "consequence": null, "considered": null, "why_open": null}, "refs": ["companion-skills.md"], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-12", "commit": "7d7ce45"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "templating-engine.md#copier-over-cookiecutter-cruft-yeoman-and-github-template-repositories", "uuid": "25fa2def-a118-4f60-9117-89ab50da4cf2", "file": "templating-engine.md", "line": 3, "end_line": 36, "title": "Copier over Cookiecutter, Cruft, Yeoman and GitHub template repositories", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "ADR-001 (`docs/adr/001-copier-over-cookiecutter.md`)", "verification": null, "revisit_when": "`copier update` stops being a first-class feature, or a Python-native alternative gains native template-update support", "see": [], "superseded_by": null, "body": {"text": "Copier renders this template. Generated projects carry a `.copier-answers.yml`\nand pull later template changes with `copier update`.\n\n**Reason:** native update support matters most for a template that keeps\nevolving — adopters pull new features, CI improvements and dependency updates\ninstead of re-applying them by hand. Conditional file inclusion via filename\npatterns is cleaner than hook-based approaches, the answers file makes updates\nreproducible, and full Jinja2 (whitespace control, raw blocks for GitHub Actions\nsyntax) is required by the workflow templates. Copier is actively maintained and\naligned with the uv/hatchling ecosystem the generated projects use.\n\n**Rejected alternative:** Cookiecutter — the largest ecosystem, but no native\nupdate/sync; pulling upstream changes is manual work.\n\n**Rejected alternative:** Cruft — adds `cruft update`/`cruft check` on top of\nCookiecutter, but as a wrapp ge changes how `paths` remapping works", "see": [{"locator": "testing-strategy.md#interactive-components-expose-injected-driver-seams-so-headless-ci-measures-everything-but-the-blocking-call", "uuid": "ffcf90f2-34c7-4673-bbe2-5619c6b23128", "date": "2026-10-11", "file": "testing-strategy.md", "anchor": "interactive-components-expose-injected-driver-seams-so-headless-ci-measures-everything-but-the-blocking-call", "remote": null}], "superseded_by": null, "body": {"text": "Reachable error handling (web 503s, CLI exit codes, GUI/TUI \"unknown\"\ndegradation, MCP error text) is unit-tested. Only irreducible blocking calls,\nthe `__main__` dispatchers, the c-extension `except ImportError` fallback and\nthe worker's module-level metadata fallback carry a per-site\n`# pragma: no cover`. The\n`omit` globs are `*/`-anchored (`*/_version.py`, `*/worker/test_integration.py`,\nthe latter directory-anchored), and `[tool.coverage.paths]` maps\n`*/site-packages/<pkg>` back onto `src/<pkg>`.\n\n**Reason:** testing the worker exposed that *no* optional-component project\nreached the 99% gate out of the box, because entrypoints and fallbacks were\nunexercised and the example input disabled every component. An earlier\niteration excluded them with blanket `exclude_lines` regexes (`def main(`,\n`except PackageNotFoundError`); a regex matching a `def` line excludes the\nwhole function body, which silently un-measured the *tested* GUI/TUI\nentrypoints and web handlers — the gate became blind to what it protects. Two\nfurther defects were universal: a `src/**`-anchored omit missed the installed\ncopy and reported `_version.py` at 0%, and a paths mapping that never matched\ntox's per-env `site-packages` kept a separate copy per interpreter so a\nversion-gated line covered in one counted as missed. Both are invisible under\neditable `pytest` and appear only under a real multi-env `tox run`.\n\n**Rejected alternative:** blanket `exclude_lines` regexes — the blindness above.\n\n**Consequence:** coverage is verified only via the installed-package `tox run`\npath; after the fix every component and the base project report 100%.", "reason": "testing the worker exposed that *no* optional-component project\nreached the 99% gate out of the box, because entrypoints and fallbacks were\nunexercised and the example input disabled every component. An earlier\niteration excluded them with blanket `exclude_lines` regexes (`def main(`,\n`except PackageNotFoundError`); a regex matching a `def` line excludes the\nwhole function body, which silently un-measured the *tested* GUI/TUI\nentrypoints and web handlers — the gate became blind to what it protects. Two\nfurther defects were universal: a `src/**`-anchored omit missed the installed\ncopy and reported `_version.py` at 0%, and a paths mapping that never matched\ntox's per-env `site-packages` kept a separate copy per interpreter so a\nversion-gated line covered in one counted as missed. Both are invisible under\neditable `pytest` and appear only under a real multi-env `tox run`.", "rejected": ["blanket `exclude_lines` regexes — the blindness above."], "consequence": "coverage is verified only via the installed-package `tox run`\npath; after the fix every component and the base project report 100%.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-12", "commit": "875a972"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-11", "commit": "5bdf627"}]}, "findings": []}, {"id": "testing-strategy.md#interactive-components-expose-injected-driver-seams-so-headless-ci-measures-everything-but-the-blocking-call", "uuid": "ffcf90f2-34c7-4673-bbe2-5619c6b23128", "file": "testing-strategy.md", "line": 121, "end_line": 161, "title": "Interactive components expose injected driver seams so headless CI measure d resolution, error handling and dispatch glue,\nso a regression there slipped through and the line between irreducible and\ntestable was blurred. A seam is one default argument and one call — no\nregistry, no runtime cost — and does not cross component boundaries.\n\n**Rejected alternative:** monkeypatching the private default helper — Python\nbinds a default argument at definition time, so patching the module attribute\nsilently no-ops; the driver must be passed. Monkeypatching stays correct for\nthe CLI dispatchers, which look their target up at call time.\n\n**Consequence:** two deliberate behaviour changes: the TUI imports `textual` at\nmodule scope, so a missing Textual raises on import instead of degrading to\nstdout (a hard dependency being absent is a broken install), and the GUI\ncatches `Exception` around an injected driver while keeping its specific\n\"Tkinter not available\" arm first.", "reason": "the entrypoints previously carried broad `# pragma: no cover` over\nsetup, widget composition, bind resolution, error handling and dispatch glue,\nso a regression there slipped through and the line between irreducible and\ntestable was blurred. A seam is one default argument and one call — no\nregistry, no runtime cost — and does not cross component boundaries.", "rejected": ["monkeypatching the private default helper — Python\nbinds a default argument at definition time, so patching the module attribute\nsilently no-ops; the driver must be passed. Monkeypatching stays correct for\nthe CLI dispatchers, which look their target up at call time."], "consequence": "two deliberate behaviour changes: the TUI imports `textual` at\nmodule scope, so a missing Textual raises on import instead of degrading to\nstdout (a hard dependency being absent is a broken install), and the GUI\ncatches `Exception` around an injected driver while keeping its specific\n\"Tkinter not available\" arm first.", "considered": null, "why_open": null}, "refs": ["components.md"], "git": {"cr /* Keep the Why dashboard — the pure part of the page: no DOM, no fetch,
   no state. Imported by app.js, inlined into an export, unit-tested with

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const plural = (n, w) => `${n} ${n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + "ies" : w + "s"}`; // entry → entries, repository → repositories

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

const isUuid = (s) => UUID_RE.test(s || "");

// Raw-file URL of a repository file at HEAD, per host — the second and last
// place host grammar lives (the first is hostFileLink below). Public mode
// reads one file this way: a family member's .keep-the-why, for its
// dashboard-state line.
function rawFileUrl(canonical, root, path) {
  const base = canonical.replace(/\/$/, "");
  const rel = `${root ? root.replace(/\/$/, "") + "/" : ""}${path}`;
  const gh = base.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)$/);

          const local = ((await (await fetch("/api/projects", { cache: "no-store" })).json()).projects || []).find((p) => p.canonical === PUBLIC && p.dashboard_state);
          if (local) msg.append(el("p", { class: "note" }, `Your checkout at ${local.path} names ${local.dashboard_state} — on a branch that is not on the default branch yet. Public mode reads what is published: the line counts once it is merged, and the family once the published export carries it.`));
        } catch { /* not served by a live dashboard */ }
      }
      msg.append(el("p", {}, el("a", { href: location.pathname }, "back to local")));
      return;
    }
    r.state.exported = true;
    applyState(r.state);
    return;
  }
  setupProjects();
  if (window.__KTW_STATE__) { noteLoaded(location.href.split("#")[0], JSON.stringify(window.__KTW_STATE__), "page", { own: true }); applyState(normalizeState(window.__KTW_STATE__)); }
  else {
    try { const text = await (await fetch(api("/api/state.json"), { cache: "no-store" })).text(); noteLoaded(new URL(api("/api/state.json"), location.href).href, text, "state", { own: true }); applyState(normalizeState(JSON.parse(text))); }
    catch (err) { $("#main").append(el("p", { class: "center" }, PROJECT ? `No state for project "${PROJECT}" — unknown id or unknown location.` : "Could not load the state — is the server running?")); }
  }
  connectLive();
  pollUpdates(); setTimeout(pollUpdates, 20000); // the server's first check may still be running at boot
  setInterval(pollUpdates, 60 * 60 * 1000);
}
boot();

</script>

</html>
